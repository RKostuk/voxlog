<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script>
  /* KIT_JS */
</script>
<style>
  /* KIT_CSS */
</style>
<style>
  /* The quick-tasks drawer: a small always-on-top window next to the notch.
     It is not a second Tasks pane -- it shows what is still open, grouped by
     project, and takes one line of new text. Anything more (notes, source,
     reminders) is what the main window is for.

     The window is chromeless but focusable (see makeDrawerPanelC), so this
     page owns its own top bar: a title, and a close button that has to
     exist because there is no system one. */
  /* Everything else -- the labels, the separators, the accent, the scales,
     the status colours -- comes from kit.css above. Only these two differ,
     and they differ for a reason: this window floats over whatever is on
     screen, so its ground is translucent and its rows are opaque enough to
     read against anything. */
  :root {
    color-scheme: light dark;
    --bg: rgba(246, 246, 248, 0.92);
    --card: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: rgba(28, 28, 30, 0.94);
      --card: #2c2c2e;
    }
  }
  :root[data-theme="dark"] {
    --bg: rgba(28, 28, 30, 0.94);
    --card: #2c2c2e;
  }
  html, body { margin: 0; height: 100%; }
  body {
    font: var(--fs-body)/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif;
    color: var(--label);
    /* Flat, not the main window's ambient wash: there is a desktop behind
       this one, and the blur is already bending it. */
    background: var(--bg);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    backdrop-filter: blur(30px) saturate(180%);
    display: flex; flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* Drag handle: the window is movableByWindowBackground, and this strip is
     the part of it that obviously means "grab here". */
  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px 6px;
    border-bottom: 0.5px solid var(--separator);
    flex: none;
  }
  .bar .title { font-weight: 590; letter-spacing: -0.01em; }
  .bar .count { color: var(--tertiary); font-size: 11px; }
  .bar .grow { flex: 1; }
  .bar button {
    font: inherit; font-size: 12px; line-height: 1;
    border: none; background: none; color: var(--tertiary);
    cursor: pointer; padding: 3px 5px; border-radius: 5px;
  }
  .bar button:hover { background: var(--field); color: var(--label); }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 7px 10px 0; flex: none; }
  .chip {
    font-size: var(--fs-small); padding: 2px 8px; border-radius: var(--r-pill);
    background: var(--field); color: var(--secondary); cursor: pointer;
    border: none; font-family: inherit;
  }
  .chip.on { background: var(--accent); color: #fff; }

  .list { flex: 1; overflow-y: auto; padding: 8px 10px; }
  .group-name {
    display: flex; align-items: center; gap: 6px;
    font-size: var(--fs-caption); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
    color: var(--secondary); margin: var(--sp-5) 2px var(--sp-2);
  }
  .group-name:first-child { margin-top: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .card { background: var(--card); border-radius: var(--r-md); overflow: hidden; box-shadow: 0 0 0 0.5px var(--separator); }
  .row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 9px; border-top: 0.5px solid var(--separator);
  }
  .row:first-child { border-top: none; }
  .row .text { flex: 1; min-width: 0; line-height: 1.35; }
  .row.done .text { color: var(--tertiary); text-decoration: line-through; }
  /* Status is a click target, not a menu: the drawer is for moving a task
     along in one gesture, and the full four-way picker lives in the main
     window. */
  .row .status {
    flex: none; font-size: var(--fs-small); font-weight: var(--fw-bold);
    padding: 2px 7px; border-radius: var(--r-pill);
    background: var(--field); color: var(--secondary);
    border: none; font-family: inherit; cursor: pointer;
  }
  .row .status.status-in_progress { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .row .status.status-blocked { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red-ink); }
  .row .status.status-done { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green-ink); }

  .empty { color: var(--tertiary); text-align: center; padding: 18px 0; }

  /* The decode-queue line, shown only while something is transcribing. Kept
     to one line: the drawer has no room to list a queue, and "something is
     running" is the part that changes what the user does next. */
  .decoding {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 10px; flex: none;
    border-bottom: 0.5px solid var(--separator);
    font-size: 11px; color: var(--secondary);
  }
  .decoding .spin {
    width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .decoding .spin { animation: none; } }

  /* The composer. Three steps -- task, details, project -- one visible at a
     time, because the window is 340px wide and a three-field form in it reads
     as a form to fill in rather than a line to type. Enter goes forward,
     Escape folds the whole thing away and keeps what was typed. */
  .add { padding: 8px 10px; border-top: 0.5px solid var(--separator); flex: none; }
  .add input[type=text], .add textarea, .add select {
    width: 100%; box-sizing: border-box; font: inherit; color: var(--label);
    background: var(--card); border: 0.5px solid var(--separator);
    border-radius: 7px; padding: 5px 8px;
  }
  .add textarea { resize: none; line-height: 1.35; }
  .add input:focus, .add textarea:focus, .add select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .add [hidden] { display: none; }
  /* The step line: which of the three fields this is, and what Enter does
     next. Both are the whole reason the single field is not confusing. */
  .draft-head {
    display: flex; align-items: baseline; gap: 6px;
    font-size: var(--fs-caption); color: var(--tertiary);
    margin-bottom: 4px; min-width: 0;
  }
  .draft-head .step { font-weight: var(--fw-bold); color: var(--secondary); flex: none; }
  .draft-head .said {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--tertiary);
  }
  .draft-head .hint { flex: none; }
  /* Folded state: one button where the composer was, so the list gets the
     window back but the draft is still one keystroke away. */
  .draft-resume {
    width: 100%; text-align: left; font: inherit; cursor: pointer;
    color: var(--secondary); background: var(--field);
    border: 0.5px solid var(--separator); border-radius: 7px; padding: 5px 8px;
  }
  .draft-resume:hover { color: var(--label); }
  .draft-resume .dot-unsaved {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); margin-left: 5px; vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="title">Tasks</span>
    <span class="count" id="count"></span>
    <span class="grow"></span>
    <button type="button" id="open-main" title="Open the Tasks pane">Open ↗</button>
    <button type="button" id="close" title="Close">&#10005;</button>
  </div>
  <div id="decoding"></div>
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
  <div class="add">
    <div class="draft-head" id="draft-head" hidden>
      <span class="step" id="draft-step"></span>
      <span class="said" id="draft-said"></span>
      <span class="hint" id="draft-hint"></span>
    </div>
    <input type="text" id="draft-text" placeholder="What needs doing" autofocus>
    <textarea id="draft-notes" rows="2" placeholder="Details &mdash; optional" hidden></textarea>
    <select id="draft-entity" hidden></select>
    <button type="button" class="draft-resume" id="draft-resume" hidden></button>
  </div>

  <script>
    // Go replaces window.voxlog.tasks and calls render() on every change, so
    // this page never fetches anything on its own.
    window.voxlog = window.voxlog || {};
    var entityFilter = '';

    // escapeHtml, entityColor and taskStatusLabel come from kit.js, which is
    // spliced into this page and into the main window alike -- this file used
    // to carry its own copies, and they had drifted apart from the originals.
    // Clicking a status advances it. Done wraps back to To do, which is the
    // only way to undo a misclick without a menu.
    var NEXT_STATUS = { todo: 'in_progress', in_progress: 'done', blocked: 'todo', done: 'todo' };

    function openTasks() {
      return ((window.voxlog && window.voxlog.tasks) || []).filter(function (t) {
        return t.status !== 'done';
      });
    }

    function renderChips() {
      var names = [];
      openTasks().forEach(function (t) {
        var n = t.entity || 'Unfiltered';
        if (names.indexOf(n) === -1) names.push(n);
      });
      var root = document.getElementById('chips');
      if (names.length < 2) { root.innerHTML = ''; return; }
      root.innerHTML = ['<button type="button" class="chip' + (entityFilter ? '' : ' on') + '" data-entity="">All</button>']
        .concat(names.map(function (n) {
          return '<button type="button" class="chip' + (entityFilter === n ? ' on' : '') +
            '" data-entity="' + escapeHtml(n) + '">' + escapeHtml(n) + '</button>';
        })).join('');
      root.querySelectorAll('.chip').forEach(function (b) {
        b.addEventListener('click', function () {
          entityFilter = b.dataset.entity;
          render();
        });
      });
    }

    // Pushed by Go on every queue change (ui.PublishDecodeQueue), and set on
    // the page whenever the drawer is refreshed.
    function renderDecoding() {
      var q = (window.voxlog && window.voxlog.decodeQueue) || [];
      var root = document.getElementById('decoding');
      if (!q.length) { root.innerHTML = ''; return; }
      var running = q.filter(function (d) { return d.running; });
      var what = running.length ? running[running.length - 1].label : q[0].label;
      var waiting = q.length - running.length;
      root.innerHTML = '<div class="decoding"><span class="spin"></span>' +
        '<span>Transcribing ' + escapeHtml(what) +
        (waiting ? ' · ' + waiting + ' waiting' : '') + '</span></div>';
    }

    window.voxlog.onDecodeQueue = function (list) {
      window.voxlog.decodeQueue = list || [];
      renderDecoding();
    };

    function render() {
      renderDecoding();
      renderChips();
      var tasks = openTasks().filter(function (t) {
        return !entityFilter || (t.entity || 'Unfiltered') === entityFilter;
      });
      document.getElementById('count').textContent = tasks.length ? tasks.length + ' open' : '';

      var groups = [], byName = {};
      tasks.forEach(function (t) {
        var n = t.entity || 'Unfiltered';
        if (!(n in byName)) { byName[n] = groups.length; groups.push({ name: n, rows: [] }); }
        groups[byName[n]].rows.push(t);
      });
      groups.sort(function (a, b) { return (a.name === 'Unfiltered') - (b.name === 'Unfiltered'); });

      var root = document.getElementById('list');
      root.innerHTML = groups.length ? groups.map(function (g) {
        return '<div class="group-name"><span class="dot" style="background:' + entityColor(g.name) + '"></span>' +
            escapeHtml(g.name) + '</div>' +
          '<div class="card">' + g.rows.map(function (t) {
            return '<div class="row">' +
              '<div class="text">' + escapeHtml(t.text) + '</div>' +
              '<button type="button" class="status ' + taskStatusClass(t.status) + '" data-id="' + escapeHtml(t.id) +
                '" data-next="' + NEXT_STATUS[t.status] + '" title="Click to advance">' +
                escapeHtml(taskStatusLabel[t.status] || t.status) + '</button>' +
            '</div>';
          }).join('') + '</div>';
      }).join('') : '<div class="empty">Nothing open' + (entityFilter ? ' in this project' : '') + '.</div>';

      root.querySelectorAll('.status').forEach(function (b) {
        b.addEventListener('click', function () {
          b.disabled = true;
          window.drawerSetStatus(b.dataset.id, b.dataset.next);
        });
      });

      if (typeof refreshProjectOptions === 'function') refreshProjectOptions();
    }

    document.getElementById('close').addEventListener('click', function () { window.drawerClose(); });
    document.getElementById('open-main').addEventListener('click', function () { window.drawerOpenMain(); });

    // --- the composer ---------------------------------------------------
    // Three steps, one field on screen: task, details, project. Enter goes
    // forward and Enter on the last step files the task; Escape folds the
    // composer away without losing a word of it, so "let me just look at
    // what is already open" costs one key and no retyping. The draft lives
    // here rather than in the fields because folding hides them, and because
    // the window is only ordered out of sight when it closes (HideTasksDrawer
    // keeps the page alive) -- a half-written task survives every close and
    // reopen until the app itself quits.
    var STEPS = [
      { id: 'draft-text', step: '1/3 Task', hint: 'Enter for details' },
      { id: 'draft-notes', step: '2/3 Details', hint: 'Enter for project' },
      { id: 'draft-entity', step: '3/3 Project', hint: 'Enter to add' }
    ];
    var draft = { text: '', notes: '', entity: null, step: 0, folded: false };

    var textField = document.getElementById('draft-text');
    var notesField = document.getElementById('draft-notes');
    var entityField = document.getElementById('draft-entity');
    var resumeBtn = document.getElementById('draft-resume');
    var headEl = document.getElementById('draft-head');

    function fieldFor(step) { return document.getElementById(STEPS[step].id); }

    // Everything the user has typed, read back off whichever fields are on
    // screen. Called before any change that hides one.
    function readDraft() {
      draft.text = textField.value;
      draft.notes = notesField.value;
      if (!entityField.hidden) draft.entity = entityField.value;
    }

    function draftHasContent() {
      return !!(draft.text.trim() || draft.notes.trim());
    }

    // Every project the user has configured, not only the ones already in
    // use: filing a task under a project that has none yet is most of what
    // the picker is for. window.voxlog.projects is the Settings dictionary,
    // pushed by Go with the task list.
    function projectNames() {
      var names = [];
      ((window.voxlog && window.voxlog.projects) || []).forEach(function (n) {
        if (n && names.indexOf(n) === -1) names.push(n);
      });
      ((window.voxlog && window.voxlog.tasks) || []).forEach(function (t) {
        if (t.entity && names.indexOf(t.entity) === -1) names.push(t.entity);
      });
      names.sort();
      return names;
    }

    // The default project is the chip that is on, if one is: a task added
    // while the list is filtered to a project belongs to that project, which
    // is what the chip was saying all along. entity stays null until either
    // that or the user has picked, so switching chips before step 3 still
    // moves the default.
    function defaultEntity() {
      return entityFilter === 'Unfiltered' ? '' : entityFilter;
    }

    // Rebuilt on every list refresh as well as on every step, because the
    // dictionary and the projects in use both come from Go and both change
    // under the drawer. Only the <option>s are touched: a refresh landing
    // while someone types must not reach the text they are typing.
    function refreshProjectOptions() {
      if (!entityField) return;
      var selected = entityField.hidden
        ? (draft.entity === null ? defaultEntity() : draft.entity)
        : entityField.value;
      entityField.innerHTML = entityOptionsHTML(projectNames(), selected, 'No project');
      entityField.value = selected;
    }

    function renderComposer() {
      if (!textField) return; // Go's first render() can land before this block runs
      var folded = draft.folded;
      headEl.hidden = folded || draft.step === 0;
      resumeBtn.hidden = !folded;
      if (folded) {
        resumeBtn.innerHTML = (draftHasContent()
          ? escapeHtml(draft.text.trim() || 'Unfinished task') + '<span class="dot-unsaved"></span>'
          : 'Add a task');
      }

      textField.value = draft.text;
      notesField.value = draft.notes;
      refreshProjectOptions();

      STEPS.forEach(function (s, i) {
        document.getElementById(s.id).hidden = folded || i !== draft.step;
      });
      document.getElementById('draft-step').textContent = STEPS[draft.step].step;
      document.getElementById('draft-hint').textContent = STEPS[draft.step].hint;
      document.getElementById('draft-said').textContent = draft.step === 0 ? '' : draft.text.trim();
    }

    // focusComposer is what the hotkey reaches: unfold and put the caret back
    // where it was, so pressing it again continues the same draft rather than
    // starting a new one. Called from Go on every show (see ShowTasksDrawer).
    function focusComposer() {
      draft.folded = false;
      renderComposer();
      fieldFor(draft.step).focus();
    }
    window.focusComposer = focusComposer;

    function foldComposer() {
      readDraft();
      draft.folded = true;
      renderComposer();
    }

    function goToStep(step) {
      readDraft();
      draft.step = Math.max(0, Math.min(STEPS.length - 1, step));
      renderComposer();
      var el = fieldFor(draft.step);
      el.focus();
      if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length);
    }

    function submitDraft() {
      readDraft();
      var text = draft.text.trim();
      if (!text) { goToStep(0); return; }
      var entity = draft.entity === null ? defaultEntity() : draft.entity;
      window.drawerAddTask(text, draft.notes.trim(), entity).then(function () {
        draft = { text: '', notes: '', entity: null, step: 0, folded: false };
        renderComposer();
        textField.focus();
      }).catch(function (e) {
        document.getElementById('draft-hint').textContent = String(e);
      });
    }

    // Escape is handled on the document, not per field: it means the same
    // thing wherever the focus happens to be -- fold the composer, or, with
    // it already folded, close the drawer.
    document.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Escape') return;
      ev.preventDefault();
      if (draft.folded) { window.drawerClose(); return; }
      foldComposer();
    });

    resumeBtn.addEventListener('click', focusComposer);

    STEPS.forEach(function (s, i) {
      document.getElementById(s.id).addEventListener('keydown', function (ev) {
        // Shift+Tab walks back a step. So does ArrowUp from the very start of
        // a text field, where it has nothing else to do.
        var el = ev.currentTarget;
        var atStart = el.selectionStart === 0 && el.selectionEnd === 0;
        if (ev.key === 'Tab' && ev.shiftKey && i > 0) { ev.preventDefault(); goToStep(i - 1); return; }
        if (ev.key === 'ArrowUp' && i > 0 && el.tagName !== 'SELECT' && atStart) {
          ev.preventDefault();
          goToStep(i - 1);
          return;
        }
        if (ev.key !== 'Enter') return;
        // Shift+Enter is the only way to get a second line into the details,
        // so it is left to the textarea.
        if (ev.shiftKey && el.tagName === 'TEXTAREA') return;
        ev.preventDefault();
        if (i === 0 && !el.value.trim()) return; // a task with no text is not a task
        if (i === STEPS.length - 1) { submitDraft(); return; }
        goToStep(i + 1);
      });
    });

    render();
    renderComposer();
    textField.focus();
  </script>
</body>
</html>
