        var dict = Math.round(c.dictations / max * 42);
        var meet = Math.round(c.meetings / max * 42);
        var now = i === cols.length - 1 ? ' today' : '';
        var when = byMonth ? c.month : 'Week of ' + c.week;
        return '<div class="col' + now + '" title="' + escapeHtml(when) + ': ' +
            c.dictations + ' dictations, ' + c.meetings + ' meetings"><div class="stack">' +
          (meet ? '<div class="meet" style="height:' + Math.max(meet, 4) + 'px"></div>' : '') +
          (dict ? '<div class="dict" style="height:' + Math.max(dict, 3) + 'px"></div>' : '') +
          '</div><div class="lbl">' + escapeHtml(c.label || '') + '</div></div>';
      }).join('');

      // The line under the chart counts what the chart draws, so it changes
      // with it: the eight-week window, or everything there has ever been.
      var span = (byMonth ? ov.all_time : null) || {};
      var recordings = byMonth ? span.recordings : ov.window_recordings;
      var words = byMonth ? span.words : ov.window_words;
      var seconds = byMonth ? span.speaking_seconds : ov.window_seconds;
      legend.innerHTML =
        '<span><i class="swatch" style="background:var(--accent)"></i> Dictation</span>' +
        '<span><i class="swatch" style="background:var(--purple)"></i> Meetings</span>' +
        '<span style="margin-left:auto">' + grouped(recordings) + ' recordings \u00b7 ' +
          grouped(words) + ' words \u00b7 ' + duration(seconds) + ' of audio</span>';
    }

    // decodeTagHTML is the one place that decides between "in the queue" and
    // "nobody has asked for it": a row is only "Not transcribed" once it is
    // certain nothing is about to transcribe it.
    function decodeTagHTML(e) {
      var state = decodeKeys()[e.id];
      if (state) {
        return '<span class="tag transcribing">' +
          (state === 'running' ? 'Transcribing…' : 'Queued') + '</span>';
      }
      return e.text ? '' : '<span class="tag pending">Not transcribed</span>';
    }

    // A note without text is one of three things, and they are not the same:
    // still in the queue, being read right now, or read and empty. The last
    // one keeps its row on purpose -- a recording that produced nothing is
    // still evidence the machine was listening at that minute.
    function noteStateTagHTML(e) {
      var state = decodeKeys()[e.id];
      if (state) {
        return '<span class="tag transcribing">' +
          (state === 'running' ? 'Transcribing…' : 'Queued') + '</span>';
      }
      if (!e.has_audio) return '<span class="tag pending">Nothing was said</span>';
      return '<span class="tag pending">Not transcribed</span>';
    }

    // renderOverviewTasks counts the tasks by status. Each tile opens Tasks
    // filtered to its status, so the number is also the way to the list.
    function renderOverviewTasks() {
      var root = document.getElementById('overview-tasks');
      if (!root) return;
      var tasks = (window.voxlog && window.voxlog.tasks) || [];
      var counts = { todo: 0, in_progress: 0, blocked: 0, done: 0 };
      tasks.forEach(function (t) { if (counts[t.status] !== undefined) counts[t.status]++; });
      var kinds = [['todo', 'todo'], ['in_progress', 'progress'], ['blocked', 'blocked'], ['done', 'done']];
      root.innerHTML = kinds.map(function (k) {
        return '<button type="button" class="task-stat ' + k[1] + '" data-status="' + k[0] + '">' +
          '<div class="n">' + counts[k[0]] + '</div><div class="k">' + taskStatusLabel[k[0]] + '</div></button>';
      }).join('');
      root.querySelectorAll('.task-stat').forEach(function (btn) {
        btn.addEventListener('click', function () {
          taskFilter.status = btn.dataset.status;
          renderTasks(document.getElementById('task-filters'),
            document.getElementById('task-groups'), tasks);
          window.selectPane('tasks');
        });
      });
    }

    // renderOverviewAI is the one line Overview keeps about the LLM: which
    // model answers, and whether the OpenRouter account still has free
    // requests today -- when it has not, tasks and summaries are quietly
    // waiting, and this is where that shows.
    function renderOverviewAI() {
      var root = document.getElementById('overview-ai');
      if (!root) return;
      var st = (window.voxlog && window.voxlog.settings) || {};
      var provider = st.llm_provider || 'openrouter';
      function draw(what, state) {
        root.innerHTML = '<div class="ai-row"><div class="ai-what">' + what + '</div>' + state + '</div>';
        var go = root.querySelector('[data-go=settings]');
        if (go) go.addEventListener('click', function () { window.selectPane('settings'); });
      }
      if (provider !== 'openrouter') {
        draw(escapeHtml(provider === 'api' ? (st.llm_model || 'API') + ' · ' + (st.llm_base_url || '') : 'Local model'), '');
        return;
      }
      var acc = (st.openrouter_accounts || []).filter(function (a) { return a.id === st.openrouter_active; })[0];
      if (!acc) {
        draw('OpenRouter', '<button type="button" class="ai-state bad" data-go="settings">No account &middot; add one</button>');
        return;
      }
      var what = 'OpenRouter &middot; ' + escapeHtml(acc.label) + ' &middot; <span class="ai-model">' + escapeHtml(st.openrouter_model || 'no model') + '</span>';
      draw(what, '');
      if (!window.openRouterLimits) return;
      window.openRouterLimits([acc.id]).then(function (limits) {
        var q = limits && limits[acc.id];
        if (!q) return;
        if (q.reset) {
          draw(what, '<button type="button" class="ai-state bad" data-go="settings" title="Switch to another account in Settings">Free limit used up &middot; back at ' +
            new Date(q.reset).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</button>');
        } else if (q.limit) {
          // Amber for the last tenth: still working, but not for long.
          var low = q.remaining <= Math.max(5, q.limit / 10);
          draw(what, '<span class="ai-state ' + (low ? 'low' : 'ok') + '" title="Free-model requests left today; the count resets at midnight UTC">' +
            q.remaining + ' of ' + q.limit + ' free requests left today</span>');
        } else {
          draw(what, '<span class="ai-state ok">Free requests available</span>');
        }
      }).catch(function () {});
    }

    // decodeQueue is what the app last told us is queued or decoding. The
    // window is push-updated (window.voxlog.onDecodeQueue), and the same
    // array is put on the page at build time, so a window opened mid-decode
    // is not blank until the next job event.
    function decodeQueue() {
      return (window.voxlog && window.voxlog.decodeQueue) || [];
    }

    // decodeKeys is the set of row ids currently in the queue, so a list can
    // ask "is this row being transcribed" without scanning the queue per row.
    function decodeKeys() {
      var out = {};
      decodeQueue().forEach(function (d) {
        if (d.key) out[d.key] = d.running ? 'running' : 'queued';
      });
      return out;
    }

    // The queue has one home: the foot of the sidebar. It used to also draw a
    // banner in Overview and in Tasks, which meant the same three words in
    // three places and a banner that pushed the page around every time
    // something started decoding.
    var QUEUE_ROWS = 4;

    function queueRowTitle(d) {
      var lines = [d.label];
      lines.push(d.kind === 'llm'
        ? (d.stage || 'Working') + (d.running ? '' : ' · waiting')
        : (d.running ? 'Transcribing' : 'Waiting to be transcribed'));
      if (d.seconds) lines.push('Recording is ' + duration(d.seconds) + ' long');
      if (d.queued_at_ms) {
        var waited = Math.max(0, Math.round((Date.now() - d.queued_at_ms) / 1000));
        if (waited >= 2) lines.push('In the queue for ' + duration(waited));
      }
      return lines.join('\n');
    }

    function renderDecodeBanners() {
      var root = document.getElementById('sidebar-queue');
      if (!root) return;
      var q = decodeQueue();
      root.hidden = !q.length;
      if (!q.length) return;

      var running = q.filter(function (d) { return d.running; }).length;
      document.getElementById('queue-title').textContent =
        running ? 'Working · ' + q.length : q.length + ' waiting';

      document.getElementById('queue-rows').innerHTML =
        q.slice(0, QUEUE_ROWS).map(function (d) {
          var cls = 'queue-row ' + (d.running ? 'running' : 'waiting') + (d.kind === 'llm' ? ' llm' : '');
          return '<div class="' + cls + '" title="' + escapeHtml(queueRowTitle(d)) + '">' +
            '<span class="queue-mark"></span>' +
            '<span class="what">' + escapeHtml(d.kind === 'llm' ? (d.stage || 'Working') + ' · ' + d.label : d.label) + '</span>' +
          '</div>';
        }).join('') +
        (q.length > QUEUE_ROWS
          ? '<div class="queue-more">and ' + (q.length - QUEUE_ROWS) + ' more</div>'
          : '');
    }

    window.voxlog = window.voxlog || {};
    // Pushed from Go on every job start, finish and submit. Redraw both
    // lists too: their rows carry the "Transcribing..." tag, which is only
    // correct for as long as the take is actually in the queue.
    window.voxlog.onDecodeQueue = function (list) {
      window.voxlog.decodeQueue = list || [];
      renderDecodeBanners();
      if (typeof render === 'function') render();
    };

    function renderLiveBanner(status) {
      var el = document.getElementById('overview-live');
      if (!el) return;
      if (!status || !status.running) {
        el.innerHTML = '';
        liveShape = '';
        return;
      }
      // Once a second, and the banner carries buttons: rebuilding the whole
      // row on every tick threw away the button under the user's finger and
      // the toggle they had just pressed. Only the clock changes most ticks,
      // so only the clock is rewritten unless the state itself moved.
      var shape = String(!!status.muted);
      if (shape === liveShape) {
        var clock = el.querySelector('.elapsed');
        if (clock) { clock.textContent = clockTime(status.seconds); return; }
      }
      liveShape = shape;
      el.innerHTML =
        '<div class="live"><span class="pulse"></span>' +
          // Say the thing the banner is for: the others on the call have to
          // be told, and the macOS notice that says so can be refused by the
          // system without a word. This line cannot be.
          '<div><div class="what">Meeting recording</div>' +
            '<div class="sub">Let the others on the call know &middot; microphone + system audio &middot; dictation still works</div></div>' +
          '<div class="elapsed">' + clockTime(status.seconds) + '</div>' +
          // The label is the action, not the state -- the same wording the
          // menu bar item uses, so the two controls for one flag cannot read
          // as two different things.
          '<button type="button" class="act" id="overview-mute">' +
            (status.muted ? 'Unmute mic' : 'Mute mic') + '</button>' +
          '<button type="button" class="act" id="overview-stop">Stop</button>' +
        '</div>';
      var stop = document.getElementById('overview-stop');
      stop.addEventListener('click', function () {
        stop.disabled = true;
        window.stopMeeting().catch(function (e) { stop.disabled = false; toast(String(e)); });
      });
      var mute = document.getElementById('overview-mute');
      mute.addEventListener('click', function () {
        mute.disabled = true;
        window.toggleMeetingMute().then(function (muted) {
          // Painted from the answer, not from what the click assumed: the
          // menu bar can have muted it already.
          liveShape = String(!!muted);
          mute.textContent = muted ? 'Unmute mic' : 'Mute mic';
          mute.disabled = false;
        }).catch(function (e) { mute.disabled = false; toast(String(e)); });
      });
    }

    // What the banner last painted, so a poll tick that brings no change
    // does not redraw it. Declared after use on purpose -- var hoists, and
    // this belongs beside the function it serves.
    var liveShape = '';

    // The banner's poll is the only repeating timer in this window, and it
    // must run only while there is an Overview pane to show it in --
    // otherwise a window left open on Settings, or merely hidden behind
    // another app, would wake the process every second forever. Both the
    // pane switch and the page's own visibility (an orderOut'd window still
    // exists, it just isn't on screen) are checked every time either could
    // have changed.
    var meetingPollTimer = null;
    function pollMeetingStatus() {
      window.meetingStatus().then(renderLiveBanner).catch(function () { renderLiveBanner(null); });
    }
    function updateMeetingPoll() {
      var overviewNav = document.querySelector('#shell-nav .navitem[data-pane="overview"]');
      var showing = !!overviewNav && overviewNav.getAttribute('aria-selected') === 'true';
      var shouldPoll = showing && document.visibilityState === 'visible';
      if (shouldPoll && meetingPollTimer === null) {
        pollMeetingStatus();
        meetingPollTimer = setInterval(pollMeetingStatus, 1000);
      } else if (!shouldPoll && meetingPollTimer !== null) {
        clearInterval(meetingPollTimer);
        meetingPollTimer = null;
        renderLiveBanner(null); // stale "recording" state must not linger once nothing is polling it
      }
    }
    document.addEventListener('visibilitychange', updateMeetingPoll);

    // Panes are switched here and nowhere else. The settings fragment runs
    // its own nav, scoped to itself, so the two never see each other's
    // clicks.
    function selectPane(name) {
      // The welcome is a sheet over Overview, not a pane of its own.
      if (name === 'welcome') {
        if (window.openWelcome) window.openWelcome();
        name = 'overview';
      }
      document.querySelectorAll('#shell-nav .navitem').forEach(function (n) {
        n.setAttribute('aria-selected', String(n.dataset.pane === name));
      });
      document.querySelectorAll('#shell-content > .pane').forEach(function (p) {
        p.classList.toggle('on', p.dataset.pane === name);
      });
      document.getElementById('shell-content').scrollTop = 0;
      updateMeetingPoll();
      // Settings polls TCC while it is on screen and not otherwise -- the
      // same discipline the meeting banner's poll follows above.
      if (window.syncSettingsPolling) window.syncSettingsPolling();
      // A highlight left over from the pane just left would sit on a row
      // that is no longer the thing Enter acts on.
      kbdClearSelection();
    }
    window.selectPane = selectPane;

    document.getElementById('shell-nav').addEventListener('click', function (e) {
      var item = e.target.closest('.navitem');
      if (item) selectPane(item.dataset.pane);
    });

    // ---------------- keyboard row selection (History, Meetings) ----------------
    // Up/Down highlights a row without touching the clipboard; Enter acts on
    // whichever row is highlighted, the same action a click on its body
    // would -- so a transcript can be picked and pasted without the mouse.
    var kbdSelected = null;

    function kbdListRoot() {
      var pane = document.querySelector('#shell-nav .navitem[aria-selected="true"]');
      if (!pane) return null;
      if (pane.dataset.pane === 'history') return document.getElementById('history-list');
      if (pane.dataset.pane === 'meetings') return document.getElementById('meetings-list');
      return null;
    }

    function kbdClearSelection() {
      if (kbdSelected) kbdSelected.classList.remove('kbd-selected');
      kbdSelected = null;
    }

    function kbdSelect(row) {
      if (kbdSelected) kbdSelected.classList.remove('kbd-selected');
      kbdSelected = row;
      row.classList.add('kbd-selected');
      row.scrollIntoView({ block: 'nearest' });
    }

    window.kbdSelectFirstRow = kbdSelectFirstRow;
    function kbdSelectFirstRow() {
      var root = kbdListRoot();
      if (!root) return;
      var first = root.querySelector('.entry');
      if (first) kbdSelect(first);
    }

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'Enter') return;
      // A form control's own arrow/Enter behaviour (a <select>, a text
      // field) takes precedence -- this is for the row list, not for
      // whatever the Settings pane happens to have focused.
      var tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;

      var root = kbdListRoot();
      if (!root) return;
      var rows = Array.prototype.slice.call(root.querySelectorAll('.entry'));
      if (!rows.length) return;

      if (e.key === 'Enter') {
        if (!kbdSelected || rows.indexOf(kbdSelected) === -1) return;
        e.preventDefault();
        var entry = kbdSelected._entry;
        // pasteEntry, not applyEntry: walking the list and pressing Enter
        // means "put this back where I was typing", and it means that
        // whatever the History click action is set to.
        if (entry && entry.text) window.pasteEntry(entry.text);
        return;
      }

      e.preventDefault();
      var idx = rows.indexOf(kbdSelected);
      if (idx === -1) {
        idx = e.key === 'ArrowDown' ? 0 : rows.length - 1;
      } else {
        idx = e.key === 'ArrowDown' ? Math.min(idx + 1, rows.length - 1) : Math.max(idx - 1, 0);
      }
      kbdSelect(rows[idx]);
    });

    // The fragment used to initialise itself on DOMContentLoaded. Spliced
    // into this page it is present before that event, so the shell drives it.
    window.initSettingsPane && window.initSettingsPane();
    render();
    if (window.voxlog && window.voxlog.pane) selectPane(window.voxlog.pane);
    // Opened on History by the hotkey: highlight the newest row straight
    // away, so the first arrow press moves the selection instead of being
    // spent creating one.
    kbdSelectFirstRow();
    // selectPane already calls updateMeetingPoll when it runs; this covers
    // the case where window.voxlog.pane was never set and the markup's own
    // default (Overview, aria-selected="true") is what's actually showing.
    updateMeetingPoll();
  </script>
</body>
</html>
