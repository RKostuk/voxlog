<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* KIT_CSS */
  /* SETTINGS_CSS */
  /* INDICATOR_CSS */

  /* ---- meetings: the list, one meeting opened, and the voices ---------- */

  /* A meeting card leads with its summary, not its transcript: the
     transcript is what you read once you are inside, and an hour of it in a
     list makes every other meeting unreachable. */
  .meeting-card {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 14px;
    width: 100%; text-align: left; cursor: pointer;
    background: var(--card); border: 1px solid var(--separator);
    border-radius: 11px; padding: 12px 14px; color: var(--label); font: inherit;
    box-shadow: 0 1px 0 var(--glass-edge) inset;
  }
  .meeting-card:hover { border-color: var(--accent); }
  .meeting-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .meeting-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .m-top { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .m-title { font-size: 14px; font-weight: 600; }
  .m-when { color: var(--secondary); font-variant-numeric: tabular-nums; }
  .m-sum {
    grid-column: 1 / -1; margin-top: 2px; max-width: 68ch;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .m-sum.none { color: var(--secondary); font-style: italic; }
  .m-foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 9px; flex-wrap: wrap; }
  .m-foot .act { margin-left: auto; }
  .avatars { display: flex; align-items: center; }
  .avatar {
    width: 20px; height: 20px; border-radius: 50%; margin-right: -6px;
    display: grid; place-items: center; color: #fff;
    font-size: 9px; font-weight: 600; border: 1.5px solid var(--bg);
  }
  /* How the call was shared out, as one bar. Two pixels of background
     between segments so neighbouring colours never merge into a third. */
  .talk-strip { grid-column: 1 / -1; display: flex; gap: 2px; height: 5px; margin-top: 9px; }
  .talk-strip i { display: block; border-radius: 2px; }

  .detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .back-btn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 4px; font: inherit; }
  .detail-title { font-size: 18px; font-weight: 600; }
  .detail-meta { color: var(--secondary); display: flex; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; margin-bottom: 14px; }
  .panel { background: var(--card); border: 1px solid var(--separator); border-radius: 11px; padding: 13px 14px; }
  .panel h3 { margin: 0 0 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--secondary); }
  .stats-row { display: grid; grid-template-columns: 1fr 200px; gap: 14px; margin-bottom: 16px; }
  @media (max-width: 820px) { .stats-row { grid-template-columns: 1fr; } }
  .spk-rows { display: flex; flex-direction: column; gap: 9px; }
  .spk-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
  .spk-name { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .spk-figs { text-align: right; font-variant-numeric: tabular-nums; color: var(--secondary); }
  .spk-figs b { color: var(--label); font-weight: 600; }
  .spk-bar { grid-column: 1 / -1; height: 6px; background: var(--field); border-radius: 3px; overflow: hidden; }
  .spk-bar i { display: block; height: 100%; border-radius: 3px; }
  .name-btn { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 11px; padding: 1px 5px; }
  .facts { display: flex; flex-direction: column; gap: 10px; }
  .fact b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .fact span { color: var(--secondary); font-size: 11px; }

  .turns { display: flex; flex-direction: column; }
  .turn-row { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; padding: 7px 8px; border-radius: 8px; align-items: start; }
  .turn-row:hover { background: var(--field); }
  .turn-row.playing { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .turn-at { color: var(--secondary); font-variant-numeric: tabular-nums; font-size: 11px; text-align: right; padding-top: 2px; }
  .turn-who { font-weight: 600; margin-right: 6px; }
  .turn-play {
    border: 1px solid var(--separator); background: var(--card); color: var(--label);
    border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 10px; opacity: 0;
  }
  .turn-row:hover .turn-play, .turn-row.playing .turn-play, .turn-play:focus-visible { opacity: 1; }
  .turn-row mark { background: color-mix(in srgb, var(--yellow) 55%, transparent); color: inherit; border-radius: 3px; }

  /* The whole call as a strip of who-spoke-when. Click it to seek. */
  .timeline { position: relative; height: 22px; cursor: pointer; margin: 10px 0 4px; }
  .timeline .track { position: absolute; inset: 7px 0; display: flex; gap: 1px; }
  .timeline .track i { display: block; border-radius: 2px; }
  .playhead { position: absolute; top: 2px; bottom: 2px; width: 2px; background: var(--label); border-radius: 1px; }
  .player-bar { display: flex; align-items: center; gap: 10px; color: var(--secondary); font-variant-numeric: tabular-nums; }

  .voice-item { display: grid; grid-template-columns: auto 1fr auto; gap: 11px; align-items: center;
    background: var(--card); border: 1px solid var(--separator); border-radius: 10px; padding: 10px 12px; }
  .voice-item .sub { color: var(--secondary); font-size: 11px; }
  .voice-acts { display: flex; gap: 6px; }
  .voice-list { display: flex; flex-direction: column; gap: 8px; }
  .clip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; margin-top: 10px; }
  .clip {
    display: grid; grid-template-columns: auto 1fr auto; gap: 9px; align-items: center; text-align: left;
    border: 1px solid var(--separator); background: var(--field); color: var(--label); font: inherit;
    border-radius: 9px; padding: 8px 10px; cursor: pointer;
  }
  .clip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .clip .q { font-variant-numeric: tabular-nums; color: var(--secondary); font-size: 11px; }
  .clip .said { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .name-form { display: flex; gap: 8px; margin-top: 12px; }
  .name-form input { flex: 1; background: var(--field); border: 1px solid var(--separator); border-radius: 7px; padding: 6px 9px; color: var(--label); font: inherit; }
  .name-form input:focus { outline: none; border-color: var(--accent); }
  .hint { color: var(--secondary); margin: 8px 0 0; }
  .filter-search {
    background: var(--field); border: 1px solid transparent; border-radius: 7px;
    padding: 4px 9px; color: var(--label); font: inherit; min-width: 180px;
  }
  .filter-search:focus { outline: none; border-color: var(--accent); }

  /* Window chrome: a sidebar and one scrolling pane, the way System
     Settings does it. Every pane stays in the DOM whichever one is
     showing -- the settings form has to be complete when it is read, and
     hiding a pane must not take its values with it. */
  .shell { display: flex; height: 100%; }
  .sidebar { flex: none; width: 196px; padding: 10px; background: var(--sidebar);
             -webkit-backdrop-filter: blur(28px) saturate(180%);
             backdrop-filter: blur(28px) saturate(180%);
             border-right: 0.5px solid var(--separator); display: flex;
             flex-direction: column; gap: 1px; }
  .content { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; }
  .pane { display: none; padding: 0 20px 28px; }
  .pane.on { display: block; }
  /* The settings pane brings its own two-column layout, so it opts out of
     the padding the other three want. */
  .pane[data-pane="settings"] { padding: 0; height: 100%; }
  /* The fragment is a sidebar plus a pane in its own right; nothing in
     settings.css says so, because the window it came from said it on
     <body>. */
  #settings-pane { display: flex; height: 100%; }

  .navitem {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 6px 9px;
    border: none;
    border-radius: 8px;
    background: none;
    box-shadow: none;
    font: inherit;
    color: var(--label);
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
  }
  .navitem:hover:not([aria-selected="true"]) { background: var(--field); }
  .navitem[aria-selected="true"] {
    background: var(--accent);
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
  }
  .navitem:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Days are sections; entries are rows in a card. The heading is the kit's
     group title with the breathing room a scrolling list needs. */
  .group-title.day { margin: 20px 0 6px 10px; }
  .group-title.day:first-child { margin-top: 16px; }

  .entry {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 12px;
    border-top: 0.5px solid var(--separator);
    /* wrap, not nowrap: the player is a full-width item appended after the
       pill/body/acts/chevron row, and wrap is what drops it onto its own
       line instead of squeezing it in beside them. */
    flex-wrap: wrap;
  }
  .entry:first-child { border-top: none; }
  .entry .player { width: 100%; margin-top: 6px; }
  .entry:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
  /* Arrow-key selection, distinct from :hover so a mouse resting over a
     different row doesn't visually compete with the one Enter would act on. */
  .entry.kbd-selected { background: color-mix(in srgb, var(--accent) 16%, transparent);
                         box-shadow: inset 2px 0 0 var(--accent); }
  /* How long it took, as a pill on the left: the one number worth scanning
     down the column. */
  .entry .pill {
    flex: none;
    min-width: 48px;
    text-align: center;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--field);
    color: var(--secondary);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }
  .entry .body { flex: 1; min-width: 0; cursor: pointer; }
  /* Collapsed by default: one line, ellipsised. Expanding drops the clamp,
     so there is never a second copy of the text anywhere. */
  .entry .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry.expanded .text { white-space: pre-wrap; overflow: visible; }
  .entry .body:hover .text { color: var(--accent); }
  .entry .untranscribed { color: var(--tertiary); font-style: italic; }
  .entry .summary {
    margin-top: 5px; padding: 6px 9px;
    border-radius: 8px; background: var(--field);
    font-size: 11.5px; color: var(--label); line-height: 1.4;
  }
  .entry .summary-label {
    display: block; font-size: 9.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tertiary); margin-bottom: 2px;
  }
  .entry .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 2px;
    font-size: 11px;
    color: var(--tertiary);
    font-variant-numeric: tabular-nums;
  }
  .tag { padding: 1px 6px; border-radius: 5px; background: var(--field);
         color: var(--secondary); font-size: 10px; }
  .tag.pending { background: color-mix(in srgb, var(--yellow) 18%, transparent);
                 color: var(--yellow); }

  /* Row actions appear on hover or once the row is open -- the resting list
     stays a list, not a wall of buttons. */
  .acts { display: none; gap: 4px; flex: none; }
  .entry:hover .acts, .entry.expanded .acts { display: flex; }
  .act {
    height: 24px;
    padding: 0 8px;
    border: none;
    border-radius: 6px;
    background: var(--field);
    color: var(--secondary);
    box-shadow: none;
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .act:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .act:disabled { color: var(--tertiary); }
  .act:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .chev {
    flex: none;
    width: 24px; height: 24px;
    border: none; border-radius: 6px;
    background: none; box-shadow: none;
    color: var(--tertiary);
    font-size: 10px; cursor: pointer;
  }
  .entry.expanded .chev { transform: rotate(90deg); }
  .chev:hover { color: var(--label); background: var(--separator); }

  .empty { color: var(--secondary); text-align: center; padding: 48px 20px; }

  /* ---------------- overview ---------------- */
  /* Live meeting banner: state is carried by form (pulsing dot, red rule)
     as well as by the words, so it reads before it is read. */
  .live {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 13px;
    border-radius: 10px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--red) 14%, transparent), transparent), var(--card);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    box-shadow: inset 0 1px 0 var(--glass-edge), inset 0 0 0 0.5px var(--separator), 0 6px 16px var(--glass-shadow);
    border-left: 3px solid var(--red);
  }
  .live .pulse {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--red);
    animation: pulse 1.6s ease-in-out infinite;
    flex: none;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .live .pulse { animation: none; } }
  .live .what { font-weight: 590; }
  .live .sub { font-size: 11px; color: var(--secondary); }
  .live .elapsed {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    letter-spacing: -0.01em;
  }

  /* The decode-queue banner is the live-meeting banner in a different key:
     same glass card and left rule, accent instead of red, and a spinner
     rather than a pulse -- recording is happening to you, decoding is
     happening for you. */
  .live.decoding {
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, transparent), transparent), var(--card);
    border-left-color: var(--accent);
  }
  .live.decoding .pulse {
    border-radius: 50%;
    background: none;
    border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-top-color: var(--accent);
    width: 12px; height: 12px;
    animation: decode-spin 0.9s linear infinite;
  }
  @keyframes decode-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .live.decoding .pulse { animation: none; } }
  .live .queued { font-size: 11px; color: var(--secondary); }
  /* Transcribing is a live state, not the absence of one: distinct from
     .tag.pending ("Not transcribed"), which is a row nobody has queued. */
  .tag.transcribing {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 15%, transparent);
  }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
  .tile {
    background: var(--card);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%);
    border-radius: 10px;
    box-shadow: inset 0 1px 0 var(--glass-edge), inset 0 0 0 0.5px var(--separator), 0 6px 16px var(--glass-shadow);
    padding: 12px 13px 13px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
    position: relative;
    overflow: hidden;
  }
  /* A soft sweep top-left, the thing that reads as "curved and lit" rather
     than "a flat rectangle with a blur filter on it". */
  .tile::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(120% 60% at 0% 0%, var(--glass-edge), transparent 55%);
    opacity: 0.4;
    pointer-events: none;
  }
  /* Positioned, not just styled: an absolutely-positioned ::before paints
     after static in-flow content by CSS's own stacking rules, so without
     this the highlight sweep would sit on top of the numbers instead of
     under them. */
  .tile .k, .tile .v, .tile .d { position: relative; }
  .tile .k {
    font-size: 11px;
    color: var(--secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile .v {
    font-size: 26px;
    font-weight: 590;
    letter-spacing: -0.025em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .tile .v small { font-size: 13px; font-weight: 500; color: var(--secondary); letter-spacing: 0; }
  .tile .d { font-size: 11px; color: var(--tertiary); }

  /* 14-day column chart. Today is the emphasised endpoint. */
  .chart { padding: 14px 14px 10px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 92px; }
  .bars .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; min-width: 0; }
  .bars .stack { display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; height: 82px; }
  .bars .dict { background: var(--accent); border-radius: 3px 3px 0 0; opacity: 0.85; }
  /* #af52de, not a --purple token: kit.css doesn't define one, and this is
     the same hardcoded hue the Meetings sidebar glyph already uses. */
  .bars .meet { background: #af52de; border-radius: 3px 3px 0 0; opacity: 0.8; }
  .bars .col.today .dict, .bars .col.today .meet { opacity: 1; }
  .bars .lbl {
    text-align: center;
    font-size: 9.5px;
    color: var(--tertiary);
    font-variant-numeric: tabular-nums;
  }
  .bars .col.today .lbl { color: var(--accent); font-weight: 600; }
  .legend {
    display: flex;
    gap: 14px;
    padding: 10px 2px 2px;
    border-top: 0.5px solid var(--separator);
    margin-top: 10px;
    font-size: 11px;
    color: var(--secondary);
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 8px; height: 8px; border-radius: 2.5px; }

  /* ---------------- task hub ---------------- */
  /* A classified entry gets the same "this row means more" language the
     live-meeting banner already uses -- a left rule plus a faint tint --
     rather than a new visual idiom for the same idea. */
  .entry.task-detected {
    border-left: 3px solid var(--green);
    background: color-mix(in srgb, var(--green) 6%, transparent);
  }
  .tag.task-detected { background: color-mix(in srgb, var(--green) 18%, transparent); color: #1b8a3e; }
  .entry .hub-note { margin-top: 4px; font-size: 11px; color: #1b8a3e; font-weight: 500; }
  /* Entity/status tags on a classified History or Meetings row -- the same
     facts the Tasks pane shows for this task, so the project and where it
     stands are visible right where it was dictated too. */
  .tag.task-entity-tag { display: inline-flex; align-items: center; gap: 4px; }
  .tag.task-entity-tag::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dot);
  }
  .tag.status-todo { background: var(--field); color: var(--secondary); }
  .tag.status-in_progress { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .tag.status-blocked { background: color-mix(in srgb, var(--red) 16%, transparent); color: #c62b22; }
  .tag.status-done { background: color-mix(in srgb, var(--green) 18%, transparent); color: #1b8a3e; }

  .task-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
  .task-stat {
    background: var(--card);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-radius: 9px; padding: 8px 13px;
    box-shadow: inset 0 1px 0 var(--glass-edge), inset 0 0 0 0.5px var(--separator);
  }
  .task-stat .n { font-size: 19px; font-weight: 650; letter-spacing: -0.02em; }
  .task-stat .k { font-size: 10.5px; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.04em; }
  .task-stat.todo .n { color: var(--secondary); }
  .task-stat.progress .n { color: var(--accent); }
  .task-stat.blocked .n { color: var(--red); }
  .task-stat.done .n { color: var(--green); }

  .task-entity { display: flex; align-items: center; gap: 7px; margin: 22px 0 6px 2px; }
  .task-entity:first-child { margin-top: 16px; }
  .task-entity-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .task-entity-name { font-size: 12.5px; font-weight: 650; }
  .task-entity-count { font-size: 11px; color: var(--tertiary); }
  .task-entity-auto { margin-left: auto; font-size: 10px; color: var(--tertiary); font-weight: 500; }

  .task-row { display: flex; align-items: flex-start; gap: 11px; padding: 11px 13px; border-top: 0.5px solid var(--separator); }
  .task-row:first-child { border-top: none; }
  .task-row .body { flex: 1; min-width: 0; }
  .task-row .text { font-weight: 500; }
  .task-row.done .text { color: var(--tertiary); text-decoration: line-through; }
  .task-row .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 5px; font-size: 11px; color: var(--tertiary); }
  .task-row .meta a { color: var(--secondary); text-decoration: none; cursor: pointer; }
  .task-row .meta a:hover { color: var(--accent); }

  /* Hidden until hovered, same as History/Meetings row actions -- a resting
     task list should read as a list, not a wall of buttons. */
  .task-acts { display: none; gap: 4px; flex: none; }
  .task-row:hover .task-acts { display: flex; }
  .task-act {
    height: 22px; padding: 0 8px; border: none; border-radius: 6px;
    background: var(--field); color: var(--secondary);
    font: inherit; font-size: 10.5px; cursor: pointer;
  }
  .task-act:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .task-act:disabled { color: var(--tertiary); }

  /* The task row is a <summary>: strip the disclosure triangle so it still
     reads as a row, and keep the cursor honest about being clickable. */
  .task-detail > summary { cursor: pointer; list-style: none; }
  .task-detail > summary::-webkit-details-marker { display: none; }
  .task-detail > summary:hover .text { color: var(--accent); }
  .task-detail[open] > summary { border-bottom: 0.5px solid var(--separator); }
  .task-panel {
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px 13px 14px; background: var(--field);
  }
  .task-field { display: flex; flex-direction: column; gap: 4px; }
  .task-field-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--tertiary); }
  .task-panel input[type=text], .task-panel textarea {
    font: inherit; color: var(--label); background: var(--card);
    border: 0.5px solid var(--separator); border-radius: 6px;
    padding: 6px 8px; width: 100%; resize: vertical;
  }
  .task-panel input[type=text]:focus, .task-panel textarea:focus {
    outline: 2px solid var(--accent); outline-offset: -1px;
  }
  .task-panel-meta {
    display: flex; flex-wrap: wrap; gap: 4px 12px;
    font-size: 11px; color: var(--tertiary);
  }
  .task-panel-meta a { color: var(--secondary); text-decoration: none; cursor: pointer; }
  .task-panel-meta a:hover { color: var(--accent); }

  .task-done-toggle summary {
    cursor: pointer; padding: 8px 13px;
    font-size: 11px; color: var(--tertiary);
    border-top: 0.5px solid var(--separator);
  }
  .task-done-toggle summary:hover { color: var(--label); }
  .task-done-toggle .task-row:first-of-type { border-top: 0.5px solid var(--separator); }

  .reminder-chip {
    display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px;
    font-size: 10.5px; font-weight: 600;
    background: color-mix(in srgb, var(--yellow) 20%, transparent); color: #92700a;
  }
  .reminder-chip.overdue { background: color-mix(in srgb, var(--red) 16%, transparent); color: #c62b22; }
  .reminder-chip.none { background: var(--field); color: var(--tertiary); }

  /* A native <select>, styled as a pill -- it's the smallest control that
     cycles four states without four buttons per row. */
  .status-select {
    flex: none; border: none; border-radius: 999px; padding: 3px 9px;
    font-size: 10.5px; font-weight: 650; font-family: inherit; cursor: pointer;
  }
  .status-select.todo { background: var(--field); color: var(--secondary); }
  .status-select.progress { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .status-select.blocked { background: color-mix(in srgb, var(--red) 16%, transparent); color: #c62b22; }
  .status-select.done { background: color-mix(in srgb, var(--green) 18%, transparent); color: #1b8a3e; }

  .pane-filters { display: flex; align-items: center; gap: 10px; margin: 16px 0 4px; flex-wrap: wrap; }
  .pane-filters select {
    font: inherit; font-size: 11.5px; color: var(--label);
    background: var(--field); border: none; border-radius: 7px;
    padding: 4px 9px; cursor: pointer;
  }
  .filter-chips { display: flex; gap: 4px; }
  .filter-chip {
    font: inherit; font-size: 11px; color: var(--secondary);
    background: var(--field); border: none; border-radius: 999px;
    padding: 4px 10px; cursor: pointer;
  }
  .filter-chip.on { background: var(--accent); color: #fff; }
</style>
</head>
<body>
  <div class="shell">
    <nav class="sidebar" id="shell-nav" role="tablist" aria-label="Sections">
      <button type="button" class="navitem" role="tab" data-pane="overview" aria-selected="true">
        <span class="glyph" style="--tint:#007aff"><svg viewBox="0 0 24 24"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/></svg></span>Overview
      </button>
      <button type="button" class="navitem" role="tab" data-pane="history" aria-selected="false">
        <span class="glyph" style="--tint:#5e5ce6"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8"/></svg></span>History
      </button>
      <button type="button" class="navitem" role="tab" data-pane="meetings" aria-selected="false">
        <span class="glyph" style="--tint:#af52de"><svg viewBox="0 0 24 24"><path d="M9 10a3 3 0 106 0 3 3 0 10-6 0M5 19a7 7 0 0114 0"/></svg></span>Meetings
      </button>
      <button type="button" class="navitem" role="tab" data-pane="tasks" aria-selected="false">
        <span class="glyph" style="--tint:#ff9500"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></span>Tasks
      </button>
      <button type="button" class="navitem" role="tab" data-pane="settings" aria-selected="false">
        <span class="glyph" style="--tint:#8e8e93"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></span>Settings
      </button>
    </nav>
    <main class="content" id="shell-content">
      <div class="pane on" data-pane="overview">
        <div id="overview-live"></div>
        <div class="decode-banner-slot" id="overview-decode"></div>
        <div class="group-title day">Today</div>
        <div class="tiles" id="overview-tiles"></div>
        <div class="group-title day">Last 14 days</div>
        <div class="card chart">
          <div class="bars" id="overview-bars"></div>
          <div class="legend" id="overview-legend"></div>
        </div>
        <div class="group-title day">Recent</div>
        <div class="card" id="overview-recent"></div>
      </div>
      <div class="pane" data-pane="history"><div id="history-list"></div></div>
      <div class="pane" data-pane="meetings">
        <!-- Three views, one pane: the list, one meeting opened, and the
             voices behind them. Not three panes in the sidebar, because
             they are the same subject at three depths. -->
        <div id="meetings-browse">
          <div class="pane-filters" id="meetings-filters"></div>
          <div id="meetings-list"></div>
        </div>
        <div id="meeting-detail" hidden></div>
        <div id="voices-pane" hidden></div>
      </div>
      <div class="pane" data-pane="tasks">
        <div class="decode-banner-slot" id="tasks-decode"></div>
        <div class="task-summary" id="task-summary"></div>
        <div class="pane-filters" id="task-filters"></div>
        <div id="task-groups"></div>
      </div>
      <div class="pane" data-pane="settings">
  <!-- SETTINGS_PANE -->
      </div>
    </main>
  </div>
  <script>
    // Dictations and meetings are separate stores now (see main_window.go),
    // each with its own flat-or-grouped shape coming over from Go -- so each
    // gets its own render function rather than one filtered by a shared flag.
    function render() {
      // A refresh rebuilds both lists' HTML from scratch; a player mounted
      // in a row that is about to be thrown away would keep playing,
      // invisible and unstoppable, if it weren't stopped first.
      stopPlayer();
      stopTurnPlayer();
      renderDays(document.getElementById('history-list'),
        (window.voxlog && window.voxlog.days) || [], 'No transcripts yet.');
      renderMeetings(document.getElementById('meetings-filters'), document.getElementById('meetings-list'),
        (window.voxlog && window.voxlog.meetings) || [], 'No meetings recorded yet.');
      renderTasks(document.getElementById('task-summary'), document.getElementById('task-filters'),
        document.getElementById('task-groups'), (window.voxlog && window.voxlog.tasks) || []);
      renderOverview();
      renderDecodeBanners();
    }

    // Only one recording plays at a time -- two of them talking over each
    // other is never what was wanted. currentPlayer tracks the one <audio>
    // element live in the page, and the row it belongs to.
    var currentPlayer = null;

    function stopPlayer() {
      if (!currentPlayer) return;
      currentPlayer.audio.pause();
      currentPlayer.audio.remove();
      currentPlayer = null;
    }

    // playIn mounts a player for name inside row, stopping whatever was
    // playing before it (including a player already in this same row).
    // preload="none" matters: a day with forty takes must not open forty
    // HTTP requests just because the rows are on screen.
    function playIn(row, name) {
      stopPlayer();
      var audio = document.createElement('audio');
      audio.className = 'player';
      audio.controls = true;
      audio.preload = 'none';
      audio.src = ((window.voxlog && window.voxlog.audioBase) || '') + name;
      row.appendChild(audio);
      currentPlayer = { audio: audio, row: row };
      audio.play().catch(function () {}); // autoplay can be refused; controls still work
    }

    // dictationRowHTML and meetingRowHTML build one .entry row each; every
    // place that lists a dictation or a meeting (History, Meetings, and the
    // Overview pane's Recent card) draws from these two, rather than each
    // keeping its own copy of the row markup.
    // taskHint is the History/Meetings side of Task Hub classification: a row
    // whose entry carries a task_id gets a green accent and a small note
    // pointing at the Tasks pane, so a classified snippet is visible right
    // where it was dictated, not only inside Tasks.
    function taskHint(e) {
      if (!e.task_id) return { cls: '', html: '' };
      var tags = '<span class="tag task-detected">Task detected</span>';
      if (e.task_entity) {
        tags += '<span class="tag task-entity-tag" style="--dot:' + entityColor(e.task_entity) + '">' +
          escapeHtml(e.task_entity) + '</span>';
      }
      if (e.task_status) {
        tags += '<span class="tag status-' + e.task_status + '">' +
          (taskStatusLabel[e.task_status] || e.task_status) + '</span>';
      }
      return {
        cls: ' task-detected',
        html: '<div class="meta">' + tags + '</div>' +
          '<div class="hub-note">Added to Task Hub' + (e.task_reminder ? ' · reminder ' + e.task_reminder : '') + '</div>'
      };
    }

    function dictationRowHTML(e, gi, ei) {
      // Index rather than inlining the text: the entry goes back to Go
      // verbatim on click, and round-tripping it through an HTML attribute
      // would mean escaping it correctly twice.
      var body = e.text
        ? '<div class="text">' + escapeHtml(e.text) + '</div>'
        : '<div class="text untranscribed">' +
            (e.has_audio ? 'Not transcribed yet' : 'No transcript, and the audio is gone') +
          '</div>';
      var hint = taskHint(e);

      return '<div class="entry' + hint.cls + '" data-day="' + gi + '" data-entry="' + ei + '">' +
        '<span class="pill" title="Transcription time">' + e.duration_seconds.toFixed(1) + 's</span>' +
        '<div class="body">' +
          body +
          '<div class="meta"><span>' + e.time + '</span></div>' +
          hint.html +
        '</div>' +
        '<div class="acts">' +
          // Clicking the row body already copies (see wireEntries); the
          // button is the same action made visible, same as the meeting
          // row's Copy button.
          (e.text ? '<button type="button" class="act copy">Copy</button>' : '') +
          (e.audio ? '<button type="button" class="act play" data-audio="' + e.audio + '">Play</button>' : '') +
          (e.audio ? '<button type="button" class="act delete-audio" data-audio="' + e.audio + '">Delete audio</button>' : '') +
        '</div>' +
        '<button type="button" class="chev" title="Expand" aria-label="Expand">&#9654;</button>' +
      '</div>';
    }

    function renderDays(root, days, emptyText) {
      var html = '';
      days.forEach(function (group, gi) {
        var rows = '';
        group.entries.forEach(function (e, ei) { rows += dictationRowHTML(e, gi, ei); });
        if (rows) html += '<div class="group-title day">' + group.day + '</div><div class="card">' + rows + '</div>';
      });
      root.innerHTML = html || '<div class="empty">' + emptyText + '</div>';

      wireEntries(root, function (row) {
        var day = days[parseInt(row.dataset.day, 10)];
        return day && day.entries[parseInt(row.dataset.entry, 10)];
      });
    }

    // The meetings screen has three depths: the list, one meeting opened,
    // and the voices behind the speakers in it. They share one pane rather
    // than three sidebar entries, because they are one subject -- and the
    // sidebar is for panes, not for where you happen to be inside one.

    // meetingEntityFilter persists across re-renders (RefreshMainWindowIfOpen
    // re-invokes render() often), so a filter picked once stays picked until
    // the user changes it, not just until the next transcript lands.
    var meetingEntityFilter = '';
    // openMeetingID is which meeting is open, if any. Kept as an id rather
    // than as the row itself so a refresh can redraw it from fresh data.
    var openMeetingID = '';

    function meetingByID(id) {
      var all = (window.voxlog && window.voxlog.meetings) || [];
      for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
      return null;
    }

    // The project a meeting belongs to: the one filed by hand first, then the
    // one implied by a task Task Hub found in it. Before meetings could be
    // filed by hand, only the second existed, which left most of them
    // invisible to the filter.
    function meetingEntity(e) { return e.entity || e.task_entity || ''; }

    // A speaker's colour comes from their number in this meeting, and only
    // the first four get one of their own -- a fifth voice draws neutral
    // rather than borrowing a colour that already means someone else.
    function speakerColor(local) {
      if (local < 0) return 'var(--spk-1)';           // you
      return local < 4 ? 'var(--spk-' + (local + 1) + ')' : 'var(--spk-x)';
    }

    function speakerLabel(local, name) {
      if (name) return name;
      if (local === -1) return 'You';
      if (local === -2) return 'Speaker';             // the two sides were mixed
      return 'Speaker ' + (local + 1);
    }

    function speakerInitials(local, name) {
      if (!name) return local < 0 ? 'Y' : String(local + 1);
      var parts = name.split(/[\s·]+/).filter(Boolean);
      return (parts[0].charAt(0) + (parts[1] ? parts[1].charAt(0) : '')).toUpperCase();
    }

    function clockTime(seconds) {
      seconds = Math.max(0, Math.round(seconds || 0));
      var m = Math.floor(seconds / 60), s = seconds % 60;
      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    // talkStripHTML is the whole call as one bar: each person's share, plus
    // whatever nobody was speaking for.
    function talkStripHTML(e) {
      var speakers = e.speakers || [];
      if (!speakers.length) return '';
      var spoken = 0;
      var parts = speakers.map(function (sp) {
        spoken += sp.talk_secs;
        return '<i style="flex:' + Math.max(sp.talk_secs, 0.01) + ';background:' + speakerColor(sp.speaker) + '"></i>';
      }).join('');
      var silence = Math.max((e.recording_seconds || 0) - spoken, 0);
      if (silence > 0) parts += '<i style="flex:' + silence + ';background:var(--silence)"></i>';
      return '<div class="talk-strip" aria-hidden="true">' + parts + '</div>';
    }

    function meetingCardHTML(e) {
      var summary = e.summary
        ? '<div class="m-sum">' + escapeHtml(e.summary) + '</div>'
        : '<div class="m-sum none">' + (e.text
            ? escapeHtml(e.text.slice(0, 220))
            : (e.has_audio ? 'Not transcribed yet' : 'No transcript, and the audio is gone')) + '</div>';

      var avatars = (e.speakers || []).map(function (sp) {
        return '<span class="avatar" style="background:' + speakerColor(sp.speaker) + '" title="' +
          escapeHtml(speakerLabel(sp.speaker, sp.name)) + '">' +
          escapeHtml(speakerInitials(sp.speaker, sp.name)) + '</span>';
      }).join('');

      var entity = meetingEntity(e);
      var tags = entity ? '<span class="tag">' + escapeHtml(entity) + '</span>' : '';
      if (e.task_id) tags += '<span class="tag">Task found</span>';
      tags += decodeTagHTML(e);

      // Transcribe is the only button on a card: everything else you do to a
      // meeting, you do inside it.
      var action = (!e.text && e.has_audio)
        ? '<button type="button" class="act transcribe-meeting" data-id="' + escapeHtml(e.id) + '">Transcribe</button>'
        : '';

      return '<button type="button" class="meeting-card" data-id="' + escapeHtml(e.id) + '">' +
        '<div class="m-top"><span class="m-title">' + escapeHtml(e.time) + '</span>' +
          '<span class="m-when">' + duration(e.recording_seconds) + '</span>' + tags +
        '</div>' +
        summary +
        talkStripHTML(e) +
        '<div class="m-foot"><span class="avatars">' + avatars + '</span>' +
          '<span class="tag">' + ((e.speakers || []).length
            ? (e.speakers.length === 1 ? '1 speaker' : e.speakers.length + ' speakers')
            : 'no speaker data') + '</span>' +
          action +
        '</div>' +
      '</button>';
    }

    function renderMeetingFilter(root, meetings) {
      var names = [];
      meetings.forEach(function (m) {
        var name = meetingEntity(m);
        if (name && names.indexOf(name) === -1) names.push(name);
      });
      // Every project the user has configured, not only the ones already
      // used: filing a meeting under a project it has never been in is the
      // main thing the picker is for.
      ((window.voxlog && window.voxlog.settings && window.voxlog.settings.entity_dictionary) || [])
        .forEach(function (name) { if (name && names.indexOf(name) === -1) names.push(name); });
      names.sort();
      if (meetingEntityFilter && names.indexOf(meetingEntityFilter) === -1) meetingEntityFilter = '';

      root.innerHTML =
        '<select id="meeting-filter-entity"><option value="">All projects</option>' +
        names.map(function (n) {
          return '<option value="' + escapeHtml(n) + '"' + (n === meetingEntityFilter ? ' selected' : '') + '>' + escapeHtml(n) + '</option>';
        }).join('') + '</select>' +
        '<input type="search" id="meeting-search" class="filter-search" placeholder="Search meetings" value="' + escapeHtml(meetingQuery) + '">' +
        '<button type="button" class="act" id="open-voices">Voices</button>';

      root.querySelector('#meeting-filter-entity').addEventListener('change', function (ev) {
        meetingEntityFilter = ev.target.value;
        render();
      });
      var search = root.querySelector('#meeting-search');
      search.addEventListener('input', function (ev) {
        meetingQuery = ev.target.value;
        renderMeetingList(document.getElementById('meetings-list'),
          (window.voxlog && window.voxlog.meetings) || [], 'No meetings recorded yet.');
      });
      root.querySelector('#open-voices').addEventListener('click', openVoices);
    }

    var meetingQuery = '';

    function renderMeetingList(root, allMeetings, emptyText) {
      var query = meetingQuery.toLowerCase();
      var meetings = allMeetings.filter(function (m) {
        if (meetingEntityFilter && meetingEntity(m) !== meetingEntityFilter) return false;
        if (!query) return true;
        return (m.summary + ' ' + m.text + ' ' + meetingEntity(m)).toLowerCase().indexOf(query) !== -1;
      });

      var byDay = [], indexByDay = {};
      meetings.forEach(function (m) {
        if (!(m.day in indexByDay)) {
          indexByDay[m.day] = byDay.length;
          byDay.push({ day: m.day, entries: [] });
        }
        byDay[indexByDay[m.day]].entries.push(m);
      });

      var html = '';
      byDay.forEach(function (group) {
        html += '<div class="group-title day">' + group.day + '</div><div class="meeting-list">' +
          group.entries.map(meetingCardHTML).join('') + '</div>';
      });
      var empty = (meetingEntityFilter || meetingQuery) && allMeetings.length
        ? 'No meetings match that.' : emptyText;
      root.innerHTML = html || '<div class="empty">' + empty + '</div>';

      root.querySelectorAll('.transcribe-meeting').forEach(function (btn) {
        btn.addEventListener('click', function (ev) {
          ev.stopPropagation(); // the card underneath opens the meeting
          btn.disabled = true;
          btn.textContent = 'Queued…';
          window.transcribeEntry(btn.dataset.id);
        });
      });
      root.querySelectorAll('.meeting-card').forEach(function (card) {
        card.addEventListener('click', function () { openMeeting(card.dataset.id); });
      });
    }

    function renderMeetings(filtersRoot, root, allMeetings, emptyText) {
      renderMeetingFilter(filtersRoot, allMeetings);
      renderMeetingList(root, allMeetings, emptyText);
      // A refresh while a meeting is open redraws it from the new data
      // rather than throwing the user back to the list mid-read.
      if (openMeetingID) {
        if (meetingByID(openMeetingID)) openMeeting(openMeetingID);
        else showMeetingView('browse');
      }
    }

    function showMeetingView(which) {
      document.getElementById('meetings-browse').hidden = which !== 'browse';
      document.getElementById('meeting-detail').hidden = which !== 'detail';
      document.getElementById('voices-pane').hidden = which !== 'voices';
      if (which !== 'detail') { stopTurnPlayer(); openMeetingID = ''; }
    }

    // ---- one meeting, opened -------------------------------------------

    var detailTurns = [], detailSpeakers = [], detailMeeting = null, turnQuery = '';

    function openMeeting(id) {
      var meeting = meetingByID(id);
      if (!meeting) return;
      openMeetingID = id;
      detailMeeting = meeting;
      showMeetingView('detail');
      document.getElementById('meeting-detail').innerHTML =
        '<div class="empty">Loading the transcript…</div>';

      window.meetingDetail(id).then(function (detail) {
        // A second click landed elsewhere while this was in flight.
        if (openMeetingID !== id) return;
        detailTurns = (detail && detail.turns) || [];
        detailSpeakers = (detail && detail.speakers) || [];
        renderMeetingDetail();
      });
    }

    function speakerByLocal(local) {
      for (var i = 0; i < detailSpeakers.length; i++) {
        if (detailSpeakers[i].speaker === local) return detailSpeakers[i];
      }
      return null;
    }

    function statsHTML(meeting) {
      if (!detailSpeakers.length) return '';
      var total = meeting.recording_seconds || 0;
      var spoken = detailSpeakers.reduce(function (a, sp) { return a + sp.talk_secs; }, 0);
      if (!total) total = spoken;

      var share = detailSpeakers.map(function (sp) {
        return '<i style="flex:' + Math.max(sp.talk_secs, 0.01) + ';background:' + speakerColor(sp.speaker) +
          '" title="' + escapeHtml(speakerLabel(sp.speaker, sp.name)) + '"></i>';
      }).join('');
      var silence = Math.max(total - spoken, 0);
      if (silence > 0) share += '<i style="flex:' + silence + ';background:var(--silence)"></i>';

      var rows = detailSpeakers.map(function (sp) {
        var pct = total ? Math.round(sp.talk_secs / total * 100) : 0;
        // Naming is only offered where it can mean something: a speaker with
        // no voice fingerprint cannot be recognised anywhere else, so a name
        // on them would be a label that never travels.
        var nameBtn = sp.identified
          ? '<button type="button" class="name-btn" data-name-speaker="' + sp.row + '">' +
              (sp.name ? 'Rename' : 'Name this voice') + '</button>'
          : '';
        return '<div class="spk-row" data-speaker-row="' + sp.row + '">' +
          '<span class="spk-name"><span class="swatch" style="background:' + speakerColor(sp.speaker) + '"></span>' +
            '<b>' + escapeHtml(speakerLabel(sp.speaker, sp.name)) + '</b>' + nameBtn + '</span>' +
          '<span class="spk-figs"><b>' + pct + '%</b> ' + clockTime(sp.talk_secs) + '</span>' +
          '<span class="spk-bar"><i style="width:' + pct + '%;background:' + speakerColor(sp.speaker) + '"></i></span>' +
        '</div>';
      }).join('');

      var longest = detailTurns.reduce(function (best, t) {
        return (t.end - t.start) > (best ? best.end - best.start : 0) ? t : best;
      }, null);

      return '<div class="stats-row">' +
        '<div class="panel"><h3>Talk time</h3>' +
          '<div class="talk-strip" style="height:10px">' + share + '</div>' +
          '<div class="spk-rows" style="margin-top:12px">' + rows + '</div></div>' +
        '<div class="panel"><h3>At a glance</h3><div class="facts">' +
          '<div class="fact"><b>' + detailSpeakers.length + '</b><span>speakers</span></div>' +
          '<div class="fact"><b>' + detailTurns.length + '</b><span>replies</span></div>' +
          '<div class="fact"><b>' + (longest ? clockTime(longest.end - longest.start) : '—') + '</b><span>longest stretch' +
            (longest ? ' · ' + escapeHtml(speakerLabel(longest.speaker, longest.name)) : '') + '</span></div>' +
          '<div class="fact"><b>' + (total ? Math.round(silence / total * 100) : 0) + '%</b><span>silence</span></div>' +
        '</div></div></div>';
    }

    function highlightTurn(text) {
      if (!turnQuery) return escapeHtml(text);
      var lower = text.toLowerCase(), needle = turnQuery.toLowerCase();
      var out = '', at = 0, hit;
      while ((hit = lower.indexOf(needle, at)) !== -1) {
        out += escapeHtml(text.slice(at, hit)) + '<mark>' + escapeHtml(text.slice(hit, hit + needle.length)) + '</mark>';
        at = hit + needle.length;
      }
      return out + escapeHtml(text.slice(at));
    }

    function turnsHTML() {
      if (!detailTurns.length) {
        return '<p class="hint">No replies stored for this meeting yet. Older recordings are re-read in the background; ' +
          'until then the transcript above is all there is.</p>';
      }
      var rows = detailTurns.map(function (t, i) {
        var name = speakerLabel(t.speaker, t.name);
        var hidden = turnQuery && t.text.toLowerCase().indexOf(turnQuery.toLowerCase()) === -1;
        return '<div class="turn-row" data-turn="' + i + '"' + (hidden ? ' hidden' : '') + '>' +
          '<span class="turn-at">' + clockTime(t.start) + '</span>' +
          '<span><span class="turn-who" style="color:' + speakerColor(t.speaker) + '">' + escapeHtml(name) + '</span>' +
            highlightTurn(t.text) + '</span>' +
          '<button type="button" class="turn-play" data-play-turn="' + i + '" aria-label="Play this reply">&#9654;</button>' +
        '</div>';
      }).join('');
      return '<div class="turns">' + rows + '</div>';
    }

    function timelineHTML(meeting) {
      if (!detailTurns.length) return '';
      var total = meeting.recording_seconds || detailTurns[detailTurns.length - 1].end;
      var parts = '', at = 0;
      detailTurns.forEach(function (t) {
        if (t.start > at) parts += '<i style="flex:' + (t.start - at) + ';background:var(--silence)"></i>';
        parts += '<i style="flex:' + Math.max(t.end - t.start, 0.01) + ';background:' + speakerColor(t.speaker) + '"></i>';
        at = Math.max(at, t.end);
      });
      if (total > at) parts += '<i style="flex:' + (total - at) + ';background:var(--silence)"></i>';
      return '<div class="timeline" id="meeting-timeline"><div class="track">' + parts + '</div>' +
        '<div class="playhead" id="meeting-playhead" style="left:0"></div></div>' +
        '<div class="player-bar"><button type="button" class="act" id="turn-transport">&#9654;</button>' +
          '<span><b id="turn-clock">00:00</b> / ' + clockTime(total) + '</span>' +
          '<span id="turn-now"></span></div>';
    }

    function renderMeetingDetail() {
      var meeting = detailMeeting;
      var entity = meetingEntity(meeting);
      var root = document.getElementById('meeting-detail');

      root.innerHTML =
        '<div class="detail-head">' +
          '<button type="button" class="back-btn" id="detail-back">&#8249; Meetings</button>' +
          '<span class="detail-title">' + escapeHtml(meeting.day + ' · ' + meeting.time) + '</span>' +
          '<input type="search" id="turn-search" class="filter-search" placeholder="Search transcript" style="margin-left:auto" value="' + escapeHtml(turnQuery) + '">' +
        '</div>' +
        '<div class="detail-meta"><span>' + duration(meeting.recording_seconds) + '</span>' +
          (meeting.duration_seconds ? '<span>decoded in ' + duration(meeting.duration_seconds) + '</span>' : '') +
          '<span>Project: <select id="meeting-entity"></select></span>' +
        '</div>' +
        (meeting.summary ? '<div class="panel" style="margin-bottom:14px"><h3>Summary</h3>' + escapeHtml(meeting.summary) + '</div>' : '') +
        statsHTML(meeting) +
        timelineHTML(meeting) +
        turnsHTML() +
        (!detailTurns.length && meeting.text
          ? '<div class="panel" style="margin-top:14px"><h3>Transcript</h3>' + escapeHtml(meeting.text) + '</div>' : '');

      var picker = root.querySelector('#meeting-entity');
      var names = ((window.voxlog && window.voxlog.settings && window.voxlog.settings.entity_dictionary) || []).slice();
      if (entity && names.indexOf(entity) === -1) names.push(entity);
      picker.innerHTML = '<option value="">Unfiled</option>' + names.map(function (n) {
        return '<option value="' + escapeHtml(n) + '"' + (n === entity ? ' selected' : '') + '>' + escapeHtml(n) + '</option>';
      }).join('');
      picker.addEventListener('change', function () {
        window.setMeetingEntity(meeting.id, picker.value);
      });

      root.querySelector('#detail-back').addEventListener('click', function () { showMeetingView('browse'); });
      root.querySelector('#turn-search').addEventListener('input', function (ev) {
        turnQuery = ev.target.value;
        var rows = root.querySelectorAll('.turn-row');
        detailTurns.forEach(function (t, i) {
          var hit = !turnQuery || t.text.toLowerCase().indexOf(turnQuery.toLowerCase()) !== -1;
          if (rows[i]) rows[i].hidden = !hit;
        });
      });

      root.querySelectorAll('[data-play-turn]').forEach(function (btn) {
        btn.addEventListener('click', function () { playTurn(parseInt(btn.dataset.playTurn, 10)); });
      });
      root.querySelectorAll('[data-name-speaker]').forEach(function (btn) {
        btn.addEventListener('click', function () { openVoices(parseInt(btn.dataset.nameSpeaker, 10)); });
      });

      var timeline = root.querySelector('#meeting-timeline');
      if (timeline) {
        timeline.addEventListener('click', function (ev) {
          var box = timeline.getBoundingClientRect();
          var total = meeting.recording_seconds || 1;
          seekTurnPlayer((ev.clientX - box.left) / box.width * total);
        });
        root.querySelector('#turn-transport').addEventListener('click', toggleTurnPlayer);
      }
    }

    // ---- playing one reply ---------------------------------------------
    //
    // One <audio> for the whole meeting, seeked rather than reloaded: the
    // loopback server answers byte ranges (see server.go), so jumping an hour
    // into a call costs a range request, not a download. Playing "one reply"
    // is therefore a seek plus a stop time.

    var turnPlayer = null, turnStopAt = null, turnTicker = null, playingTurn = -1;

    function turnAudioName(channel) {
      return channel === 1 ? detailMeeting.system_audio : detailMeeting.audio;
    }

    function ensureTurnPlayer(channel) {
      var name = turnAudioName(channel);
      if (!name) return null;
      var src = ((window.voxlog && window.voxlog.audioBase) || '') + name;
      if (turnPlayer && turnPlayer.dataset.src === src) return turnPlayer;
      stopTurnPlayer();
      turnPlayer = document.createElement('audio');
      turnPlayer.preload = 'none';
      turnPlayer.src = src;
      turnPlayer.dataset.src = src;
      document.getElementById('meeting-detail').appendChild(turnPlayer);
      turnPlayer.addEventListener('timeupdate', onTurnTime);
      return turnPlayer;
    }

    function stopTurnPlayer() {
      if (turnPlayer) {
        turnPlayer.pause();
        turnPlayer.remove();
        turnPlayer = null;
      }
      turnStopAt = null;
      playingTurn = -1;
      clearInterval(turnTicker);
      turnTicker = null;
    }

    function playTurn(i) {
      var t = detailTurns[i];
      if (!t) return;
      var audio = ensureTurnPlayer(t.channel);
      if (!audio) return;
      // Clicking the reply that is already playing stops it, which is what a
      // play button that has turned into "the thing making noise" should do.
      if (playingTurn === i && !audio.paused) { audio.pause(); markPlaying(-1); return; }
      audio.currentTime = t.start;
      turnStopAt = t.end;
      audio.play().catch(function () {});
      markPlaying(i);
    }

    function toggleTurnPlayer() {
      var audio = turnPlayer || ensureTurnPlayer(0);
      if (!audio) return;
      if (audio.paused) {
        turnStopAt = null; // playing the meeting, not one reply
        audio.play().catch(function () {});
      } else {
        audio.pause();
      }
      updateTransport();
    }

    function seekTurnPlayer(seconds) {
      var audio = turnPlayer || ensureTurnPlayer(0);
      if (!audio) return;
      audio.currentTime = seconds;
      turnStopAt = null;
      onTurnTime();
    }

    function onTurnTime() {
      if (!turnPlayer) return;
      var now = turnPlayer.currentTime;
      if (turnStopAt !== null && now >= turnStopAt) {
        turnPlayer.pause();
        turnStopAt = null;
        markPlaying(-1);
      }
      var clock = document.getElementById('turn-clock');
      if (clock) clock.textContent = clockTime(now);
      var head = document.getElementById('meeting-playhead');
      if (head && detailMeeting && detailMeeting.recording_seconds) {
        head.style.left = Math.min(100, now / detailMeeting.recording_seconds * 100) + '%';
      }
      updateTransport();
    }

    function updateTransport() {
      var btn = document.getElementById('turn-transport');
      if (btn) btn.innerHTML = (turnPlayer && !turnPlayer.paused) ? '&#10073;&#10073;' : '&#9654;';
    }

    function markPlaying(i) {
      playingTurn = i;
      var rows = document.querySelectorAll('#meeting-detail .turn-row');
      rows.forEach(function (row, at) { row.classList.toggle('playing', at === i); });
      var now = document.getElementById('turn-now');
      if (now) {
        var t = detailTurns[i];
        now.textContent = t ? speakerLabel(t.speaker, t.name) + ' · ' + clockTime(t.start) : '';
      }
    }

    // ---- voices ---------------------------------------------------------
    //
    // Naming a voice once is what makes every meeting it ever spoke in read
    // with a name on it -- including the ones recorded months ago.

    var namingRow = 0, similarClips = [], pickedClips = {};

    function openVoices(row) {
      namingRow = row || 0;
      similarClips = [];
      pickedClips = {};
      showMeetingView('voices');
      document.getElementById('voices-pane').innerHTML = '<div class="empty">Loading voices…</div>';

      var work = [window.voiceList()];
      if (namingRow) work.push(window.similarUnnamed(namingRow));
      Promise.all(work).then(function (results) {
        var list = results[0] || {};
        similarClips = results[1] || [];
        // Everything the naming form offers is pre-ticked: the query already
        // decided these sound like the same person, and unticking the odd one
        // out is less work than ticking nine.
        similarClips.forEach(function (c) { pickedClips[c.row] = true; });
        renderVoices(list.voices || [], list.unnamed || []);
      });
    }

    function renderVoices(voices, unnamed) {
      var known = voices.length ? voices.map(function (v) {
        return '<div class="voice-item">' +
          '<span class="avatar" style="background:' + speakerColor(0) + ';margin:0">' +
            escapeHtml(speakerInitials(0, v.name)) + '</span>' +
          '<span><b>' + escapeHtml(v.name) + '</b><div class="sub">' + duration(v.secs) + ' of speech' +
            (v.has_clip ? '' : ' · no sample stored') + '</div></span>' +
          '<span class="voice-acts">' +
            (v.has_clip ? '<button type="button" class="act" data-play-voice="' + v.id + '">&#9654; Sample</button>' : '') +
            '<button type="button" class="act" data-rename-voice="' + v.id + '" data-name="' + escapeHtml(v.name) + '">Rename</button>' +
            '<button type="button" class="act" data-forget-voice="' + v.id + '">Forget</button>' +
            '<button type="button" class="act" data-erase-voice="' + v.id + '">Erase</button>' +
          '</span></div>';
      }).join('') : '<div class="empty">No voices named yet.</div>';

      var naming = '';
      if (namingRow) {
        var clips = similarClips.map(function (c) {
          return '<button type="button" class="clip" data-clip="' + c.row + '" aria-pressed="' + !!pickedClips[c.row] + '">' +
            '<span class="q">' + c.score.toFixed(2) + '</span>' +
            '<span class="said">' + escapeHtml(c.text || '(no transcript)') + '</span>' +
            '<span class="q">' + escapeHtml(c.day) + '</span></button>';
        }).join('');
        naming = '<h3 style="margin:20px 0 8px">Name this voice</h3>' +
          '<div class="panel">' +
            '<p class="hint" style="margin-top:0">Naming one speaker names every reply they ever spoke. ' +
              (similarClips.length
                ? 'These other unnamed speakers sound like the same person &mdash; untick any that are not.'
                : 'Nobody else on file sounds like them yet.') + '</p>' +
            (clips ? '<div class="clip-grid">' + clips + '</div>' : '') +
            '<div class="name-form"><input id="voice-name" placeholder="Their name" aria-label="Voice name">' +
              '<button type="button" class="act" id="save-voice">Save</button></div>' +
          '</div>';
      }

      var root = document.getElementById('voices-pane');
      root.innerHTML =
        '<div class="detail-head"><button type="button" class="back-btn" id="voices-back">&#8249; Meetings</button>' +
          '<span class="detail-title">Voices</span></div>' +
        '<div class="voice-list">' + known + '</div>' +
        naming +
        (unnamed.length && !namingRow
          ? '<h3 style="margin:20px 0 8px">Not named yet</h3><div class="voice-list">' +
              unnamed.map(function (c) {
                return '<div class="voice-item">' +
                  '<span class="avatar" style="background:var(--spk-x);margin:0">?</span>' +
                  '<span><b>' + escapeHtml(c.text || 'A voice with no transcript') + '</b>' +
                    '<div class="sub">' + escapeHtml(c.day) + ' · ' + duration(c.talk_secs) + ' of speech</div></span>' +
                  '<span class="voice-acts">' +
                    (c.audio ? '<button type="button" class="act" data-play-clip="' + c.row + '">&#9654;</button>' : '') +
                    '<button type="button" class="act" data-name-row="' + c.row + '">Name</button></span>' +
                '</div>';
              }).join('') + '</div>'
          : '');

      root.querySelector('#voices-back').addEventListener('click', function () { showMeetingView('browse'); });

      root.querySelectorAll('[data-name-row]').forEach(function (btn) {
        btn.addEventListener('click', function () { openVoices(parseInt(btn.dataset.nameRow, 10)); });
      });
      root.querySelectorAll('[data-clip]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var row = parseInt(btn.dataset.clip, 10);
          pickedClips[row] = !pickedClips[row];
          btn.setAttribute('aria-pressed', String(!!pickedClips[row]));
        });
      });
      root.querySelectorAll('[data-play-voice]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          playSample(((window.voxlog && window.voxlog.voiceBase) || '') + btn.dataset.playVoice);
        });
      });
      root.querySelectorAll('[data-play-clip]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var clip = null;
          (unnamed || []).forEach(function (c) { if (String(c.row) === btn.dataset.playClip) clip = c; });
          if (clip) playSample(((window.voxlog && window.voxlog.audioBase) || '') + clip.audio, clip.start, clip.end);
        });
      });
      root.querySelectorAll('[data-rename-voice]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var name = window.prompt('Name for this voice', btn.dataset.name);
          if (name) window.renameVoice(parseInt(btn.dataset.renameVoice, 10), name).then(function () { openVoices(namingRow); });
        });
      });
      // Forget and Erase are two different promises, so they ask two
      // different questions. Forget can be undone by naming the voice again;
      // Erase destroys the fingerprints and cannot.
      root.querySelectorAll('[data-forget-voice]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!window.confirm('Forget this name? The replies go back to being numbered, and the voice can be named again later.')) return;
          window.forgetVoice(parseInt(btn.dataset.forgetVoice, 10)).then(function () { openVoices(namingRow); });
        });
      });
      root.querySelectorAll('[data-erase-voice]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!window.confirm('Erase this voice? Everything learned about how they sound is deleted, and they will not be recognised again.')) return;
          window.eraseVoice(parseInt(btn.dataset.eraseVoice, 10)).then(function () { openVoices(0); });
        });
      });

      var save = root.querySelector('#save-voice');
      if (save) {
        save.addEventListener('click', function () {
          var name = root.querySelector('#voice-name').value.trim();
          if (!name) { root.querySelector('#voice-name').focus(); return; }
          var also = similarClips.filter(function (c) { return pickedClips[c.row]; })
            .map(function (c) { return c.row; });
          window.nameSpeaker(namingRow, name, also).then(function () { openVoices(0); });
        });
      }
    }

    // playSample plays a stored voice clip, or a stretch of a recording.
    function playSample(src, from, to) {
      stopTurnPlayer();
      var audio = document.createElement('audio');
      audio.preload = 'none';
      audio.src = src;
      document.getElementById('voices-pane').appendChild(audio);
      turnPlayer = audio;
      if (from) {
        audio.currentTime = from;
        turnStopAt = to || null;
        audio.addEventListener('timeupdate', function () {
          if (turnStopAt !== null && audio.currentTime >= turnStopAt) audio.pause();
        });
      }
      audio.play().catch(function () {});
    }

    // entityColor turns a task's entity name into a stable colour, so the
    // same project always draws the same dot without a colour picked or
    // stored anywhere -- a plain string hash into a small fixed palette.
    function entityColor(name) {
      // Unfiltered is the catch-all, not a real project -- a neutral dot
      // says so at a glance instead of it looking like just another one of
      // the user's configured projects.
      if (name === 'Unfiltered') return '#8e8e93';
      var hash = 0;
      for (var i = 0; i < name.length; i++) { hash = (hash * 31 + name.charCodeAt(i)) >>> 0; }
      var hues = ['#007aff', '#af52de', '#34c759', '#ff9500', '#ff3b30', '#5e5ce6', '#00c7be'];
      return hues[hash % hues.length];
    }

    var taskStatusLabel = { todo: 'To do', in_progress: 'In progress', blocked: 'Blocked', done: 'Done' };
    function taskStatusClass(status) { return status === 'in_progress' ? 'progress' : status; }

    // renderTasks draws the Tasks pane: a status summary bar, then tasks
    // grouped by their LLM-assigned entity (project/client/topic) -- the
    // classification step decides is_task/entity/reminder; this only lays
    // out whatever Task Hub already produced.
    // taskFilter persists across re-renders (see meetingEntityFilter above
    // for why) -- picked once, kept until changed, not reset every time a
    // classification lands and re-triggers render().
    var taskFilter = { entity: '', status: '' };
    // Which task detail sections are expanded. Kept by id, not by element:
    // every save redraws the whole pane from fresh data, and a row that was
    // open before the redraw must still be open after it.
    var openTaskIDs = {};

    function taskByID(id) {
      var list = (window.voxlog && window.voxlog.tasks) || [];
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) return list[i];
      }
      return null;
    }

    function renderTaskFilters(root, tasks) {
      var names = [];
      tasks.forEach(function (t) { if (t.entity && names.indexOf(t.entity) === -1) names.push(t.entity); });
      names.sort();
      if (taskFilter.entity && names.indexOf(taskFilter.entity) === -1) taskFilter.entity = '';

      var entitySelect = names.length
        ? '<select id="task-filter-entity"><option value="">All projects</option>' +
          names.map(function (n) {
            return '<option value="' + escapeHtml(n) + '"' + (n === taskFilter.entity ? ' selected' : '') + '>' + escapeHtml(n) + '</option>';
          }).join('') + '</select>'
        : '';
      var statusChips = ['', 'todo', 'in_progress', 'blocked', 'done'].map(function (s) {
        return '<button type="button" class="filter-chip' + (taskFilter.status === s ? ' on' : '') + '" data-status="' + s + '">' +
          (s ? taskStatusLabel[s] : 'All') + '</button>';
      }).join('');

      root.innerHTML = entitySelect + '<div class="filter-chips">' + statusChips + '</div>';

      var reRender = function () {
        renderTasks(document.getElementById('task-summary'), document.getElementById('task-filters'),
          document.getElementById('task-groups'), window.voxlog.tasks || []);
      };
      var entitySel = root.querySelector('#task-filter-entity');
      if (entitySel) entitySel.addEventListener('change', function (e) { taskFilter.entity = e.target.value; reRender(); });
      root.querySelectorAll('.filter-chip').forEach(function (btn) {
        btn.addEventListener('click', function () { taskFilter.status = btn.dataset.status; reRender(); });
      });
    }

    function renderTasks(summaryRoot, filtersRoot, groupsRoot, allTasks) {
      var counts = { todo: 0, in_progress: 0, blocked: 0, done: 0 };
      allTasks.forEach(function (t) { if (counts[t.status] !== undefined) counts[t.status]++; });
      summaryRoot.innerHTML =
        '<div class="task-stat todo"><div class="n">' + counts.todo + '</div><div class="k">To do</div></div>' +
        '<div class="task-stat progress"><div class="n">' + counts.in_progress + '</div><div class="k">In progress</div></div>' +
        '<div class="task-stat blocked"><div class="n">' + counts.blocked + '</div><div class="k">Blocked</div></div>' +
        '<div class="task-stat done"><div class="n">' + counts.done + '</div><div class="k">Done</div></div>';

      renderTaskFilters(filtersRoot, allTasks);
      var tasks = allTasks.filter(function (t) {
        return (!taskFilter.entity || t.entity === taskFilter.entity) &&
               (!taskFilter.status || t.status === taskFilter.status);
      });

      // Done tasks split out per group rather than dropped: still reachable
      // (a collapsed "N completed" -- see taskRowHTML/the details element
      // below), just not cluttering the default view of what's still open.
      var byEntity = [], indexByEntity = {};
      tasks.forEach(function (t) {
        var key = t.entity || 'Unfiltered';
        if (!(key in indexByEntity)) {
          indexByEntity[key] = byEntity.length;
          byEntity.push({ entity: key, active: [], done: [] });
        }
        (t.status === 'done' ? byEntity[indexByEntity[key]].done : byEntity[indexByEntity[key]].active)
          .push(t);
      });
      // Unfiltered is the catch-all, not a project -- keep it visually last
      // regardless of when its tasks happened to land, so the real projects
      // read top-to-bottom first.
      byEntity.sort(function (a, b) {
        return (a.entity === 'Unfiltered') - (b.entity === 'Unfiltered');
      });

      var now = new Date();
      function taskRowHTML(t) {
        var reminderHTML = '<span class="reminder-chip none">No reminder</span>';
        if (t.reminder) {
          var when = new Date(t.reminder);
          var overdue = when < now && t.status !== 'done';
          reminderHTML = '<span class="reminder-chip' + (overdue ? ' overdue' : '') + '">' +
            (overdue ? 'Overdue · ' : '') +
            when.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) +
            '</span>';
        }
        var sourcePane = t.source_kind === 'meeting' ? 'meetings' : 'history';
        var options = ['todo', 'in_progress', 'blocked', 'done'].map(function (s) {
          return '<option value="' + s + '"' + (s === t.status ? ' selected' : '') + '>' + taskStatusLabel[s] + '</option>';
        }).join('');
        var created = t.created
          ? new Date(t.created).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
          : '';
        var updated = t.updated
          ? new Date(t.updated).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
          : '';
        // The row is the <summary> of a <details>: same idiom as the
        // "N completed" toggle above, so clicking a task opens it in place
        // rather than navigating away from the list.
        return '<details class="task-detail"' + (openTaskIDs[t.id] ? ' open' : '') + ' data-id="' + t.id + '">' +
          '<summary class="task-row' + (t.status === 'done' ? ' done' : '') + '">' +
            '<div class="body">' +
              '<div class="text">' + escapeHtml(t.text) + '</div>' +
              '<div class="meta">' + reminderHTML +
                '<a data-source-pane="' + sourcePane + '">from ' + (sourcePane === 'meetings' ? 'meeting' : 'dictation') + ' ↗</a>' +
              '</div>' +
            '</div>' +
            '<select class="status-select ' + taskStatusClass(t.status) + '" data-id="' + t.id + '">' + options + '</select>' +
            '<div class="task-acts">' +
              '<button type="button" class="task-act" data-act="reject" data-id="' + t.id + '" title="Wrong -- not actually a task">Not a task</button>' +
              '<button type="button" class="task-act" data-act="delete" data-id="' + t.id + '" title="Remove">Delete</button>' +
            '</div>' +
          '</summary>' +
          '<div class="task-panel">' +
            '<label class="task-field"><span class="task-field-label">Task</span>' +
              '<input type="text" class="task-text-edit" data-id="' + t.id + '" value="' + escapeHtml(t.text) + '">' +
            '</label>' +
            '<label class="task-field"><span class="task-field-label">Notes</span>' +
              '<textarea class="task-notes" data-id="' + t.id + '" rows="3" placeholder="Anything the one-line summary left out">' +
                escapeHtml(t.notes || '') + '</textarea>' +
            '</label>' +
            '<div class="task-panel-meta">' +
              '<span>Project: ' + escapeHtml(t.entity || 'Unfiltered') + '</span>' +
              '<span>Status: ' + escapeHtml(taskStatusLabel[t.status] || t.status) + '</span>' +
              '<span>Reminder: ' + (t.reminder
                ? escapeHtml(new Date(t.reminder).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }))
                : 'none') + '</span>' +
              (created ? '<span>Created ' + escapeHtml(created) + '</span>' : '') +
              (updated ? '<span>Edited ' + escapeHtml(updated) + '</span>' : '') +
              '<a data-source-pane="' + sourcePane + '">Open the ' + (sourcePane === 'meetings' ? 'meeting' : 'dictation') + ' it came from ↗</a>' +
            '</div>' +
          '</div>' +
        '</details>';
      }

      groupsRoot.innerHTML = byEntity.length ? byEntity.map(function (g) {
        var rows = g.active.map(taskRowHTML).join('');
        var doneSection = g.done.length
          ? '<details class="task-done-toggle"><summary>' + g.done.length + ' completed</summary>' +
            g.done.map(taskRowHTML).join('') + '</details>'
          : '';
        var tag = g.entity === 'Unfiltered' ? 'no project matched' : 'from Settings';
        return '<div class="task-entity">' +
          '<span class="task-entity-dot" style="background:' + entityColor(g.entity) + '"></span>' +
          '<span class="task-entity-name">' + escapeHtml(g.entity) + '</span>' +
          '<span class="task-entity-count">' + (g.active.length + g.done.length) + '</span>' +
          '<span class="task-entity-auto">' + tag + '</span>' +
        '</div><div class="card">' + (rows || '<div class="empty">All done here.</div>') + doneSection + '</div>';
      }).join('') : '<div class="empty">' +
        ((taskFilter.entity || taskFilter.status) && allTasks.length ? 'No tasks match this filter.' : 'No tasks yet.') +
        '</div>';

      groupsRoot.querySelectorAll('.task-detail').forEach(function (det) {
        det.addEventListener('toggle', function () {
          if (det.open) openTaskIDs[det.dataset.id] = true;
          else delete openTaskIDs[det.dataset.id];
        });
      });
      // The status select and the action buttons live inside the <summary>,
      // where a plain click would also toggle the section open or shut.
      groupsRoot.querySelectorAll('.task-row .status-select, .task-row .task-act').forEach(function (el) {
        el.addEventListener('click', function (ev) { ev.preventDefault(); ev.stopPropagation(); });
      });

      // Notes save on a debounce while typing. Deliberately no redraw of the
      // pane afterwards (setTaskNotes does not refresh): a redraw mid-sentence
      // would replace the textarea under the caret. The in-memory task is
      // updated here instead, so the next redraw -- whatever triggers it --
      // still draws what was typed.
      groupsRoot.querySelectorAll('.task-notes').forEach(function (area) {
        var timer = null;
        function commit() {
          timer = null;
          var t = taskByID(area.dataset.id);
          if (t) t.notes = area.value;
          window.setTaskNotes(area.dataset.id, area.value).catch(function (e) { alert(e); });
        }
        area.addEventListener('input', function () {
          if (timer) clearTimeout(timer);
          timer = setTimeout(commit, 600);
        });
        area.addEventListener('blur', function () {
          if (!timer) return;
          clearTimeout(timer);
          commit();
        });
      });

      // The task line itself commits on blur or Enter, not on every
      // keystroke: unlike notes it is what the collapsed row shows, and
      // setTaskText does redraw the pane.
      groupsRoot.querySelectorAll('.task-text-edit').forEach(function (input) {
        var original = input.value;
        function commit() {
          var v = input.value.trim();
          if (!v || v === original) { input.value = original; return; }
          original = v;
          window.setTaskText(input.dataset.id, v).catch(function (e) { alert(e); });
        }
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
          if (ev.key === 'Escape') { ev.preventDefault(); input.value = original; input.blur(); }
        });
      });

      groupsRoot.querySelectorAll('.status-select').forEach(function (sel) {
        sel.addEventListener('change', function () {
          var id = sel.dataset.id, status = sel.value;
          sel.className = 'status-select ' + taskStatusClass(status);
          window.setTaskStatus(id, status).catch(function (e) { alert(e); });
        });
      });
      groupsRoot.querySelectorAll('[data-source-pane]').forEach(function (a) {
        a.addEventListener('click', function (ev) {
          // Inside a <summary>, so the click has to be stopped from also
          // toggling the section on the way out.
          ev.preventDefault();
          ev.stopPropagation();
          window.selectPane(a.dataset.sourcePane);
        });
      });
      groupsRoot.querySelectorAll('.task-act').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.dataset.id;
          var call = btn.dataset.act === 'reject' ? window.rejectTask : window.deleteTask;
          btn.disabled = true;
          call(id).catch(function (e) { alert(e); btn.disabled = false; });
        });
      });
    }

    // wireEntries hooks up the hover-revealed expand/collapse and Transcribe
    // buttons shared by both lists. entryFor maps a row back to the JS object
    // it was drawn from -- renderDays and renderMeetings each index into a
    // different array, so the lookup is the one thing that has to be passed
    // in rather than shared.
    function wireEntries(root, entryFor) {
      root.querySelectorAll('.entry').forEach(function (row) {
