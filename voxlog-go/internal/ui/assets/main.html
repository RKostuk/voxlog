        '<button type="button" class="act" data-who-cancel="1">Cancel</button>' +
      '</form>';
    }

    function timelineHTML(meeting) {
      if (!detailTurns.length) return '';
      var total = meeting.recording_seconds || detailTurns[detailTurns.length - 1].end;
      var parts = '', at = 0;
      detailTurns.forEach(function (t) {
        if (t.start > at) parts += '<i style="flex:' + (t.start - at) + ';background:var(--silence)"></i>';
        parts += '<i style="flex:' + Math.max(t.end - t.start, 0.01) + ';background:' + speakerColor(t.speaker) + '"></i>';
        at = Math.max(at, t.end);
      });
      if (total > at) parts += '<i style="flex:' + (total - at) + ';background:var(--silence)"></i>';
      return '<div class="timeline" id="meeting-timeline"><div class="track">' + parts + '</div>' +
        '<div class="playhead" id="meeting-playhead" style="left:0"></div></div>' +
        '<div class="player-bar"><button type="button" class="act" id="turn-transport">&#9654;</button>' +
          '<span><b id="turn-clock">00:00</b> / ' + clockTime(total) + '</span>' +
          '<span id="turn-now"></span></div>';
    }

    // The button reads its state from the same queue the row tags read
    // (decodeKeys), so a meeting already queued cannot be queued twice by
    // clicking again -- the button says what is happening and refuses.
    function detailTranscribeHTML(meeting) {
      if (meeting.text || !meeting.has_audio) return '';
      var state = decodeKeys()[meeting.id];
      if (state) {
        return '<button type="button" class="act" id="detail-transcribe" disabled>' +
          (state === 'running' ? 'Transcribing…' : 'Queued') + '</button>';
      }
      return '<button type="button" class="act" id="detail-transcribe">Transcribe</button>';
    }

    function renderMeetingDetail() {
      var meeting = detailMeeting;
      var entity = meetingEntity(meeting);
      var root = document.getElementById('meeting-detail');

      root.innerHTML =
        '<div class="detail-head">' +
          '<button type="button" class="back-btn" id="detail-back">&#8249; Meetings</button>' +
          // The name summarization gave it, with the date beside it; a
          // meeting with no title is still the date, exactly as before.
          (meeting.title
            ? '<span class="detail-title">' + escapeHtml(meeting.title) + '</span>' +
              '<span class="detail-when">' + escapeHtml(meeting.day + ' · ' + meeting.time) + '</span>'
            : '<span class="detail-title">' + escapeHtml(meeting.day + ' · ' + meeting.time) + '</span>') +
          '<input type="search" id="turn-search" class="filter-search" placeholder="Search transcript" value="' + escapeHtml(turnQuery) + '">' +
        '</div>' +
        '<div class="detail-meta"><span>' + duration(meeting.recording_seconds) + '</span>' +
          (meeting.duration_seconds ? '<span>decoded in ' + duration(meeting.duration_seconds) + '</span>' : '') +
          '<span class="detail-field">Project <select id="meeting-entity" class="select"></select></span>' +
          detailTranscribeHTML(meeting) +
        '</div>' +
        meetingSummaryHTML(meeting.summary) +
        statsHTML(meeting) +
        timelineHTML(meeting) +
        turnsHTML() +
        (!detailTurns.length && meeting.text
          ? '<div class="panel spaced"><h3>Transcript</h3>' + escapeHtml(meeting.text) + '</div>' : '') +
        knownVoicesList();

      var picker = root.querySelector('#meeting-entity');
      var names = ((window.voxlog && window.voxlog.settings && window.voxlog.settings.entity_dictionary) || []).slice();
      if (entity && names.indexOf(entity) === -1) names.push(entity);
      picker.innerHTML = entityOptionsHTML(names, entity, 'Unfiled');
      picker.addEventListener('change', function () {
        window.setMeetingEntity(meeting.id, picker.value);
      });

      var transcribe = root.querySelector('#detail-transcribe');
      if (transcribe && !transcribe.disabled) {
        transcribe.addEventListener('click', function () {
          transcribe.disabled = true;
          transcribe.textContent = 'Transcribing…';
          window.transcribeEntry(meeting.id).catch(function (err) {
            transcribe.disabled = false;
            transcribe.textContent = 'Transcribe';
            toast(String(err));
          });
        });
      }

      root.querySelector('#detail-back').addEventListener('click', function () { showMeetingView('browse'); });
      root.querySelector('#turn-search').addEventListener('input', function (ev) {
        turnQuery = ev.target.value;
        var rows = root.querySelectorAll('.turn-row');
        detailTurns.forEach(function (t, i) {
          var hit = !turnQuery || t.text.toLowerCase().indexOf(turnQuery.toLowerCase()) !== -1;
          if (rows[i]) rows[i].hidden = !hit;
        });
      });

      root.querySelectorAll('[data-play-turn]').forEach(function (btn) {
        btn.addEventListener('click', function () { playTurn(parseInt(btn.dataset.playTurn, 10)); });
      });
      // Naming happens in the row now. It used to throw the user into the
      // Voices pane and back, which lost their place in a transcript they
      // were reading -- and the pane asked the same question this row does.
      root.querySelectorAll('[data-name-speaker]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          editingSpeaker = parseInt(btn.dataset.nameSpeaker, 10);
          renderMeetingDetail();
          var input = root.querySelector('.spk-form input');
          if (input) { input.focus(); input.select(); }
        });
      });
      // Correcting who spoke, from the reply itself.
      root.querySelectorAll('[data-who-turn]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var seq = parseInt(btn.dataset.whoTurn, 10);
          editingTurn = editingTurn === seq ? -1 : seq;
          renderMeetingDetail();
        });
      });
      root.querySelectorAll('[data-who-cancel]').forEach(function (btn) {
        btn.addEventListener('click', function () { editingTurn = -1; renderMeetingDetail(); });
      });
      root.querySelectorAll('[data-who-pick]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var parts = btn.dataset.whoPick.split(':');
          var seq = parseInt(parts[0], 10), voiceID = parseInt(parts[1], 10);
          if (voiceID) { correctTurn(seq, voiceID); return; }
          // An unnamed speaker has no durable identity to point at. Ask here
          // rather than refusing: the field is already open.
          var input = btn.closest('.who-form').querySelector('input');
          input.placeholder = 'Name ' + btn.dataset.whoName + ' to move replies to them';
          input.focus();
        });
      });
      root.querySelectorAll('[data-who-save]').forEach(function (btn) {
        btn.addEventListener('click', function () { saveWho(parseInt(btn.dataset.whoSave, 10)); });
      });
      root.querySelectorAll('[data-who-clear]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var seq = parseInt(btn.dataset.whoClear, 10);
          window.clearCorrection(openMeetingID, seq).then(function () {
            editingTurn = -1;
            toast('Back to what the transcript decided');
            reopenMeetingDetail();
          }).catch(function (err) { toast(String(err)); });
        });
      });
      root.querySelectorAll('[data-who-form]').forEach(function (form) {
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          saveWho(parseInt(form.dataset.whoForm, 10));
        });
        form.querySelector('input').addEventListener('keydown', function (ev) {
          if (ev.key === 'Escape') { editingTurn = -1; renderMeetingDetail(); }
        });
      });

      root.querySelectorAll('[data-cancel-speaker]').forEach(function (btn) {
        btn.addEventListener('click', function () { editingSpeaker = 0; renderMeetingDetail(); });
      });
      root.querySelectorAll('[data-save-speaker]').forEach(function (btn) {
        btn.addEventListener('click', function () { saveSpeakerName(parseInt(btn.dataset.saveSpeaker, 10)); });
      });
      root.querySelectorAll('[data-name-form]').forEach(function (form) {
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          saveSpeakerName(parseInt(form.dataset.nameForm, 10));
        });
        form.querySelector('input').addEventListener('keydown', function (ev) {
          if (ev.key === 'Escape') { editingSpeaker = 0; renderMeetingDetail(); }
        });
      });
      root.querySelectorAll('[data-confirm-speaker]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var parts = btn.dataset.confirmSpeaker.split(':');
          window.linkSpeaker(parseInt(parts[0], 10), parseInt(parts[1], 10)).then(function () {
            toast('Linked — every reply they ever spoke reads with that name');
            reopenMeetingDetail();
          }).catch(function (err) { toast(String(err)); });
        });
      });
      root.querySelectorAll('[data-reject-speaker]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var row = parseInt(btn.dataset.rejectSpeaker, 10);
          detailSuggestions = detailSuggestions.filter(function (g) { return g.row !== row; });
          renderMeetingDetail();
        });
      });
      var showAll = root.querySelector('#show-all-speakers');
      if (showAll) {
        showAll.addEventListener('click', function () { speakersShowAll = true; renderMeetingDetail(); });
      }

      var timeline = root.querySelector('#meeting-timeline');
      if (timeline) {
        timeline.addEventListener('click', function (ev) {
          var box = timeline.getBoundingClientRect();
          var total = meeting.recording_seconds || 1;
          seekTurnPlayer((ev.clientX - box.left) / box.width * total);
        });
        root.querySelector('#turn-transport').addEventListener('click', toggleTurnPlayer);
      }
    }

    function saveSpeakerName(row) {
      var form = document.querySelector('.spk-form[data-name-form="' + row + '"]');
      if (!form) return;
      var name = form.querySelector('input').value.trim();
      if (!name) { form.querySelector('input').focus(); return; }
      // The voices list is what decides "somebody already known" from "a new
      // person", so it has to be on hand before the name is acted on.
      window.voiceList().then(function (list) {
        voiceData = list || { voices: [], unnamed: [] };
        return nameOrLink(row, name, []);
      }).then(function () {
        editingSpeaker = 0;
        reopenMeetingDetail();
      }).catch(function (err) { toast(String(err)); });
    }

    // correctTurn hands one reply to a voice that already exists.
    function correctTurn(seq, voiceID) {
      window.correctTurn(openMeetingID, seq, voiceID).then(function () {
        editingTurn = -1;
        toast('Noted — and their voice profile learns from it');
        reopenMeetingDetail();
      }).catch(function (err) { toast(String(err)); });
    }

    // saveWho is the typed half of the picker: a name, whether or not anybody
    // by that name is known yet. The binding matches an existing voice by name
    // before making one, so saying the same name twice does not invent a
    // second person.
    function saveWho(seq) {
      var form = document.querySelector('.who-form[data-who-form="' + seq + '"]');
      if (!form) return;
      var name = form.querySelector('input').value.trim();
      if (!name) { form.querySelector('input').focus(); return; }
      window.correctTurnAs(openMeetingID, seq, name).then(function () {
        editingTurn = -1;
        toast('Noted — and their voice profile learns from it');
        reopenMeetingDetail();
      }).catch(function (err) { toast(String(err)); });
    }

    // reopenMeetingDetail re-reads the meeting after a name changed: the
    // names live on the speakers and the turns are joined to them, so every
    // reply in the transcript below has to be redrawn too.
    function reopenMeetingDetail() {
      if (!detailMeeting) return;
      var id = detailMeeting.id;
      window.meetingDetail(id).then(function (detail) {
        if (openMeetingID !== id) return;
        detailTurns = (detail && detail.turns) || [];
        detailSpeakers = (detail && detail.speakers) || [];
        detailSuggestions = (detail && detail.suggestions) || [];
        renderMeetingDetail();
      }).catch(function (err) { toast(String(err)); });
    }

    // ---- playing one reply ---------------------------------------------
    //
    // One <audio> for the whole meeting, seeked rather than reloaded: the
    // loopback server answers byte ranges (see server.go), so jumping an hour
    // into a call costs a range request, not a download. Playing "one reply"
    // is therefore a seek plus a stop time.

    var turnPlayer = null, turnStopAt = null, turnTicker = null, playingTurn = -1;

    function turnAudioName(channel) {
      return channel === 1 ? detailMeeting.system_audio : detailMeeting.audio;
    }

    // One reply plays out of the track it was spoken on -- clean, one voice.
    // The meeting as a whole plays out of the mix endpoint, which sums the
    // microphone and the call as it reads them: handed the mic file alone,
    // "play the meeting" played the user talking to nobody.
    function turnSourceURL(channel) {
      var name = turnAudioName(channel);
      if (!name) return '';
      return ((window.voxlog && window.voxlog.audioBase) || '') + name;
    }

    function mixSourceURL() {
      if (!detailMeeting.audio) return '';
      // No call track (a meeting recorded mic-only, or one whose far end was
      // swept): there is nothing to mix, so play what there is.
      if (!detailMeeting.system_audio) return turnSourceURL(0);
      return ((window.voxlog && window.voxlog.mixBase) || '') + detailMeeting.audio;
    }

    function ensureTurnPlayer(src) {
      if (!src) return null;
      if (turnPlayer && turnPlayer.dataset.src === src) return turnPlayer;
      // Both sources run on the meeting's own clock, so swapping between a
      // single track and the mix keeps the playhead where it was rather than
      // jumping back to the top of the call.
      var at = turnPlayer ? turnPlayer.currentTime : 0;
      stopTurnPlayer();
      turnPlayer = document.createElement('audio');
      turnPlayer.preload = 'none';
      turnPlayer.src = src;
      turnPlayer.dataset.src = src;
      document.getElementById('meeting-detail').appendChild(turnPlayer);
      turnPlayer.addEventListener('timeupdate', onTurnTime);
      if (at) turnPlayer.currentTime = at;
      return turnPlayer;
    }

    function stopTurnPlayer() {
      if (turnPlayer) {
        turnPlayer.pause();
        turnPlayer.remove();
        turnPlayer = null;
      }
      turnStopAt = null;
      playingTurn = -1;
      clearInterval(turnTicker);
      turnTicker = null;
    }

    function playTurn(i) {
      var t = detailTurns[i];
      if (!t) return;
      var audio = ensureTurnPlayer(turnSourceURL(t.channel));
      if (!audio) return;
      // Clicking the reply that is already playing stops it, which is what a
      // play button that has turned into "the thing making noise" should do.
      if (playingTurn === i && !audio.paused) { audio.pause(); markPlaying(-1); return; }
      audio.currentTime = t.start;
      turnStopAt = t.end;
      audio.play().catch(function () {});
      markPlaying(i);
    }

    function toggleTurnPlayer() {
      // Pause whatever is making noise, whichever track it is on: the
      // transport is the one stop button for this meeting, and swapping the
      // source out from under a playing reply to pause it would be a play.
      if (turnPlayer && !turnPlayer.paused) {
        turnPlayer.pause();
        updateTransport();
        return;
      }
      var audio = ensureTurnPlayer(mixSourceURL());
      if (!audio) return;
      turnStopAt = null; // playing the meeting, not one reply
      audio.play().catch(function () {});
      updateTransport();
    }

    function seekTurnPlayer(seconds) {
      var audio = ensureTurnPlayer(mixSourceURL());
      if (!audio) return;
      audio.currentTime = seconds;
      turnStopAt = null;
      onTurnTime();
    }

    function onTurnTime() {
      if (!turnPlayer) return;
      var now = turnPlayer.currentTime;
      if (turnStopAt !== null && now >= turnStopAt) {
        turnPlayer.pause();
        turnStopAt = null;
        markPlaying(-1);
      }
      var clock = document.getElementById('turn-clock');
      if (clock) clock.textContent = clockTime(now);
      var head = document.getElementById('meeting-playhead');
      if (head && detailMeeting && detailMeeting.recording_seconds) {
        head.style.left = Math.min(100, now / detailMeeting.recording_seconds * 100) + '%';
      }
      updateTransport();
    }

    function updateTransport() {
      var btn = document.getElementById('turn-transport');
      if (btn) btn.innerHTML = (turnPlayer && !turnPlayer.paused) ? '&#10073;&#10073;' : '&#9654;';
    }

    function markPlaying(i) {
      playingTurn = i;
      var rows = document.querySelectorAll('#meeting-detail .turn-row');
      rows.forEach(function (row, at) { row.classList.toggle('playing', at === i); });
      var now = document.getElementById('turn-now');
      if (now) {
        var t = detailTurns[i];
        now.textContent = t ? speakerLabel(t.speaker, t.name) + ' · ' + clockTime(t.start) : '';
      }
    }

    // ---- searching every meeting at once --------------------------------

    var searchSeq = 0, searchTimer = null;

    // searchAllTranscripts queries the turns of every meeting. Debounced,
    // and each result carries the request number it belongs to: typing is
    // faster than the database, and an earlier query landing last would
    // leave the wrong results on screen.
    function searchAllTranscripts(query) {
      if (searchTimer) clearTimeout(searchTimer);
      var q = (query || '').trim();
      if (!q) { searchSeq++; renderSearchHits([], ''); return; }
      searchTimer = setTimeout(function () {
        var mine = ++searchSeq;
        window.searchMeetings(q).then(function (hits) {
          if (mine !== searchSeq) return;
          renderSearchHits(hits || [], q);
        }).catch(function () {
          if (mine !== searchSeq) return;
          renderSearchHits([], q);
        });
      }, 180);
    }

    // snippetHTML renders the [[ ]] markers the database puts around matched
    // words. Everything is escaped first and the markers replaced after, so
    // a transcript containing literal brackets cannot inject anything.
    function snippetHTML(snippet) {
      return escapeHtml(snippet)
        .split('[[').join('<mark>')
        .split(']]').join('</mark>');
    }

    function renderSearchHits(hits, query) {
      var root = document.getElementById('meeting-search-hits');
      if (!root) return;
      if (!query) { root.innerHTML = ''; return; }
      if (!hits.length) {
        root.innerHTML = '<div class="group-title day">In the transcripts</div>' +
          '<div class="card"><div class="empty">Nothing said matches “' + escapeHtml(query) + '”.</div></div>';
        return;
      }
      root.innerHTML = '<div class="group-title day">In the transcripts &middot; ' + hits.length +
          (hits.length === 1 ? ' reply' : ' replies') + '</div>' +
        '<div class="card">' + hits.map(function (h, i) {
          return '<button type="button" class="hit-row" data-hit="' + i + '">' +
            '<span class="hit-when">' + escapeHtml(h.day) + ' ' + escapeHtml(h.time) + '</span>' +
            '<span class="hit-body">' +
              '<span class="turn-who" style="color:' + speakerColor(h.speaker) + '">' +
                escapeHtml(speakerLabel(h.speaker, h.name)) + '</span>' +
              snippetHTML(h.snippet || h.text) +
            '</span>' +
            '<span class="hit-at">' + clockTime(h.start) + '</span>' +
          '</button>';
        }).join('') + '</div>';

      root.querySelectorAll('.hit-row').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var h = hits[parseInt(btn.dataset.hit, 10)];
          if (h) openMeetingAtTurn(h.meeting_id, h.seq);
        });
      });
    }

    // ---- who I actually talk to -----------------------------------------

    function openPeople() {
      showMeetingView('people');
      showWaiting('people-pane', 'Adding it up…');
      window.peopleStats().then(function (people) {
        stopWaiting();
        renderPeople(people);
      }).catch(function (e) { showPaneError('people-pane', e); });
    }

    function renderPeople(people) {
      var root = document.getElementById('people-pane');
      people = people || [];
      var head = '<div class="detail-head"><button type="button" class="back-btn" id="people-back">&#8249; Meetings</button>' +
        '<span class="detail-title">People</span></div>';
      if (!people.length) {
        root.innerHTML = head + '<div class="empty">Nobody is named yet. Name a voice in Voices and every ' +
          'meeting they were ever in starts counting towards this.</div>';
        document.getElementById('people-back').addEventListener('click', function () { showMeetingView('browse'); });
        return;
      }
      // Bars are relative to the person talked with most: the question is
      // who dominates the calendar, not how many seconds exactly.
      var top = people[0].talk_secs || 1;
      root.innerHTML = head + '<div class="card">' + people.map(function (p) {
        var share = Math.max(2, Math.round((p.talk_secs / top) * 100));
        return '<div class="person-row">' +
          '<span class="avatar" style="background:' + entityColor(p.name) + '">' +
            escapeHtml(speakerInitials(0, p.name)) + '</span>' +
          '<div class="person-body">' +
            '<div class="person-name">' + escapeHtml(p.name) + '</div>' +
            '<div class="person-bar"><i style="width:' + share + '%;background:' + entityColor(p.name) + '"></i></div>' +
            '<div class="person-meta">' + duration(p.talk_secs) + ' across ' + p.meetings +
              (p.meetings === 1 ? ' meeting' : ' meetings') + ' &middot; ' + p.turn_count +
              (p.turn_count === 1 ? ' reply' : ' replies') + ' &middot; last ' + escapeHtml(p.last_seen) +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>';
      document.getElementById('people-back').addEventListener('click', function () { showMeetingView('browse'); });
    }

    // ---- voices ---------------------------------------------------------
    //
    // Naming a voice once is what makes every meeting it ever spoke in read
    // with a name on it -- including the ones recorded months ago. So the
    // pane is built around hearing a voice before deciding who it is: every
    // row, clip and candidate plays from where it is drawn.

    // How many rows a section shows before "Show all". A heavy user
    // accumulates dozens of voices and hundreds of unnamed speakers, and a
    // list of all of them is a wall nobody reads.
    var VOICE_PAGE = 5;

    var namingRow = 0, similarClips = [], pickedClips = {};
    var voiceData = { voices: [], unnamed: [] };
    var voicesShowAll = { named: false, unnamed: false };
    // Which row is mid-edit, mid-confirmation, or has its audio open. Kept
    // here rather than in the DOM so a refresh from Go (which re-renders the
    // whole pane) does not close what the user is in the middle of.
    var editingVoice = 0, openAudio = 0, forgetArmed = 0, eraseArmed = 0;
    var audioPanel = { id: 0, clips: [], nearby: [], picked: {}, error: '' };

    function openVoices(row) {
      // A number or nothing. This used to be `row || 0`, which let anything
      // truthy through -- and openVoices was wired to a click listener, so
      // "anything" was a MouseEvent, sent on to a Go binding that wanted an
      // int64. That is what left the pane on "Loading voices…" forever:
      // json: cannot unmarshal object into Go value of type int64.
      namingRow = typeof row === 'number' && isFinite(row) && row > 0 ? row : 0;
      similarClips = [];
      pickedClips = {};
      editingVoice = 0;
      forgetArmed = 0;
      eraseArmed = 0;
      showMeetingView('voices');
      showWaiting('voices-pane', 'Loading voices…');

      var work = [window.voiceList()];
      if (namingRow) work.push(window.similarUnnamed(namingRow));
      Promise.all(work).then(function (results) {
        stopWaiting();
        voiceData = results[0] || { voices: [], unnamed: [] };
        similarClips = results[1] || [];
        // Everything the naming form offers is pre-ticked: the query already
        // decided these sound like the same person, and unticking the odd one
        // out is less work than ticking nine.
        similarClips.forEach(function (c) { pickedClips[c.row] = true; });
        renderVoices();
      }).catch(function (err) {
        // Without this the pane sat on "Loading voices…" forever whenever
        // voiceList rejected -- the error only ever reached the webview
        // console, where nobody looks. Whatever went wrong now says so on
        // screen, which is the difference between a hang and a failure.
        showPaneError('voices-pane', err);
      });
    }

    // reloadVoices refreshes the list under an action without throwing away
    // what is open: Forget, Rename and attaching audio all happen inside a
    // row the user is still working in.
    function reloadVoices() {
      return window.voiceList().then(function (list) {
        voiceData = list || { voices: [], unnamed: [] };
        renderVoices();
      }).catch(function (err) { toast(String(err)); });
    }

    // playKey is what is playing, as "kind:id" -- one player for the pane,
    // so starting a second sample stops the first, and clicking the one that
    // is playing stops it.
    var playKey = '';

    function playSampleKey(key, src, from, to) {
      var wasPlaying = playKey === key;
      stopTurnPlayer();
      playKey = '';
      if (wasPlaying) { paintPlayState(); return; }
      playKey = key;
      paintPlayState();
      playSample(src, from, to, function () {
        if (playKey !== key) return;
        playKey = '';
        paintPlayState();
      });
    }

    // Only the pressed state changes, so it is written straight onto the
    // buttons: re-rendering the pane on every play would close an open edit
    // form and fight the user for focus.
    function paintPlayState() {
      document.querySelectorAll('#voices-pane .play, #meeting-detail .play').forEach(function (btn) {
        var on = btn.dataset.playKey === playKey && playKey !== '';
        btn.setAttribute('aria-pressed', String(on));
        btn.innerHTML = on ? '&#9632;' : '&#9654;';
      });
    }

    function voiceBase() { return (window.voxlog && window.voxlog.voiceBase) || ''; }
    function audioBase() { return (window.voxlog && window.voxlog.audioBase) || ''; }

    function playBtn(key, enabled, label, small) {
      return '<button type="button" class="play' + (small ? ' sm' : '') + '" data-play-key="' + escapeHtml(key) + '"' +
        (enabled ? '' : ' disabled title="The recording this came from is no longer on disk"') +
        ' aria-pressed="' + (playKey === key) + '" aria-label="' + escapeHtml(label) + '">' +
        (playKey === key ? '&#9632;' : '&#9654;') + '</button>';
    }

    function showAllBtn(kind, total) {
      if (total <= VOICE_PAGE || voicesShowAll[kind]) return '';
      return '<button type="button" class="act quiet" data-show-all="' + kind + '">Show all ' + total + '</button>';
    }

    // The known voices, as a datalist: typing a name that is already on it is
    // how a speaker is attached to somebody who exists rather than becoming a
    // second voice with the same name.
    function knownVoicesList() {
      return '<datalist id="known-voices">' + voiceData.voices.map(function (v) {
        return '<option value="' + escapeHtml(v.name) + '"></option>';
      }).join('') + '</datalist>';
    }

    function voiceByName(name) {
      var key = String(name || '').trim().toLowerCase();
      var found = null;
      voiceData.voices.forEach(function (v) {
        if (v.name.trim().toLowerCase() === key) found = v;
      });
      return found;
    }

    // nameOrLink is the one decision behind every naming form in this pane: a
    // name already on file means "this is them" (linkSpeaker), anything else
    // means a new person (nameSpeaker). Without it the only way to grow a
    // voice was to hope the automatic match cleared 0.72.
    function nameOrLink(row, name, alsoRows) {
      var known = voiceByName(name);
      if (known) {
        var work = [window.linkSpeaker(row, known.id)];
        (alsoRows || []).forEach(function (other) { work.push(window.linkSpeaker(other, known.id)); });
        return Promise.all(work).then(function () {
          toast('Attached to ' + known.name + ' — every reply they ever spoke reads with that name');
        });
      }
      return window.nameSpeaker(row, name, alsoRows || []).then(function () {
        toast('Named ' + name);
      });
    }

    function renderVoices() {
      var voices = voiceData.voices || [], unnamed = voiceData.unnamed || [];
      var shownVoices = voicesShowAll.named ? voices : voices.slice(0, VOICE_PAGE);

      var known = voices.length ? shownVoices.map(function (v) {
        var head =
          '<span class="avatar" style="background:' + speakerColor(0) + '">' +
            escapeHtml(speakerInitials(0, v.name)) + '</span>' +
          playBtn('voice:' + v.id, v.has_clip, 'Play a sample of ' + v.name);
        if (editingVoice === v.id) {
          return '<div class="voice-item">' + head +
            '<form class="edit-form" data-rename-voice="' + v.id + '">' +
              '<input value="' + escapeHtml(v.name) + '" aria-label="Name" autocomplete="off">' +
              '<button type="button" class="act primary" data-save-rename="' + v.id + '">Save</button>' +
              '<button type="button" class="act" data-cancel-edit="1">Cancel</button>' +
            '</form></div>';
        }
        // Forget and Erase are two different promises, so they ask twice
        // rather than once: the first press arms the button, the second does
        // it. window.confirm cannot be used -- this webview never shows it.
        var acts =
          '<button type="button" class="act" data-audio="' + v.id + '" aria-expanded="' + (openAudio === v.id) + '">Audio</button>' +
          '<button type="button" class="act" data-edit-voice="' + v.id + '">Rename</button>' +
          '<button type="button" class="act' + (forgetArmed === v.id ? ' danger' : '') + '" data-forget-voice="' + v.id + '"' +
            ' title="The replies go back to being numbered; the voice can be named again later">' +
            (forgetArmed === v.id ? 'Forget?' : 'Forget') + '</button>' +
          '<button type="button" class="act' + (eraseArmed === v.id ? ' danger' : '') + '" data-erase-voice="' + v.id + '"' +
            ' title="Destroys everything learned about how they sound; they will not be recognised again">' +
            (eraseArmed === v.id ? 'Erase for good?' : 'Erase') + '</button>';
        return '<div class="voice-item' + (openAudio === v.id ? ' open' : '') + '">' + head +
          '<span><b>' + escapeHtml(v.name) + '</b><div class="sub">' + duration(v.secs) + ' of speech' +
            (v.has_clip ? '' : ' · no sample stored') + '</div></span>' +
          '<span class="voice-acts">' + acts + '</span></div>' +
          (openAudio === v.id ? audioPanelHTML(v) : '');
      }).join('') : '<div class="empty">No voices named yet.</div>';

      var naming = '';
      if (namingRow) {
        var clips = similarClips.map(function (c) {
          return '<div class="clip" data-picked="' + !!pickedClips[c.row] + '">' +
            '<button type="button" class="act" data-clip="' + c.row + '" aria-pressed="' + !!pickedClips[c.row] + '">' +
              (pickedClips[c.row] ? '&#10003; Same' : 'Same?') + '</button>' +
            playBtn('cand:' + c.row, !!c.audio, 'Play this clip', true) +
            '<span class="said">' + escapeHtml(c.text || '(no transcript)') + '</span>' +
            '<span class="q">' + c.score.toFixed(2) + '</span></div>';
        }).join('');
        naming = '<div class="group-title day">Name this voice</div>' +
          '<div class="panel">' +
            '<p class="hint" style="margin-top:0">Naming one speaker names every reply they ever spoke. ' +
              (similarClips.length
                ? 'These other unnamed speakers sound like the same person &mdash; listen, and untick any that are not.'
                : 'Nobody else on file sounds like them yet.') + '</p>' +
            (clips ? '<div class="clip-grid">' + clips + '</div>' : '') +
            '<div class="name-form">' +
              '<input id="voice-name" list="known-voices" placeholder="Their name, or somebody already known" aria-label="Voice name" autocomplete="off">' +
              '<button type="button" class="act primary" id="save-voice">Save</button></div>' +
          '</div>';
      }

      var shownUnnamed = voicesShowAll.unnamed ? unnamed : unnamed.slice(0, VOICE_PAGE);
      var queue = unnamed.length && !namingRow
        ? '<div class="group-title day">Not named yet <span class="count">' + unnamed.length + '</span></div>' +
          '<div class="voice-list">' +
            shownUnnamed.map(function (c) {
              return '<div class="voice-item">' +
                '<span class="avatar" style="background:var(--spk-x)">?</span>' +
                playBtn('cand:' + c.row, !!c.audio, 'Play this voice') +
                '<span><b>' + escapeHtml(c.text || 'A voice with no transcript') + '</b>' +
                  '<div class="sub">' + escapeHtml(c.day) + ' · ' + duration(c.talk_secs) + ' of speech' +
                  (c.audio ? '' : ' · recording already swept') + '</div></span>' +
                '<span class="voice-acts">' +
                  '<button type="button" class="act" data-name-row="' + c.row + '">Name</button></span>' +
              '</div>';
            }).join('') + '</div>' + showAllBtn('unnamed', unnamed.length)
        : '';

      var root = document.getElementById('voices-pane');
      root.innerHTML =
        '<div class="detail-head"><button type="button" class="back-btn" id="voices-back">&#8249; Meetings</button>' +
          '<span class="detail-title">Voices</span></div>' +
        '<div class="group-title day">Named <span class="count">' + voices.length + '</span></div>' +
        '<div class="voice-list">' + known + '</div>' +
        showAllBtn('named', voices.length) +
        naming + queue + knownVoicesList();

      wireVoices(root);
      var editInput = root.querySelector('.edit-form input');
      if (editInput) { editInput.focus(); editInput.select(); }
    }

    // What one voice is made of. Two questions on one panel, because they are
    // the same question asked twice: which audio is this person, and which
    // couple of seconds of it stands for them.
    function audioPanelHTML(v) {
      if (audioPanel.id !== v.id) return '<div class="voice-audio"><p class="hint">Loading…</p></div>';
      if (audioPanel.error) return '<div class="voice-audio"><p class="hint">' + escapeHtml(audioPanel.error) + '</p></div>';

      var attached = audioPanel.clips.length
        ? '<div class="clip-rows">' + audioPanel.clips.map(function (c) {
            return '<div class="clip-row">' +
              playBtn('clip:' + c.row, !!c.audio, 'Play this clip', true) +
              '<span class="said">' + escapeHtml(c.text || '(no transcript)') + '</span>' +
              '<span class="when">' + escapeHtml(c.day) + ' · ' + duration(c.talk_secs) + '</span>' +
              '<span class="spk-acts">' +
                '<button type="button" class="sample-btn" data-sample="' + v.id + ':' + c.row + '"' +
                  ' aria-pressed="' + !!c.is_sample + '">' + (c.is_sample ? 'Sample' : 'Use as sample') + '</button>' +
                '<button type="button" class="act" data-detach="' + c.row + '">Not them</button>' +
              '</span></div>';
          }).join('') + '</div>'
        : '<p class="hint">Nothing is attached: this voice has no speaker rows left.</p>';

      var picked = 0;
      audioPanel.nearby.forEach(function (n) { if (audioPanel.picked[n.row]) picked++; });
      var nearby = audioPanel.nearby.length
        ? '<div class="clip-grid">' + audioPanel.nearby.map(function (n) {
            return '<div class="clip" data-picked="' + !!audioPanel.picked[n.row] + '">' +
              '<button type="button" class="act" data-near="' + n.row + '" aria-pressed="' + !!audioPanel.picked[n.row] + '">' +
                (audioPanel.picked[n.row] ? '&#10003; Same' : 'Same?') + '</button>' +
              playBtn('cand:' + n.row, !!n.audio, 'Play this clip', true) +
              '<span class="said">' + escapeHtml(n.text || '(no transcript)') + '</span>' +
              '<span class="q">' + n.score.toFixed(2) + '</span></div>';
          }).join('') + '</div>' +
          '<div class="attach-bar"><p class="hint">Attaching re-averages the fingerprint, weighted by how long each clip is.</p>' +
            '<button type="button" class="act primary" data-attach="' + v.id + '"' + (picked ? '' : ' disabled') + '>' +
            (picked ? 'Attach ' + picked + (picked === 1 ? ' clip' : ' clips') : 'Attach clips') + '</button></div>'
        : '<p class="hint">Nothing else on file sounds like them right now.</p>';

      return '<div class="voice-audio">' +
        '<h4>In this voice <span class="count">' + audioPanel.clips.length + '</span></h4>' + attached +
        '<h4>Sounds like them — not attached yet</h4>' + nearby + '</div>';
    }

    // loadAudioPanel fetches both halves at once. is_sample is decided here
    // rather than in Go: the stored clip is a copy of one speaker's audio and
    // the database does not record which one, so the longest-talking clip --
    // the one clipFor would cut -- is shown as the sample until the user
    // picks another.
    function loadAudioPanel(id) {
      audioPanel = { id: id, clips: [], nearby: [], picked: {}, error: '' };
      Promise.all([window.voiceClips(id), window.similarToVoice(id)]).then(function (r) {
        if (openAudio !== id) return;
        audioPanel.clips = r[0] || [];
        audioPanel.nearby = r[1] || [];
        if (audioPanel.clips.length) audioPanel.clips[0].is_sample = true;
        renderVoices();
      }).catch(function (err) {
        if (openAudio !== id) return;
        audioPanel.error = String(err);
        renderVoices();
      });
    }

    function wireVoices(root) {
      root.querySelector('#voices-back').addEventListener('click', function () { showMeetingView('browse'); });

      root.querySelectorAll('[data-show-all]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          voicesShowAll[btn.dataset.showAll] = true;
          renderVoices();
        });
      });

      root.querySelectorAll('[data-play-key]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var parts = btn.dataset.playKey.split(':');
          var kind = parts[0], id = parseInt(parts[1], 10);
          if (kind === 'voice') { playSampleKey(btn.dataset.playKey, voiceBase() + id); return; }
          var clip = findClip(kind, id);
          if (clip) playSampleKey(btn.dataset.playKey, audioBase() + clip.audio, clip.start, clip.end);
        });
      });

      root.querySelectorAll('[data-name-row]').forEach(function (btn) {
        btn.addEventListener('click', function () { openVoices(parseInt(btn.dataset.nameRow, 10)); });
      });
      root.querySelectorAll('[data-clip]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var row = parseInt(btn.dataset.clip, 10);
          pickedClips[row] = !pickedClips[row];
          renderVoices();
        });
      });

      root.querySelectorAll('[data-audio]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = parseInt(btn.dataset.audio, 10);
          openAudio = openAudio === id ? 0 : id;
          editingVoice = 0;
          if (openAudio) loadAudioPanel(openAudio);
          renderVoices();
        });
      });
      root.querySelectorAll('[data-near]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var row = parseInt(btn.dataset.near, 10);
          audioPanel.picked[row] = !audioPanel.picked[row];
          renderVoices();
        });
      });
      root.querySelectorAll('[data-attach]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = parseInt(btn.dataset.attach, 10);
          var rows = audioPanel.nearby.filter(function (n) { return audioPanel.picked[n.row]; })
            .map(function (n) { return n.row; });
          if (!rows.length) return;
          Promise.all(rows.map(function (row) { return window.linkSpeaker(row, id); })).then(function () {
            toast('Attached ' + rows.length + (rows.length === 1 ? ' clip' : ' clips') + ' — fingerprint re-averaged');
            loadAudioPanel(id);
            return reloadVoices();
          }).catch(function (err) { toast(String(err)); });
        });
      });
      root.querySelectorAll('[data-sample]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var parts = btn.dataset.sample.split(':');
          var id = parseInt(parts[0], 10), row = parseInt(parts[1], 10);
          window.setVoiceSample(id, row).then(function () {
            audioPanel.clips.forEach(function (c) { c.is_sample = c.row === row; });
            toast('That clip is what the row plays now');
            return reloadVoices();
          }).catch(function (err) { toast(String(err)); });
        });
      });
      root.querySelectorAll('[data-detach]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var row = parseInt(btn.dataset.detach, 10);
          window.unlinkSpeaker(row).then(function () {
            toast('Detached — the fingerprint is rebuilt without it');
            loadAudioPanel(openAudio);
            return reloadVoices();
          }).catch(function (err) { toast(String(err)); });
        });
      });

      root.querySelectorAll('[data-edit-voice]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          editingVoice = parseInt(btn.dataset.editVoice, 10);
          forgetArmed = 0;
          eraseArmed = 0;
          renderVoices();
        });
      });
      root.querySelectorAll('[data-cancel-edit]').forEach(function (btn) {
        btn.addEventListener('click', function () { editingVoice = 0; renderVoices(); });
      });
      root.querySelectorAll('[data-save-rename]').forEach(function (btn) {
        btn.addEventListener('click', function () { saveRename(parseInt(btn.dataset.saveRename, 10)); });
      });
      root.querySelectorAll('.edit-form').forEach(function (form) {
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          saveRename(parseInt(form.dataset.renameVoice, 10));
        });
        form.querySelector('input').addEventListener('keydown', function (ev) {
          if (ev.key === 'Escape') { editingVoice = 0; renderVoices(); }
        });
      });

      root.querySelectorAll('[data-forget-voice]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = parseInt(btn.dataset.forgetVoice, 10);
          if (forgetArmed !== id) { forgetArmed = id; eraseArmed = 0; renderVoices(); return; }
          forgetArmed = 0;
          window.forgetVoice(id).then(function () {
            toast('Forgot the name — those replies are numbered again');
            if (openAudio === id) openAudio = 0;
            return reloadVoices();
          }).catch(function (err) { toast(String(err)); });
        });
      });
      root.querySelectorAll('[data-erase-voice]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = parseInt(btn.dataset.eraseVoice, 10);
          if (eraseArmed !== id) { eraseArmed = id; forgetArmed = 0; renderVoices(); return; }
          eraseArmed = 0;
          window.eraseVoice(id).then(function () {
            toast('Erased — nothing about how they sound is kept');
            if (openAudio === id) openAudio = 0;
            return reloadVoices();
          }).catch(function (err) { toast(String(err)); });
        });
      });

      var save = root.querySelector('#save-voice');
      if (save) {
        var field = root.querySelector('#voice-name');
        var submit = function () {
          var name = field.value.trim();
          if (!name) { field.focus(); return; }
          var also = similarClips.filter(function (c) { return pickedClips[c.row]; })
            .map(function (c) { return c.row; });
          nameOrLink(namingRow, name, also)
            .then(function () { openVoices(0); })
            .catch(function (err) { toast(String(err)); });
        };
        save.addEventListener('click', submit);
        field.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') submit(); });
        field.focus();
      }
    }

    function saveRename(id) {
      var form = document.querySelector('.edit-form[data-rename-voice="' + id + '"]');
      if (!form) return;
      var name = form.querySelector('input').value.trim();
      if (!name) { form.querySelector('input').focus(); return; }
      window.renameVoice(id, name).then(function () {
        editingVoice = 0;
        toast('Renamed to ' + name + ' — every meeting they spoke in follows');
        return reloadVoices();
      }).catch(function (err) { toast(String(err)); });
    }

    // findClip looks a playable clip up by where it was drawn: the naming
    // queue and the similar-voices grid ("cand"), or the audio panel of one
    // voice ("clip").
    function findClip(kind, row) {
      var pools = kind === 'clip'
        ? [audioPanel.clips]
        : [voiceData.unnamed || [], similarClips, audioPanel.nearby];
      var found = null;
      pools.forEach(function (pool) {
        pool.forEach(function (c) { if (c.row === row && !found) found = c; });
      });
      return found && found.audio ? found : null;
    }

    // playSample plays a stored voice clip, or a stretch of a recording.
    function playSample(src, from, to, onEnd) {
      stopTurnPlayer();
      var audio = document.createElement('audio');
      audio.preload = 'none';
      audio.src = src;
      document.getElementById('voices-pane').appendChild(audio);
      turnPlayer = audio;
      if (onEnd) {
        audio.addEventListener('ended', onEnd);
        audio.addEventListener('pause', onEnd);
      }
      if (from) {
        audio.currentTime = from;
        turnStopAt = to || null;
        audio.addEventListener('timeupdate', function () {
          if (turnStopAt !== null && audio.currentTime >= turnStopAt) audio.pause();
        });
      }
      audio.play().catch(function () {});
    }

    // renderTasks draws the Tasks pane: a status summary bar, then tasks
    // grouped by their LLM-assigned entity (project/client/topic) -- the
    // classification step decides is_task/entity/reminder; this only lays
    // out whatever Task Hub already produced.
    // taskFilter persists across re-renders (see meetingEntityFilter above
    // for why) -- picked once, kept until changed, not reset every time a
    // classification lands and re-triggers render().
    var taskFilter = { entity: '', status: '' };
    // Which task the side panel is showing. Kept by id, not by element:
    // every save redraws the whole pane from fresh data, and the task that
    // was open before the redraw must still be open after it.
    var selectedTaskID = '';

    function taskByID(id) {
      var list = (window.voxlog && window.voxlog.tasks) || [];
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) return list[i];
      }
      return null;
    }

    function renderTaskFilters(root, tasks) {
      var names = [];
      tasks.forEach(function (t) { if (t.entity && names.indexOf(t.entity) === -1) names.push(t.entity); });
      names.sort();
      if (taskFilter.entity && names.indexOf(taskFilter.entity) === -1) taskFilter.entity = '';

      var entitySelect = names.length
        ? '<select id="task-filter-entity">' + entityOptionsHTML(names, taskFilter.entity, 'All projects') + '</select>'
        : '';
      var statusChips = ['', 'todo', 'in_progress', 'blocked', 'done'].map(function (s) {
        return '<button type="button" class="filter-chip' + (taskFilter.status === s ? ' on' : '') + '" data-status="' + s + '">' +
          (s ? taskStatusLabel[s] : 'All') + '</button>';
      }).join('');

      root.innerHTML = entitySelect + '<div class="filter-chips">' + statusChips + '</div>';

      var reRender = function () {
        renderTasks(document.getElementById('task-filters'),
          document.getElementById('task-groups'), window.voxlog.tasks || []);
      };
      var entitySel = root.querySelector('#task-filter-entity');
      if (entitySel) entitySel.addEventListener('change', function (e) { taskFilter.entity = e.target.value; reRender(); });
      root.querySelectorAll('.filter-chip').forEach(function (btn) {
        btn.addEventListener('click', function () { taskFilter.status = btn.dataset.status; reRender(); });
      });
    }

    function renderTasks(filtersRoot, groupsRoot, allTasks) {
      renderTaskFilters(filtersRoot, allTasks);
      var tasks = allTasks.filter(function (t) {
        return (!taskFilter.entity || t.entity === taskFilter.entity) &&
               (!taskFilter.status || t.status === taskFilter.status);
      });

      // Done tasks split out per group rather than dropped: still reachable
      // (a collapsed "N completed" -- see taskRowHTML/the details element
      // below), just not cluttering the default view of what's still open.
      var byEntity = [], indexByEntity = {};
      tasks.forEach(function (t) {
        var key = t.entity || 'Unfiltered';
        if (!(key in indexByEntity)) {
          indexByEntity[key] = byEntity.length;
          byEntity.push({ entity: key, active: [], done: [] });
        }
        (t.status === 'done' ? byEntity[indexByEntity[key]].done : byEntity[indexByEntity[key]].active)
          .push(t);
      });
      // Unfiltered is the catch-all, not a project -- keep it visually last
      // regardless of when its tasks happened to land, so the real projects
      // read top-to-bottom first.
      byEntity.sort(function (a, b) {
        return (a.entity === 'Unfiltered') - (b.entity === 'Unfiltered');
      });

      var now = new Date();
      function taskRowHTML(t) {
        var reminderHTML = '<span class="reminder-chip none">No reminder</span>';
        if (t.reminder) {
          var when = new Date(t.reminder);
          var overdue = when < now && t.status !== 'done';
          reminderHTML = '<span class="reminder-chip' + (overdue ? ' overdue' : '') + '">' +
            (overdue ? 'Overdue · ' : '') +
            when.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) +
            '</span>';
        }
        var sourcePane = t.source_kind === 'meeting' ? 'meetings' : 'history';
        var options = ['todo', 'in_progress', 'blocked', 'done'].map(function (s) {
          return '<option value="' + s + '"' + (s === t.status ? ' selected' : '') + '>' + taskStatusLabel[s] + '</option>';
        }).join('');
        // Just a row. Clicking it opens the task in the panel beside the
        // list (renderTaskDetail); the fields it used to expand into live
        // there, where opening one no longer moves the rest of the list.
        return '<div class="task-row' + (t.status === 'done' ? ' done' : '') +
            (t.id === selectedTaskID ? ' selected' : '') + '" data-id="' + t.id + '">' +
            '<div class="body">' +
              '<div class="text">' + escapeHtml(t.text) + '</div>' +
              '<div class="meta">' + reminderHTML +
                (t.notes ? '<span>' + escapeHtml(t.notes.split('\n')[0].slice(0, 60)) + '</span>' : '') +
                '<a data-source-pane="' + sourcePane + '">from ' + (sourcePane === 'meetings' ? 'meeting' : 'dictation') + ' ↗</a>' +
              '</div>' +
            '</div>' +
            '<select class="status-select ' + taskStatusClass(t.status) + '" data-id="' + t.id + '">' + options + '</select>' +
          '</div>';
      }

      groupsRoot.innerHTML = byEntity.length ? byEntity.map(function (g) {
        var rows = g.active.map(taskRowHTML).join('');
        var doneSection = g.done.length
          ? '<details class="task-done-toggle"><summary>' + g.done.length + ' completed</summary>' +
            g.done.map(taskRowHTML).join('') + '</details>'
          : '';
        var tag = g.entity === 'Unfiltered' ? 'no project matched' : 'from Settings';
        return '<div class="task-entity">' +
          '<span class="task-entity-dot" style="background:' + entityColor(g.entity) + '"></span>' +
          '<span class="task-entity-name">' + escapeHtml(g.entity) + '</span>' +
          '<span class="task-entity-count">' + (g.active.length + g.done.length) + '</span>' +
          '<span class="task-entity-auto">' + tag + '</span>' +
        '</div><div class="card">' + (rows || '<div class="empty">All done here.</div>') + doneSection + '</div>';
      }).join('') : '<div class="empty">' +
        ((taskFilter.entity || taskFilter.status) && allTasks.length ? 'No tasks match this filter.' : 'No tasks yet.') +
        '</div>';

      // The status select sits inside the row, where a plain click would
      // also change which task the panel is showing. Rejecting and deleting
      // are not here at all any more: they are irreversible, they were one
      // hover away from a row anybody scrolls past, and they now live in the
      // panel behind a confirmation.
      groupsRoot.querySelectorAll('.task-row .status-select').forEach(function (el) {
        el.addEventListener('click', function (ev) { ev.stopPropagation(); });
      });

      groupsRoot.querySelectorAll('.task-row').forEach(function (row) {
        row.addEventListener('click', function () { selectTask(row.dataset.id); });
      });

      groupsRoot.querySelectorAll('.status-select').forEach(function (sel) {
        sel.addEventListener('change', function () {
          var id = sel.dataset.id, status = sel.value;
          sel.className = 'status-select ' + taskStatusClass(status);
          window.setTaskStatus(id, status).catch(function (e) { alert(e); });
        });
      });
      groupsRoot.querySelectorAll('[data-source-pane]').forEach(function (a) {
        a.addEventListener('click', function (ev) {
          // Inside a clickable row, so the click has to be stopped from also
          // opening the task in the panel on the way out.
          ev.preventDefault();
          ev.stopPropagation();
          window.selectPane(a.dataset.sourcePane);
        });
      });
      // Whatever was open stays open across a redraw, and closes if the task
      // it was showing is gone (deleted, rejected, or filtered out of the
      // list the panel sits beside).
      syncTaskDetail();
    }

    // wireTaskActs hooks up "Not a task" and Delete. Both are irreversible --
    // a deleted task is gone, and a rejected line becomes a negative example
    // for the classifier -- so neither fires on the first click: the button
    // turns into its own confirmation, with a Cancel beside it, and the
    // second click is the one that acts. confirm() is not an option here at
    // all: webview_go installs no WKUIDelegate, so it answers false without
    // ever asking (see toast in kit.js).
    function wireTaskActs(root) {
      var pending = null;

      function reset() {
        pending = null;
        root.querySelectorAll('.task-act').forEach(function (b) {
          b.textContent = b.dataset.label;
          b.classList.remove('confirming');
          b.disabled = false;
        });
        root.querySelector('.task-act-cancel').hidden = true;
      }

      root.querySelector('.task-act-cancel').addEventListener('click', reset);

      root.querySelectorAll('.task-act').forEach(function (btn) {
        btn.dataset.label = btn.textContent;
        btn.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (pending !== btn) {
            // Arming one disarms the other: two buttons both reading
            // "Confirm" is how the wrong one gets pressed.
            reset();
            pending = btn;
            btn.textContent = btn.dataset.confirm;
            btn.classList.add('confirming');
            root.querySelector('.task-act-cancel').hidden = false;
            return;
          }
          var id = btn.dataset.id;
          var call = btn.dataset.act === 'reject' ? window.rejectTask : window.deleteTask;
          btn.disabled = true;
          call(id).catch(function (e) { alert(e); reset(); });
        });
      });

      // Escape steps back out of an armed button before it means anything
      // else -- the same key that closes the panel, in the order the user
      // would expect it.
      root.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape' && pending) { ev.stopPropagation(); reset(); }
      });
    }

    // Every project the picker offers: the Settings dictionary plus whatever
    // the classifier has already filed tasks under, so moving a task to a
    // project that only exists in the data is possible too.
    function taskProjectNames() {
      var names = [];
      ((window.voxlog && window.voxlog.settings && window.voxlog.settings.entity_dictionary) || [])
        .forEach(function (n) { if (n && names.indexOf(n) === -1) names.push(n); });
      ((window.voxlog && window.voxlog.tasks) || [])
        .forEach(function (t) { if (t.entity && names.indexOf(t.entity) === -1) names.push(t.entity); });
      names.sort();
      return names;
    }

    // The three times a reminder is actually set for. Typing a date into the
    // field is the other way; these are the ones worth one click.
    var REMINDER_PRESETS = [
      { label: 'This evening', at: function () { var d = new Date(); d.setHours(18, 0, 0, 0); if (d <= new Date()) d.setDate(d.getDate() + 1); return d; } },
      { label: 'Tomorrow 9:00', at: function () { var d = new Date(); d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); return d; } },
      { label: 'Next week', at: function () { var d = new Date(); d.setDate(d.getDate() + 7); d.setHours(9, 0, 0, 0); return d; } }
    ];

    // <input type="datetime-local"> speaks local wall-clock time with no zone
    // ("2026-09-25T18:00"), and the store speaks RFC3339. These two are the
    // only places that conversion happens.
    function localInputValue(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      if (isNaN(d)) return '';
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
        'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function saveReminder(id, date) {
      window.setTaskReminder(id, date ? date.toISOString() : '').catch(function (e) { alert(e); });
    }

    function taskWhen(iso) {
      return iso
        ? new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        : '';
    }

    // selectTask opens a task in the side panel. Clicking the open one again
    // closes it: the panel is worth 340px only while it is being read.
    function selectTask(id) {
      selectedTaskID = (id && id !== selectedTaskID) ? id : '';
      document.querySelectorAll('#task-groups .task-row').forEach(function (row) {
        row.classList.toggle('selected', row.dataset.id === selectedTaskID);
      });
      renderTaskDetail();
    }

    function closeTaskDetail() { selectTask(''); }

    // syncTaskDetail is the redraw-safe half: the panel is rebuilt from the
    // fresh task, or closed if that task no longer exists. Called at the end
    // of every renderTasks.
    function syncTaskDetail() {
      if (selectedTaskID && !taskByID(selectedTaskID)) selectedTaskID = '';
      renderTaskDetail();
    }

    function renderTaskDetail() {
      var root = document.getElementById('task-panel');
      if (!root) return;
      var t = selectedTaskID ? taskByID(selectedTaskID) : null;
      if (!t) {
        root.hidden = true;
        root.innerHTML = '';
        return;
      }
      var sourcePane = t.source_kind === 'meeting' ? 'meetings' : 'history';
      var created = taskWhen(t.created), updated = taskWhen(t.updated);
      root.hidden = false;
      root.innerHTML =
        '<div class="task-side-head">' +
          '<span class="who">' + escapeHtml(t.entity || 'Unfiltered') + '</span>' +
          '<button type="button" class="task-side-close" title="Close (Esc)">&#10005;</button>' +
        '</div>' +
        '<div class="task-panel">' +
          '<label class="task-field"><span class="task-field-label">Task</span>' +
            '<input type="text" class="task-text-edit" data-id="' + t.id + '" value="' + escapeHtml(t.text) + '">' +
          '</label>' +
          '<label class="task-field"><span class="task-field-label">Notes</span>' +
            '<textarea class="task-notes" data-id="' + t.id + '" rows="6" placeholder="Anything the one-line summary left out">' +
              escapeHtml(t.notes || '') + '</textarea>' +
          '</label>' +
          '<label class="task-field"><span class="task-field-label">Project</span>' +
            '<select class="task-entity-pick" data-id="' + t.id + '">' +
              entityOptionsHTML(taskProjectNames(), t.entity || '', 'Unfiltered') +
            '</select>' +
          '</label>' +
          '<div class="task-field"><span class="task-field-label">Reminder</span>' +
            '<div class="task-remind">' +
              '<input type="datetime-local" class="task-reminder-at" data-id="' + t.id + '" value="' + localInputValue(t.reminder) + '">' +
              '<button type="button" class="act task-remind-clear"' + (t.reminder ? '' : ' disabled') + '>Clear</button>' +
            '</div>' +
            '<div class="task-remind-presets">' +
              REMINDER_PRESETS.map(function (p, i) {
                return '<button type="button" class="act task-remind-preset" data-preset="' + i + '">' + p.label + '</button>';
              }).join('') +
            '</div>' +
          '</div>' +
          '<div class="task-panel-meta">' +
            '<span>Status: ' + escapeHtml(taskStatusLabel[t.status] || t.status) + '</span>' +
            (created ? '<span>Created ' + escapeHtml(created) + '</span>' : '') +
            (updated ? '<span>Edited ' + escapeHtml(updated) + '</span>' : '') +
            '<a data-source-pane="' + sourcePane + '">Open the ' + (sourcePane === 'meetings' ? 'meeting' : 'dictation') + ' it came from ↗</a>' +
          '</div>' +
        '</div>' +
        '<div class="task-side-acts">' +
          '<button type="button" class="act task-act" data-act="reject" data-id="' + t.id + '" data-confirm="Not a task &mdash; confirm" title="Wrong -- not actually a task, and a negative example for the classifier">Not a task</button>' +
          '<button type="button" class="act task-act" data-act="delete" data-id="' + t.id + '" data-confirm="Delete &mdash; confirm" title="Remove this task for good">Delete</button>' +
          '<button type="button" class="act task-act-cancel" hidden>Cancel</button>' +
        '</div>';

      root.querySelector('.task-side-close').addEventListener('click', closeTaskDetail);
      root.querySelector('.task-entity-pick').addEventListener('change', function (ev) {
        window.setTaskEntity(ev.target.dataset.id, ev.target.value).catch(function (e) { alert(e); });
      });
      var at = root.querySelector('.task-reminder-at');
      at.addEventListener('change', function () {
        // An emptied field means "no reminder", which is the same thing
        // Clear does -- a half-typed date the browser rejects leaves the
        // value empty too, so the field is only read once it validates.
        saveReminder(at.dataset.id, at.value ? new Date(at.value) : null);
      });
      root.querySelector('.task-remind-clear').addEventListener('click', function () {
        saveReminder(at.dataset.id, null);
      });
      root.querySelectorAll('.task-remind-preset').forEach(function (btn) {
        btn.addEventListener('click', function () {
          saveReminder(at.dataset.id, REMINDER_PRESETS[parseInt(btn.dataset.preset, 10)].at());
        });
      });
      wireTaskActs(root);
      root.querySelectorAll('[data-source-pane]').forEach(function (a) {
        a.addEventListener('click', function (ev) {
          ev.preventDefault();
          window.selectPane(a.dataset.sourcePane);
        });
      });

      // Notes save on a debounce while typing. Deliberately no redraw of the
      // pane afterwards (setTaskNotes does not refresh): a redraw mid-sentence
      // would replace the textarea under the caret. The in-memory task is
      // updated here instead, so the next redraw -- whatever triggers it --
      // still draws what was typed.
      var area = root.querySelector('.task-notes');
      var timer = null;
      function commitNotes() {
        timer = null;
        var task = taskByID(area.dataset.id);
        if (task) task.notes = area.value;
        window.setTaskNotes(area.dataset.id, area.value).catch(function (e) { alert(e); });
      }
      area.addEventListener('input', function () {
        if (timer) clearTimeout(timer);
        timer = setTimeout(commitNotes, 600);
      });
      area.addEventListener('blur', function () {
        if (!timer) return;
        clearTimeout(timer);
        commitNotes();
      });

      // The task line itself commits on blur or Enter, not on every
      // keystroke: unlike notes it is what the row shows, and setTaskText
      // does redraw the pane.
      var input = root.querySelector('.task-text-edit');
      var original = input.value;
      function commitText() {
        var v = input.value.trim();
        if (!v || v === original) { input.value = original; return; }
        original = v;
        window.setTaskText(input.dataset.id, v).catch(function (e) { alert(e); });
      }
      input.addEventListener('blur', commitText);
      input.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
        if (ev.key === 'Escape') { ev.preventDefault(); input.value = original; input.blur(); }
      });
    }

    // Keyboard in the Tasks pane: up and down walk the visible rows and the
    // panel follows, Escape closes it. The row list here is .task-row rather
    // than the .entry rows the History/Meetings navigation below drives, and
    // Enter means "open", not "paste", so it is its own handler.
    document.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Escape' && ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
      var nav = document.querySelector('#shell-nav .navitem[aria-selected="true"]');
      if (!nav || nav.dataset.pane !== 'tasks') return;
      var tag = document.activeElement && document.activeElement.tagName;
      var typing = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';

      if (ev.key === 'Escape') {
        if (typing) return; // the field's own Escape reverts the edit first
        if (!selectedTaskID) return;
        ev.preventDefault();
        closeTaskDetail();
        return;
      }
      if (typing || tag === 'BUTTON') return;
      // Only rows actually on screen: the completed tasks inside a closed
      // "N completed" section are still in the DOM, and walking onto one
      // would move the panel to a task nobody can see.
      var rows = Array.prototype.slice.call(document.querySelectorAll('#task-groups .task-row'))
        .filter(function (r) {
          var section = r.closest('details');
          return !section || section.open;
        });
      if (!rows.length) return;
      ev.preventDefault();
      var ids = rows.map(function (r) { return r.dataset.id; });
      var idx = ids.indexOf(selectedTaskID);
      if (idx === -1) idx = ev.key === 'ArrowDown' ? 0 : rows.length - 1;
      else idx = ev.key === 'ArrowDown' ? Math.min(idx + 1, rows.length - 1) : Math.max(idx - 1, 0);
      selectedTaskID = '';       // selectTask toggles the open one shut
      selectTask(ids[idx]);
      rows[idx].scrollIntoView({ block: 'nearest' });
    });

    // wireEntries hooks up the hover-revealed expand/collapse and Transcribe
    // buttons shared by both lists. entryFor maps a row back to the JS object
    // it was drawn from -- renderDays and renderMeetings each index into a
    // different array, so the lookup is the one thing that has to be passed
    // in rather than shared.
    function wireEntries(root, entryFor) {
      // Task rows are wired by whoever drew them: clicking one goes to the
      // Tasks pane rather than copying its text.
      root.querySelectorAll('.entry:not([data-kind="task"])').forEach(function (row) {
        // Stashed on the element itself rather than kept in this closure:
        // keyboard navigation (below) needs to read the entry back off
        // whichever row is highlighted, without caring which list drew it.
        row._entry = entryFor(row);
        // Not every row has one: the compact meeting row in Overview's Recent
        // has nothing to expand, and reaching through a missing chevron used
        // to throw here and leave every row after it unwired.
        var chev = row.querySelector('.chev');
        if (chev) {
          chev.addEventListener('click', function (ev) {
            // Expanding is not "using" the entry -- keep it off the output path.
            ev.stopPropagation();
            var open = row.classList.toggle('expanded');
            this.title = open ? 'Collapse' : 'Expand';
            // A collapsed row must not leave a dead player behind it.
            if (!open && currentPlayer && currentPlayer.row === row) stopPlayer();
          });
        }
        row.querySelector('.body').addEventListener('click', function () {
          var entry = entryFor(row);
          // A meeting with no transcript has nothing to re-deliver; clicking
          // it must not put an empty string on the clipboard.
          // Confirming a row: whatever the setting says happens, which may
          // be pasting it back into the app behind this window.
          if (entry && entry.text) window.applyEntry(entry.text, false);
        });

        var copy = row.querySelector('.copy');
        if (copy) {
          copy.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var entry = entryFor(row);
            if (!entry || !entry.text) return;
            // A button that says Copy copies, whatever confirming a row is
            // set to do -- and the window stays open, since the user asked
            // for the clipboard rather than for the text to land somewhere.
            window.applyEntry(entry.text, true);
            // The only feedback a copy-to-clipboard action can give --
            // there is nowhere else for "done" to show up.
            var was = copy.textContent;
            copy.textContent = 'Copied';
            setTimeout(function () { copy.textContent = was; }, 1200);
          });
        }

        var transcribe = row.querySelector('.transcribe');
        if (transcribe) {
          transcribe.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var entry = entryFor(row);
            if (!entry) return;
            // The decode is queued behind whatever else is running, so this
            // says "asked for" rather than pretending to be finished. The row
            // rewrites itself when the transcript lands.
            transcribe.disabled = true;
            transcribe.textContent = 'Queued…';
            window.transcribeEntry(entry.id).catch(function (e) {
              transcribe.disabled = false;
              transcribe.textContent = 'Transcribe';
              alert(e);
            });
          });
        }

        // A row may have more than one Play button now (a meeting's mic and
        // system-audio tracks) -- each carries the file to play in its own
        // data-audio attribute, and playIn/stopPlayer are what still keep it
        // to one sounding at a time, in this row or any other.
        row.querySelectorAll('.play').forEach(function (play) {
          play.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var name = play.dataset.audio;
            if (!name) return;
            if (!row.classList.contains('expanded')) {
              row.classList.add('expanded');
              var chev = row.querySelector('.chev');
              if (chev) chev.title = 'Collapse';
            }
            playIn(row, name);
          });
        });

        // Not undoable, and Copy/Play sit right next to it -- a plain
        // confirm() is the whole guard against a stray click, per the plan
        // (no custom dialog for something this rare).
        var del = row.querySelector('.delete-audio');
        if (del) {
          del.addEventListener('click', function (ev) {
            ev.stopPropagation();
            if (!confirm('Delete this recording? This cannot be undone.')) return;
            var names = del.dataset.audio.split(',');
            if (currentPlayer && currentPlayer.row === row) stopPlayer();
            del.disabled = true;
            Promise.all(names.map(function (n) { return window.deleteRecording(n); }))
              .catch(function (e) { alert(e); del.disabled = false; });
          });
        }
      });
    }

    // ---------------- overview ----------------

    // Which stretch the tiles show. Lives here rather than in Go because
    // both sets of figures arrive in the same payload -- switching is a
    // re-render, never another round trip.
    var overviewSpan = 'today';

    function renderOverview() {
      var ov = (window.voxlog && window.voxlog.overview) || {};
      wireSpanToggle();
      renderOverviewTiles(ov);
      renderOverviewProvenance(ov);
      renderOverviewChart(ov);
      renderOverviewTasks();
      renderOverviewAI();
    }

    var spanWired = false;
    function wireSpanToggle() {
      if (spanWired) return;
      var group = document.getElementById('overview-span');
      if (!group) return;
      spanWired = true;
      group.addEventListener('click', function (ev) {
        var button = ev.target.closest('button[data-span]');
        if (!button || button.dataset.span === overviewSpan) return;
        overviewSpan = button.dataset.span;
        group.querySelectorAll('button').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b === button));
        });
        document.getElementById('overview-span-title').textContent =
          overviewSpan === 'all' ? 'All time' : 'Today';
        // The chart follows the toggle too: weeks are the grain for "lately",
        // months for "at all". Both arrive in the same payload, so this is
        // still a re-render rather than another round trip.
        renderOverviewTiles((window.voxlog && window.voxlog.overview) || {});
        renderOverviewChart((window.voxlog && window.voxlog.overview) || {});
      });
    }

    // Minutes for a day, hours for a lifetime: 12 840 min is a number nobody
    // reads, and 214 h is the same fact.
    function spanAmount(seconds) {
      var mins = Math.round((seconds || 0) / 60);
      if (mins < 180) return mins + '<small> min</small>';
      return Math.round(mins / 60) + '<small> h</small>';
    }

    // 1243000 is not a number anybody reads off a tile.
    function grouped(n) {
      return (n || 0).toLocaleString();
    }

    function typingSaved(minutes) {
      var m = minutes || 0;
      if (m < 120) return '\u2248 ' + m + ' min of typing saved';
      return '\u2248 ' + Math.round(m / 60) + ' h of typing saved';
    }

    function renderOverviewTiles(ov) {
      var el = document.getElementById('overview-tiles');
      if (!el) return;
      var span = (overviewSpan === 'all' ? ov.all_time : ov.today) || {};
      el.innerHTML =
        '<div class="tile"><div class="k">Recordings</div><div class="v">' + grouped(span.recordings) + '</div></div>' +
        '<div class="tile"><div class="k">Words dictated</div><div class="v">' + grouped(span.words) + '</div>' +
          // "\u2248" is load-bearing: 40 words/minute is a typing-speed estimate,
          // never this user's actual one (see buildOverview in stats.go).
          '<div class="d">' + typingSaved(span.typing_minutes) + '</div></div>' +
        '<div class="tile"><div class="k">Time speaking</div><div class="v">' + spanAmount(span.speaking_seconds) + '</div></div>' +
        '<div class="tile"><div class="k">Median decode</div><div class="v">' + (span.median_decode || 0).toFixed(1) + '<small> s</small></div></div>';
    }

    // Since when, and how much of that stretch has anything in it. A rolling
    // window cannot answer either, which is why the line exists at all -- and
    // it says nothing at all until there is a first recording to date it from.
    function renderOverviewProvenance(ov) {
      var el = document.getElementById('overview-provenance');
      if (!el) return;
      if (!ov.first_day) { el.textContent = ''; return; }
      var since = new Date(ov.first_day + 'T00:00:00')
        .toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      var total = (ov.all_time && ov.all_time.speaking_seconds) || 0;
      el.textContent = 'Recording since ' + since + ' \u00b7 ' +
        (ov.active_days || 0) + ' of ' + (ov.span_days || 0) + ' days have something in them \u00b7 ' +
        duration(total) + ' of audio';
    }

    // One column per week, stacking meetings above dictations, scaled to the
    // tallest column -- and a week with nothing in it still gets its label and
    // an empty column, so a gap reads as a gap rather than vanishing from the
    // axis.
    function renderOverviewChart(ov) {
      var bars = document.getElementById('overview-bars');
      var legend = document.getElementById('overview-legend');
      if (!bars || !legend) return;
      var byMonth = overviewSpan === 'all';
      var cols = (byMonth ? ov.months : ov.weeks) || [];
      var max = 1;
      cols.forEach(function (c) { max = Math.max(max, c.dictations + c.meetings); });

      var title = document.getElementById('overview-chart-title');
      if (title) {
        title.textContent = byMonth
          ? (cols.length > 1 ? 'By month' : 'This month')
          : 'Last ' + (ov.weeks || []).length + ' weeks';
      }

      bars.innerHTML = cols.map(function (c, i) {
