<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Before every other script on the page: the settings fragment runs its
     own script, and it uses these helpers too. -->
<script>
  /* KIT_JS */
</script>
<style>
  /* KIT_CSS */
  /* SETTINGS_CSS */
  /* INDICATOR_CSS */

  /* ---- meetings: the list, one meeting opened, and the voices ---------- */

  /* A meeting card leads with its summary, not its transcript: the
     transcript is what you read once you are inside, and an hour of it in a
     list makes every other meeting unreachable. */
  .meeting-card {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 14px;
    width: 100%; text-align: left; cursor: pointer; border: none;
    background: var(--card);
    border-radius: var(--r-md); padding: 12px 14px; color: var(--label); font: inherit;
    box-shadow: var(--glass-flat);
  }
  .meeting-card:hover { box-shadow: var(--glass-flat), 0 0 0 1px var(--accent); }
  .meeting-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .m-top { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .m-title { font-size: 14px; font-weight: 600; }
  .m-when { color: var(--secondary); font-variant-numeric: tabular-nums; }
  .m-sum {
    grid-column: 1 / -1; margin-top: 2px; max-width: 68ch;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .m-sum.none { color: var(--secondary); font-style: italic; }
  .m-foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 9px; flex-wrap: wrap; }
  .m-foot .act { margin-left: auto; }
  .avatars { display: flex; align-items: center; }
  .avatar {
    width: 20px; height: 20px; border-radius: 50%; flex: none;
    display: grid; place-items: center; color: #fff;
    font-size: var(--fs-micro); font-weight: 600; border: 1.5px solid var(--bg);
  }
  /* Only the stack on a meeting card overlaps. A single avatar at the head of
     a People row was pulling the name 6px into it. */
  .avatars .avatar { margin-right: -6px; }
  /* How the call was shared out, as one bar. Two pixels of background
     between segments so neighbouring colours never merge into a third. */
  .talk-strip { grid-column: 1 / -1; display: flex; gap: 2px; height: 5px; margin-top: 9px; }
  .talk-strip i { display: block; border-radius: 2px; }
  /* Inside an open meeting the same strip is the headline, not a footnote. */
  .talk-strip.tall { height: 10px; }

  .detail-head { display: flex; align-items: center; gap: 10px; margin: 16px 0 10px; flex-wrap: wrap; }
  .detail-head .filter-search { margin-left: auto; }
  .back-btn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 4px; font: inherit; }
  /* One ring, one offset, on everything focusable. Four controls had no
     :focus-visible rule at all, and the ones that did disagreed about the
     offset -- 1px here, 2px there, -1px in Settings. */
  #shell-content :focus-visible, #shell-nav :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Same id in the selector, or the rule above out-specifies this one and
     a field's ring sits outside its own border. */
  #shell-content .task-panel input[type=text]:focus-visible,
  #shell-content .task-panel textarea:focus-visible,
  #shell-content .filter-search:focus-visible,
  #shell-content .name-form input:focus-visible { outline-offset: -1px; }
  /* 15px, not 18px: the largest text on a meeting screen should be the
     figures in .fact, not the date at the top of it. */
  .detail-title { font-size: var(--fs-lead); font-weight: var(--fw-bold); }
  .detail-meta { color: var(--secondary); display: flex; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; margin-bottom: 14px; }
  /* A panel inside a meeting is the same object as a card anywhere else:
     no border of its own, the kit's radius, the kit's glass. It used to
     carry a 1px border and an 11px radius, which is why the inside of a
     meeting looked like a different app. */
  .panel { background: var(--card); border: none; border-radius: var(--r-md); padding: 13px 14px; box-shadow: var(--glass-low); }
  .panel.spaced { margin-top: 14px; }
  .panel.spaced-below { margin-bottom: 14px; }
  /* Numbered, because an action item list is read as "how many, and
     which one" -- the number sits in a small accent disc so the list reads
     as steps rather than as a paragraph broken into lines. */
  .action-items { margin: 0; padding: 0; list-style: none; counter-reset: ai; }
  .action-items li { counter-increment: ai; position: relative; padding-left: 30px; line-height: 1.45; }
  .action-items li::before {
    content: counter(ai); position: absolute; left: 0; top: 0;
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
    background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent);
  }
  .action-items li + li { margin-top: 8px; padding-top: 8px; border-top: 0.5px solid var(--separator); }
  .action-items li + li::before { top: 8px; }
  .summary-text { line-height: 1.5; }
  .panel h3 { margin: 0 0 10px; font-size: var(--fs-caption); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--secondary); }
  /* align-items: start, or the shorter panel is stretched to the taller
     one's height and ends in a band of empty glass. */
  .stats-row { display: grid; grid-template-columns: 1fr 200px; gap: 14px; margin-bottom: 16px; align-items: start; }
  @media (max-width: 820px) { .stats-row { grid-template-columns: 1fr; } }
  .spk-rows { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
  .spk-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
  .spk-name { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .spk-figs { text-align: right; font-variant-numeric: tabular-nums; color: var(--secondary); }
  .spk-figs b { color: var(--label); font-weight: 600; }
  .spk-bar { grid-column: 1 / -1; height: 6px; background: var(--field); border-radius: 3px; overflow: hidden; }
  .spk-bar i { display: block; height: 100%; border-radius: 3px; }
  /* A button that looks like one. As borderless accent text it read as a
     label, and there was no way to tell it apart from the name beside it. */
  .name-btn {
    border: none; border-radius: var(--r-sm); height: 20px; padding: 0 7px;
    background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent);
    font: inherit; font-size: var(--fs-small); font-weight: var(--fw-medium); cursor: pointer;
  }
  .name-btn:hover { background: var(--accent); color: #fff; }
  .facts { display: flex; flex-direction: column; gap: 10px; }
  .fact b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .fact span { color: var(--secondary); font-size: 11px; }

  .turns { display: flex; flex-direction: column; }
  .turn-row { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; padding: 7px 8px; border-radius: 8px; align-items: start; }
  .turn-row:hover { background: var(--field); }
  .turn-row.playing { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .turn-at { color: var(--secondary); font-variant-numeric: tabular-nums; font-size: 11px; text-align: right; padding-top: 2px; }
  .turn-who { font-weight: 600; margin-right: 6px; background: none; border: 0; padding: 0;
    font: inherit; font-weight: 600; cursor: pointer; border-bottom: 1px dashed transparent; }
  .turn-who:hover { border-bottom-color: currentColor; }
  /* A reply somebody decided by hand, as opposed to one the pipeline guessed. */
  .turn-fixed { display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; vertical-align: 3px; margin-left: 4px; }
  .who-form { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    margin: 6px 0 2px; padding: 8px; border-radius: 8px; background: var(--sunk, rgba(127,127,127,.08)); }
  .who-picks { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
  .who-pick { display: inline-flex; align-items: center; gap: 6px; }
  .who-unnamed { opacity: .6; font-style: normal; font-size: .85em; }
  .who-form input { flex: 1; min-width: 160px; }
  /* Quiet rather than absent: at opacity 0 the control did not exist for a
     keyboard or a trackpad that never hovers. */
  .turn-play {
    border: none; background: var(--field); color: var(--secondary);
    border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 10px;
  }
  .turn-row:hover .turn-play, .turn-row.playing .turn-play, .turn-play:focus-visible { background: var(--accent); color: #fff; }
  /* Search results across meetings: a row is a button, because clicking one
     goes somewhere -- into the meeting, at that reply. */
  .hit-row {
    display: grid; grid-template-columns: 108px 1fr auto; gap: 10px;
    width: 100%; text-align: left; align-items: start;
    padding: 8px 11px; border: none; border-top: 0.5px solid var(--separator);
    background: none; color: inherit; font: inherit; cursor: pointer;
  }
  .hit-row:first-child { border-top: none; }
  .hit-row:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .hit-when, .hit-at { font-size: 11px; color: var(--tertiary); font-variant-numeric: tabular-nums; }
  .hit-body { min-width: 0; line-height: 1.4; }
  .hit-row mark { background: color-mix(in srgb, var(--yellow) 55%, transparent); color: inherit; border-radius: 3px; }

  /* People: one row per named voice, bar relative to the person talked with
     most. Who dominates the calendar reads faster as a length than as a
     number of seconds. */
  .person-row { display: flex; gap: 10px; align-items: center; padding: var(--sp-4) var(--sp-5); border-top: 0.5px solid var(--separator); }
  .person-row:first-child { border-top: none; }
  .person-body { flex: 1; min-width: 0; }
  .person-name { font-weight: var(--fw-medium); }
  .person-bar { height: 6px; border-radius: 3px; background: var(--field); margin: 5px 0 4px; overflow: hidden; }
  .person-bar i { display: block; height: 100%; border-radius: 3px; }
  .person-meta { font-size: var(--fs-caption); color: var(--tertiary); font-variant-numeric: tabular-nums; }

  .turn-row mark { background: color-mix(in srgb, var(--yellow) 55%, transparent); color: inherit; border-radius: 3px; }

  /* The whole call as a strip of who-spoke-when. Click it to seek. */
  .timeline { position: relative; height: 22px; cursor: pointer; margin: 10px 0 4px; }
  .timeline .track { position: absolute; inset: 7px 0; display: flex; gap: 1px; }
  .timeline .track i { display: block; border-radius: 2px; }
  .playhead { position: absolute; top: 2px; bottom: 2px; width: 2px; background: var(--label); border-radius: 1px; }
  .player-bar { display: flex; align-items: center; gap: 10px; color: var(--secondary); font-variant-numeric: tabular-nums; }

  /* avatar · play · who · actions. The play control is its own column: the
     sample is what the row is for, and it must not move as a name grows. */
  .voice-item { display: grid; grid-template-columns: auto auto 1fr auto; gap: 11px; align-items: center;
    background: var(--card); border: none; border-radius: var(--r-md); padding: 10px 12px; box-shadow: var(--glass-flat); }
  .voice-item .sub { color: var(--secondary); font-size: 11px; }
  .voice-item > span:nth-child(3) { min-width: 0; }
  .voice-acts { display: flex; gap: 6px; }
  .voice-list { display: flex; flex-direction: column; gap: 8px; }
  .clip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; margin-top: 10px; }
  .clip {
    display: grid; grid-template-columns: auto auto 1fr auto; gap: 9px; align-items: center; text-align: left;
    border: 1px solid var(--separator); background: var(--field); color: var(--label); font: inherit;
    border-radius: 9px; padding: 8px 10px; cursor: pointer;
  }
  /* The card is no longer the button: it holds a "same person?" toggle and
     a play control of its own, and the tick is what carries the state. */
  .clip[data-picked="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .clip .act[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .clip .q { font-variant-numeric: tabular-nums; color: var(--secondary); font-size: 11px; }
  .clip .said { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  /* One play control, everywhere a voice can be heard: the library row, a
     clip inside a voice, a naming candidate, a speaker in a meeting. The
     sample being one click away in the row is the whole point -- it used to
     be a button that appeared only on a voice that happened to have a stored
     clip, on one screen. */
  .play {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    border: none; background: var(--field); color: var(--label);
    display: grid; place-items: center; cursor: pointer; position: relative; font-size: 10px;
  }
  .play:hover { background: var(--accent); color: #fff; }
  .play.sm { width: 22px; height: 22px; font-size: 9px; }
  .play[aria-pressed="true"] { background: var(--accent); color: #fff; }
  /* The ring is the clip running out. Something has to say it is playing,
     and a spinner would say "loading" instead. */
  .play[aria-pressed="true"]::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
    border-top-color: var(--accent); animation: play-spin 1.1s linear infinite;
  }
  @keyframes play-spin { to { transform: rotate(360deg); } }
  .play[disabled] { opacity: .35; cursor: default; }
  .play[disabled]:hover { background: var(--field); color: var(--label); }
  @media (prefers-reduced-motion: reduce) { .play[aria-pressed="true"]::after { animation: none; } }

  /* Row actions are quieter until the row is pointed at or focused: four
     buttons on every row at full strength is what made this pane look like a
     wall of controls. Quieter, not ghosted -- at .45 they read as disabled,
     which is indistinguishable from the bug where they genuinely did
     nothing, and that is how they were reported. */
  .voice-acts .act, .spk-acts .act { opacity: .75; transition: opacity .12s; }
  .voice-item:hover .act, .voice-item:focus-within .act,
  .spk-row:hover .act, .spk-row:focus-within .act,
  .voice-item.open .act, .act:focus-visible { opacity: 1; }
  .act.danger { color: var(--red); }
  .ai-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; }
  .ai-what { flex: 1; min-width: 0; color: var(--label); }
  .ai-model { color: var(--secondary); }
  .ai-state { border: none; background: none; padding: 0; font: inherit; font-size: 12px; font-weight: 600; }
  .ai-state.ok { color: var(--green); }
  .ai-state.bad { color: var(--red); cursor: pointer; }
  .ai-state.low { color: var(--orange); }
  /* An OpenRouter account out of free requests for the day, and the line
     above the accounts that says so (settings-pane.html). */
  .subtext.warn#or-limit-banner { color: var(--red); font-weight: 600; }
  .pill-limit { color: var(--red); font-weight: 600; font-size: 12px; }
  .act.danger:hover:not(:disabled) { background: var(--red); color: #fff; }
  .act.primary { background: var(--accent); color: #fff; }
  .act.quiet { background: none; color: var(--accent); }
  .act.quiet:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .act[disabled] { opacity: .35; cursor: default; }
  /* A count beside a heading or on a button: the number is context, not the
     thing being said. */
  .count { color: var(--tertiary); font-weight: var(--fw-medium); font-variant-numeric: tabular-nums; }
  /* The date, once a meeting has a name of its own to lead with. */
  .detail-when { color: var(--secondary); font-variant-numeric: tabular-nums; }
  .voice-item.open { border-radius: var(--r-md) var(--r-md) 0 0; }

  /* What one voice is made of, opened under the row it belongs to: the
     clips already attached (each playable, any of them promotable to the
     stored sample) and the unnamed speakers that could be attached next. */
  .voice-audio {
    background: var(--card); box-shadow: var(--glass-flat);
    border-radius: 0 0 var(--r-md) var(--r-md); margin: -8px 0 0; padding: 11px 13px 12px;
  }
  .voice-audio h4 {
    margin: 0 0 7px; font-size: var(--fs-caption); font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; color: var(--secondary);
  }
  .voice-audio h4 + h4, .voice-audio .clip-grid + h4 { margin-top: 13px; }
  .clip-rows { display: flex; flex-direction: column; gap: 3px; }
  .clip-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: 9px; align-items: center; padding: 4px 6px; border-radius: var(--r-sm); margin: 0 -6px; }
  .clip-row:hover, .clip-row:focus-within { background: var(--field); }
  .clip-row .when { color: var(--secondary); font-size: var(--fs-caption); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .clip-row .said { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sample-btn {
    border: none; border-radius: var(--r-pill); padding: 2px 10px; cursor: pointer;
    background: var(--field); color: var(--secondary); font: inherit; font-size: var(--fs-small); white-space: nowrap;
  }
  .sample-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .attach-bar { display: flex; align-items: center; gap: 9px; margin-top: 10px; }
  .attach-bar .hint { margin: 0; flex: 1; font-size: var(--fs-caption); }
  .clip-grid .play { margin-right: -2px; }

  /* "Sounds like Alex, but not surely enough to say so." Go computes this
     band on every decode and used to throw it away. */
  .guess {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    background: color-mix(in srgb, var(--yellow) 16%, transparent);
    border-radius: var(--r-sm); padding: 4px 8px; font-size: var(--fs-caption);
  }
  .spk-acts { display: flex; align-items: center; gap: 6px; }
  .spk-form { grid-column: 1 / -1; display: flex; gap: 6px; margin: 2px 0; }
  .voice-item .edit-form { grid-column: 2 / -1; display: flex; gap: 6px; }
  .edit-form input, .spk-form input {
    flex: 1; min-width: 0; background: var(--field); border: 1px solid var(--accent);
    border-radius: var(--r-sm); padding: 5px 9px; color: var(--label); font: inherit;
  }
  .edit-form input:focus, .spk-form input:focus { outline: none; }

  .name-form { display: flex; gap: 8px; margin-top: 12px; }
  .name-form input { flex: 1; background: var(--field); border: 1px solid var(--separator); border-radius: 7px; padding: 6px 9px; color: var(--label); font: inherit; }
  .name-form input:focus { outline: none; border-color: var(--accent); }
  .hint { color: var(--secondary); margin: 8px 0 0; }
  .filter-search {
    background: var(--field); border: 1px solid transparent; border-radius: 7px;
    padding: 4px 9px; color: var(--label); font: inherit; min-width: 180px;
  }
  .filter-search:focus { outline: none; border-color: var(--accent); }

  /* Window chrome: a sidebar and one scrolling pane, the way System
     Settings does it. Every pane stays in the DOM whichever one is
     showing -- the settings form has to be complete when it is read, and
     hiding a pane must not take its values with it. */
  .shell { display: flex; height: 100%; }
  .sidebar { flex: none; width: 196px; padding: 10px; background: var(--sidebar);
             -webkit-backdrop-filter: blur(28px) saturate(180%);
             backdrop-filter: blur(28px) saturate(180%);
             border-right: 0.5px solid var(--separator); display: flex;
             flex-direction: column; gap: 1px; }
  .content { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; }
  .pane { display: none; padding: 0 20px 28px; }
  .pane.on { display: block; }
  /* The settings pane brings its own two-column layout, so it opts out of
     the padding the other three want. */
  .pane[data-pane="settings"] { padding: 0; height: 100%; }
  /* The fragment is a sidebar plus a pane in its own right; nothing in
     settings.css says so, because the window it came from said it on
     <body>. */
  #settings-pane { display: flex; height: 100%; }

  /* Pinned to the bottom of the sidebar: margin-top:auto against the nav's
     column layout, which is what turns the empty space under the items into
     the queue's home. */
  .queue {
    margin-top: auto;
    padding: 8px 4px 2px;
    border-top: 0.5px solid var(--separator);
  }
  .queue-title {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tertiary); padding: 0 5px 5px;
  }
  .queue-row {
    display: flex; align-items: center; gap: 7px;
    padding: 3px 5px; border-radius: 6px;
    font-size: 11px; color: var(--secondary);
    cursor: default;
  }
  .queue-row:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--label); }
  .queue-row .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Running spins, waiting is a still dot: the difference has to read
     without the words, because the words are truncated. */
  .queue-mark { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .queue-row.running .queue-mark {
    border: 1.5px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-top-color: var(--accent);
    animation: queue-spin 0.9s linear infinite;
  }
  .queue-row.waiting .queue-mark { background: var(--separator); }
  .queue-row.llm .queue-mark { border-top-color: var(--purple); }
  @keyframes queue-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .queue-row.running .queue-mark { animation: none; } }
  .queue-more { font-size: 10.5px; color: var(--tertiary); padding: 2px 5px 0; }

  .navitem {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 6px 9px;
    border: none;
    border-radius: 8px;
    background: none;
    box-shadow: none;
    font: inherit;
    color: var(--label);
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
  }
  .navitem:hover:not([aria-selected="true"]) { background: var(--field); }
  .navitem[aria-selected="true"] {
    background: var(--accent);
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
  }

  /* Days are sections; entries are rows in a card. The heading is the kit's
     group title with the breathing room a scrolling list needs. */
  .group-title.day { margin: 20px 0 6px 10px; }
  .group-title.day:first-child { margin-top: 16px; }

  .entry {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 12px;
    border-top: 0.5px solid var(--separator);
    /* wrap, not nowrap: the player is a full-width item appended after the
       pill/body/acts/chevron row, and wrap is what drops it onto its own
       line instead of squeezing it in beside them. */
    flex-wrap: wrap;
  }
  .entry:first-child { border-top: none; }
  .entry .player { width: 100%; margin-top: 6px; }
  .entry:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
  /* Arrow-key selection, distinct from :hover so a mouse resting over a
     different row doesn't visually compete with the one Enter would act on. */
  .entry.kbd-selected { background: color-mix(in srgb, var(--accent) 16%, transparent);
                         box-shadow: inset 2px 0 0 var(--accent); }
  /* How long it took, as a pill on the left: the one number worth scanning
     down the column. */
  .entry .pill {
    flex: none;
    min-width: 48px;
    text-align: center;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--field);
    color: var(--secondary);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }
  .entry .body { flex: 1; min-width: 0; cursor: pointer; }
  /* Collapsed by default: one line, ellipsised. Expanding drops the clamp,
     so there is never a second copy of the text anywhere. */
  .entry .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry.expanded .text { white-space: pre-wrap; overflow: visible; }
  .entry .body:hover .text { color: var(--accent); }
  .entry .untranscribed { color: var(--tertiary); font-style: italic; }
  .entry .summary {
    margin-top: 5px; padding: 6px 9px;
    border-radius: 8px; background: var(--field);
    font-size: 11.5px; color: var(--label); line-height: 1.4;
  }
  .entry .summary-label {
    display: block; font-size: 9.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tertiary); margin-bottom: 2px;
  }
  .entry .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 2px;
    font-size: 11px;
    color: var(--tertiary);
    font-variant-numeric: tabular-nums;
  }
  .tag { padding: 1px 6px; border-radius: 5px; background: var(--field);
         color: var(--secondary); font-size: 10px; }
  .tag.pending { background: color-mix(in srgb, var(--yellow) 18%, transparent);
                 color: var(--yellow); }
  /* A task has no elapsed time to put in the left pill, so the pill carries
     its status instead -- the one thing worth scanning down that column. */
  .entry .pill[class*="status-"] { font-weight: var(--fw-bold); }
  .entry[data-kind="task"] { cursor: pointer; }

  /* Row actions appear on hover or once the row is open -- the resting list
     stays a list, not a wall of buttons. */
  .acts { display: none; gap: 4px; flex: none; }
  .entry:hover .acts, .entry.expanded .acts { display: flex; }
  .act {
    height: 24px;
    padding: 0 8px;
    border: none;
    border-radius: 6px;
    background: var(--field);
    color: var(--secondary);
    box-shadow: none;
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .act:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .act:disabled { color: var(--tertiary); }

  .chev {
    flex: none;
    width: 24px; height: 24px;
    border: none; border-radius: 6px;
    background: none; box-shadow: none;
    color: var(--tertiary);
    font-size: 10px; cursor: pointer;
  }
  .entry.expanded .chev { transform: rotate(90deg); }
  .chev:hover { color: var(--label); background: var(--separator); }

  .empty { color: var(--secondary); text-align: center; padding: 48px 20px; }

  /* ---------------- overview ---------------- */
  /* Live meeting banner: state is carried by form (pulsing dot, red rule)
     as well as by the words, so it reads before it is read. */
  .live {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 13px;
    border-radius: 10px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--red) 14%, transparent), transparent), var(--card);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    box-shadow: var(--glass-low);
    border-left: 3px solid var(--red);
  }
  .live .pulse {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--red);
    animation: pulse 1.6s ease-in-out infinite;
    flex: none;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .live .pulse { animation: none; } }
  .live .what { font-weight: 590; }
  .live .sub { font-size: 11px; color: var(--secondary); }
  .live .elapsed {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    letter-spacing: -0.01em;
  }

  /* The decode-queue banner is the live-meeting banner in a different key:
     same glass card and left rule, accent instead of red, and a spinner
     rather than a pulse -- recording is happening to you, decoding is
     happening for you. */
  .tag.transcribing {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 15%, transparent);
  }

  /* Heading and its control on one line: the toggle belongs to the tiles
     under it, not to the pane. */
  .head-row { display: flex; align-items: center; gap: 9px; margin: 20px 0 6px; }
  .head-row:first-child { margin-top: 16px; }
  .head-row .group-title.day { margin: 0 0 0 10px; }
  .segmented { margin-left: auto; display: inline-flex; gap: 2px; padding: 2px; background: var(--field); border-radius: 999px; }
  .segmented button {
    border: none; background: none; color: var(--secondary); font: inherit;
    font-size: 11px; font-weight: 500; padding: 3px 11px; border-radius: 999px; cursor: pointer;
  }
  .segmented button[aria-pressed="true"] { background: var(--card); color: var(--label); font-weight: 650; box-shadow: 0 1px 2px var(--glass-shadow); }
  .segmented button:hover:not([aria-pressed="true"]) { color: var(--label); }
  /* Since when, and how much of that stretch has anything in it -- the one
     thing a rolling window can never say. */
  .provenance { margin-top: 9px; padding: 0 10px; font-size: 11px; color: var(--tertiary); font-variant-numeric: tabular-nums; }

  /* Tiles left, chart right, both starting at the top: the chart is short
     and must not stretch itself to the height of two rows of tiles. */
  .overview-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  /* Narrow enough and the pair becomes a stack: two tiles beside a chart in
     a 500px window is four columns of nothing. */
  @media (max-width: 720px) {
    .overview-row { grid-template-columns: 1fr; }
  }
  .tile {
    background: var(--card);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%);
    border-radius: 10px;
    box-shadow: var(--glass-low);
    padding: 9px 11px 10px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
    position: relative;
    overflow: hidden;
  }
  /* A soft sweep top-left, the thing that reads as "curved and lit" rather
     than "a flat rectangle with a blur filter on it". */
  .tile::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(120% 60% at 0% 0%, var(--glass-edge), transparent 55%);
    opacity: 0.4;
    pointer-events: none;
  }
  /* Positioned, not just styled: an absolutely-positioned ::before paints
     after static in-flow content by CSS's own stacking rules, so without
     this the highlight sweep would sit on top of the numbers instead of
     under them. */
  .tile .k, .tile .v, .tile .d { position: relative; }
  .tile .k {
    font-size: 10.5px;
    color: var(--secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile .v {
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.025em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .tile .v small { font-size: 11px; font-weight: 500; color: var(--secondary); letter-spacing: 0; }
  .tile .d { font-size: 10px; color: var(--tertiary); }

  /* Eight-week column chart, drawn straight onto the pane. This week is the
     emphasised endpoint. */
  .chart { padding: 4px 2px 0; }
  .chart .chart-title { margin: 0 0 8px 2px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 60px; }
  .bars .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; min-width: 0; }
  /* Capped, not stretched: eight columns across a wide window would each be
     150px of ribbon, which reads as a stack of bands rather than a chart. */
  .bars .stack { display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; height: 48px; width: 100%; max-width: 34px; }
  .bars .dict { background: var(--accent); border-radius: 3px 3px 0 0; opacity: 0.85; }
  .bars .meet { background: var(--purple); border-radius: 3px 3px 0 0; opacity: 0.8; }
  .bars .col.today .dict, .bars .col.today .meet { opacity: 1; }
  .bars .lbl {
    text-align: center;
    white-space: nowrap;
    font-size: 9.5px;
    color: var(--tertiary);
    font-variant-numeric: tabular-nums;
  }
  .bars .col.today .lbl { color: var(--accent); font-weight: 600; }
  .legend {
    display: flex;
    gap: 14px;
    padding: 10px 2px 2px;
    border-top: 0.5px solid var(--separator);
    margin-top: 10px;
    font-size: 11px;
    color: var(--secondary);
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  /* ---------------- task hub ---------------- */
  /* A classified entry gets the same "this row means more" language the
     live-meeting banner already uses -- a left rule plus a faint tint --
     rather than a new visual idiom for the same idea. */
  .entry.task-detected {
    border-left: 3px solid var(--green);
    background: color-mix(in srgb, var(--green) 6%, transparent);
  }
  .tag.task-detected { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green-ink); }
  .entry .hub-note { margin-top: 4px; font-size: 11px; color: var(--green-ink); font-weight: 500; }
  /* Entity/status tags on a classified History or Meetings row -- the same
     facts the Tasks pane shows for this task, so the project and where it
     stands are visible right where it was dictated too. */
  .tag.task-entity-tag { display: inline-flex; align-items: center; gap: 4px; }
  .tag.task-entity-tag::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dot);
  }
  /* One status, one colour, whichever shape is carrying it: a tag on a
     History row, the pill on an Overview row, the picker in Tasks. The
     shapes bring their own geometry; this brings the meaning. */
  :is(.tag, .status-select, .entry .pill).status-todo { background: var(--field); color: var(--secondary); }
  :is(.tag, .status-select, .entry .pill).status-in_progress { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  :is(.tag, .status-select, .entry .pill).status-blocked { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red-ink); }
  :is(.tag, .status-select, .entry .pill).status-done { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green-ink); }

  .task-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 560px) { .task-summary { grid-template-columns: 1fr 1fr; } }
  /* The same object as an Overview tile, so the same geometry, not a
     near-miss of it. A button: each one opens Tasks on that status. */
  .task-stat {
    border: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
    background: var(--card);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-radius: var(--r-md); padding: 9px 11px 10px;
    box-shadow: var(--glass-low);
  }
  .task-stat .n { font-size: var(--fs-display); font-weight: var(--fw-bold); letter-spacing: -0.02em; }
  .task-stat .k { font-size: var(--fs-small); color: var(--secondary); text-transform: uppercase; letter-spacing: 0.04em; }
  .task-stat.todo .n { color: var(--secondary); }
  .task-stat.progress .n { color: var(--accent); }
  .task-stat.blocked .n { color: var(--red); }
  .task-stat.done .n { color: var(--green); }

  /* A project heading is a section heading: the same one History puts over
     a day and Overview puts over Recent, plus the dot, which carries
     information the words do not. */
  .task-entity { display: flex; align-items: center; gap: 7px; margin: 20px 0 6px 10px; }
  .task-entity:first-child { margin-top: 16px; }
  .task-entity-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .task-entity-name {
    font-size: var(--fs-caption); font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--secondary);
  }
  .task-entity-count { font-size: 11px; color: var(--tertiary); }
  .task-entity-auto { margin-left: auto; font-size: 10px; color: var(--tertiary); font-weight: 500; }

  .task-row { display: flex; align-items: flex-start; gap: 11px; padding: 11px 13px; border-top: 0.5px solid var(--separator); }
  .task-row:first-child { border-top: none; }
  .task-row .body { flex: 1; min-width: 0; }
  .task-row .text { font-weight: 500; }
  .task-row.done .text { color: var(--tertiary); text-decoration: line-through; }
  .task-row .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 5px; font-size: 11px; color: var(--tertiary); }
  .task-row .meta a { color: var(--secondary); text-decoration: none; cursor: pointer; }
  .task-row .meta a:hover { color: var(--accent); }

  /* Hidden until hovered, same as History/Meetings row actions -- a resting
     task list should read as a list, not a wall of buttons. */
  /* A row is clickable and says which task the panel beside it is showing.
     The accent rule is the same "this one is open" language the Voices pane
     uses for a selected speaker. */
  .task-row { cursor: pointer; }
  .task-row:hover .text { color: var(--accent); }
  .task-row.selected { background: color-mix(in srgb, var(--accent) 9%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
  .task-row.kbd-selected { background: color-mix(in srgb, var(--accent) 6%, transparent); }

  /* The split: list on the left, the open task on the right. .content is
     still the only scroller on the pane -- the panel sticks rather than
     scrolling on its own, so the page never has two scrollbars racing. */
  .task-split { display: flex; align-items: flex-start; gap: 16px; }
  #task-groups { flex: 1; min-width: 0; }
  .task-side {
    flex: none; width: 340px; position: sticky; top: 16px;
    max-height: calc(100vh - 140px); overflow-y: auto;
    background: var(--card); border-radius: var(--r-md);
    box-shadow: var(--glass-low);
    margin-top: 16px;
  }
  /* Narrow window: the panel goes under the list rather than squeezing it
     into a column of single words. */
  @media (max-width: 820px) {
    .task-split { flex-direction: column; }
    .task-side { width: 100%; position: static; max-height: none; }
  }
  .task-side-head {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 11px 13px; border-bottom: 0.5px solid var(--separator);
  }
  .task-side-head .who { flex: 1; min-width: 0; font-weight: 600; }
  .task-side-close {
    flex: none; border: none; background: none; cursor: pointer;
    color: var(--tertiary); font: inherit; font-size: 13px; line-height: 1;
    padding: 2px 4px; border-radius: 5px;
  }
  .task-side-close:hover { background: var(--field); color: var(--label); }
  .task-side-acts { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 13px 12px; }
  /* An armed button says so in the colour the rest of the app uses for
     "this one does not come back". */
  .task-act.confirming {
    background: color-mix(in srgb, var(--red) 16%, transparent);
    color: var(--red-ink); font-weight: var(--fw-bold);
  }
  .task-panel {
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px 13px 14px;
  }
  .task-field { display: flex; flex-direction: column; gap: 4px; }
  .task-field-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--tertiary); }
  .task-panel input[type=text], .task-panel textarea {
    font: inherit; color: var(--label); background: var(--card);
    border: 0.5px solid var(--separator); border-radius: 6px;
    padding: 6px 8px; width: 100%; resize: vertical;
  }
  /* The project picker in the panel is the same pill the pane filters use --
     one look for "pick a project", wherever it is being picked. */
  .task-panel select {
    font: inherit; font-size: 11.5px; color: var(--label);
    background: var(--field); border: none; border-radius: var(--r-sm);
    padding: 5px 9px; cursor: pointer; width: 100%;
  }
  .task-remind { display: flex; align-items: center; gap: 6px; }
  .task-remind input[type=datetime-local] {
    flex: 1; min-width: 0; font: inherit; font-size: 11.5px; color: var(--label);
    background: var(--card); border: 0.5px solid var(--separator);
    border-radius: 6px; padding: 4px 6px;
  }
  .task-remind-presets { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .task-panel-meta {
    display: flex; flex-wrap: wrap; gap: 4px 12px;
    font-size: 11px; color: var(--tertiary);
  }
  .task-panel-meta a { color: var(--secondary); text-decoration: none; cursor: pointer; }
  .task-panel-meta a:hover { color: var(--accent); }

  .task-done-toggle summary {
    cursor: pointer; padding: 8px 13px;
    font-size: 11px; color: var(--tertiary);
    border-top: 0.5px solid var(--separator);
  }
  .task-done-toggle summary:hover { color: var(--label); }
  .task-done-toggle .task-row:first-of-type { border-top: 0.5px solid var(--separator); }

  .reminder-chip {
    display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px;
    font-size: 10.5px; font-weight: 600;
    background: color-mix(in srgb, var(--yellow) 20%, transparent); color: var(--yellow-ink);
  }
  .reminder-chip.overdue { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red-ink); }
  .reminder-chip.none { background: var(--field); color: var(--tertiary); }

  /* A native <select>, styled as a pill -- it's the smallest control that
     cycles four states without four buttons per row. */
  .status-select {
    flex: none; border: none; border-radius: 999px; padding: 3px 9px;
    font-size: 10.5px; font-weight: 650; font-family: inherit; cursor: pointer;
  }

  .pane-filters { display: flex; align-items: center; gap: 10px; margin: 16px 0 4px; flex-wrap: wrap; }
  /* One picker, three places: the meetings filter, the tasks filter, and
     the project on an open meeting -- which until now was a bare, unstyled
     <select> sitting in the middle of a line of text. */
  .pane-filters select, .select {
    font: inherit; font-size: 11.5px; color: var(--label);
    background: var(--field); border: none; border-radius: var(--r-sm);
    padding: 4px 9px; cursor: pointer;
  }
  .detail-field { display: inline-flex; align-items: center; gap: 6px; }
  .filter-chips { display: flex; gap: 4px; }
  .filter-chip {
    font: inherit; font-size: 11px; color: var(--secondary);
    background: var(--field); border: none; border-radius: 999px;
    padding: 4px 10px; cursor: pointer;
  }
  .filter-chip.on { background: var(--accent); color: #fff; }
</style>
</head>
<body>
  <div class="shell">
    <nav class="sidebar" id="shell-nav" role="tablist" aria-label="Sections">
      <button type="button" class="navitem" role="tab" data-pane="overview" aria-selected="true">
        <span class="glyph" style="--tint:#007aff"><svg viewBox="0 0 24 24"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/></svg></span>Overview
      </button>
      <button type="button" class="navitem" role="tab" data-pane="history" aria-selected="false">
        <span class="glyph" style="--tint:#5e5ce6"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8"/></svg></span>History
      </button>
      <button type="button" class="navitem" role="tab" data-pane="meetings" aria-selected="false">
        <span class="glyph" style="--tint:#af52de"><svg viewBox="0 0 24 24"><path d="M9 10a3 3 0 106 0 3 3 0 10-6 0M5 19a7 7 0 0114 0"/></svg></span>Meetings
      </button>
      <button type="button" class="navitem" role="tab" data-pane="tasks" aria-selected="false">
        <span class="glyph" style="--tint:#ff9500"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></span>Tasks
      </button>
      <button type="button" class="navitem" role="tab" data-pane="settings" aria-selected="false">
        <span class="glyph" style="--tint:#8e8e93"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></span>Settings
      </button>
      <!-- The queue lives at the foot of the sidebar, in the space the nav
           items leave empty. Minimal on purpose: it is a status light, not a
           screen -- one line per job, and the detail on hover. -->
      <div class="queue" id="sidebar-queue" hidden>
        <div class="queue-title" id="queue-title"></div>
        <div id="queue-rows"></div>
      </div>
    </nav>
    <main class="content" id="shell-content">
      <div class="pane on" data-pane="overview">
        <div id="overview-live"></div>
        <!-- The tiles answer the same four questions for either stretch, so
             the heading and the toggle sit on one line and the tiles below
             them never change shape. -->
        <div class="head-row">
          <div class="group-title day" id="overview-span-title">Today</div>
          <div class="segmented" id="overview-span" role="group" aria-label="Which stretch the figures cover">
            <button type="button" data-span="today" aria-pressed="true">Today</button>
            <button type="button" data-span="all" aria-pressed="false">All time</button>
          </div>
        </div>
        <!-- Four tiles across a wide window were four wide, shallow bands;
             two by two in half the width reads as figures, and leaves the
             other half for the chart they are the summary of. -->
        <div class="overview-row">
          <div class="tiles" id="overview-tiles"></div>
          <!-- No card around the chart: short columns inside a wide filled
               panel read as an empty band rather than as a chart. -->
          <div class="chart">
            <div class="group-title day chart-title" id="overview-chart-title">Last 8 weeks</div>
            <div class="bars" id="overview-bars"></div>
            <div class="legend" id="overview-legend"></div>
          </div>
        </div>
        <div class="provenance" id="overview-provenance"></div>
        <!-- Where the tasks stand, under the dictation figures and above
             the AI line that produces them. -->
        <div class="group-title day">Tasks</div>
        <div class="task-summary" id="overview-tasks"></div>
        <div class="group-title day">AI</div>
        <div class="card" id="overview-ai"></div>
      </div>
      <div class="pane" data-pane="history"><div id="history-list"></div></div>
      <div class="pane" data-pane="meetings">
        <!-- Three views, one pane: the list, one meeting opened, and the
             voices behind them. Not three panes in the sidebar, because
             they are the same subject at three depths. -->
        <div id="meetings-browse">
          <div class="pane-filters" id="meetings-filters"></div>
          <div id="meeting-search-hits"></div>
          <div id="meetings-list"></div>
        </div>
        <div id="meeting-detail" hidden></div>
        <div id="voices-pane" hidden></div>
        <div id="people-pane" hidden></div>
      </div>
      <div class="pane" data-pane="tasks">
        <div class="pane-filters" id="task-filters"></div>
        <!-- List and one task open beside it. The detail used to expand
             inside the row, which pushed everything under it down the page;
             a task is read while the list it came out of is still in view. -->
        <div class="task-split">
          <div id="task-groups"></div>
          <aside class="task-side" id="task-panel" hidden></aside>
        </div>
      </div>
      <div class="pane" data-pane="settings">
  <!-- SETTINGS_PANE -->
      </div>
    </main>
  </div>
  <!-- WELCOME -->
  <script>
    // Anything this page throws goes to the app's log. There is no console
    // and no inspector in this webview, so an exception inside a click
    // handler is invisible: the click does nothing, the rest of the page
    // carries on, and the button looks unwired. Reported through a binding
    // rather than swallowed, and the page keeps its default behaviour too.
    window.addEventListener('error', function (ev) {
      if (!window.logJS) return;
      var where = (ev.filename || 'page') + ':' + (ev.lineno || 0) + ':' + (ev.colno || 0);
      var stack = (ev.error && ev.error.stack) || '';
      window.logJS(where + ' ' + (ev.message || 'error') + (stack ? ' | ' + stack : ''));
    });
    window.addEventListener('unhandledrejection', function (ev) {
      if (!window.logJS) return;
      var why = ev.reason;
      window.logJS('unhandled rejection: ' + ((why && (why.stack || why.message)) || String(why)));
    });

    // Dictations and meetings are separate stores now (see main_window.go),
    // each with its own flat-or-grouped shape coming over from Go -- so each
    // gets its own render function rather than one filtered by a shared flag.
    function render() {
      // A refresh rebuilds both lists' HTML from scratch; a player mounted
      // in a row that is about to be thrown away would keep playing,
      // invisible and unstoppable, if it weren't stopped first.
      stopPlayer();
      stopTurnPlayer();
      renderDays(document.getElementById('history-list'),
        (window.voxlog && window.voxlog.days) || [], 'No transcripts yet.');
      renderMeetings(document.getElementById('meetings-filters'), document.getElementById('meetings-list'),
        (window.voxlog && window.voxlog.meetings) || [], 'No meetings recorded yet.');
      renderTasks(document.getElementById('task-filters'),
        document.getElementById('task-groups'), (window.voxlog && window.voxlog.tasks) || []);
      renderOverview();
      renderDecodeBanners();
    }

    // Only one recording plays at a time -- two of them talking over each
    // other is never what was wanted. currentPlayer tracks the one <audio>
    // element live in the page, and the row it belongs to.
    var currentPlayer = null;

    function stopPlayer() {
      if (!currentPlayer) return;
      currentPlayer.audio.pause();
      currentPlayer.audio.remove();
      currentPlayer = null;
    }

    // playIn mounts a player for name inside row, stopping whatever was
    // playing before it (including a player already in this same row).
    // preload="none" matters: a day with forty takes must not open forty
    // HTTP requests just because the rows are on screen.
    function playIn(row, name) {
      stopPlayer();
      var audio = document.createElement('audio');
      audio.className = 'player';
      audio.controls = true;
      audio.preload = 'none';
      audio.src = ((window.voxlog && window.voxlog.audioBase) || '') + name;
      row.appendChild(audio);
      currentPlayer = { audio: audio, row: row };
      audio.play().catch(function () {}); // autoplay can be refused; controls still work
    }

    // dictationRowHTML and meetingRowHTML build one .entry row each; every
    // place that lists a dictation or a meeting (History, Meetings, and the
    // Overview pane's Recent card) draws from these two, rather than each
    // keeping its own copy of the row markup.
    // taskHint is the History/Meetings side of Task Hub classification: a row
    // whose entry carries a task_id gets a green accent and a small note
    // pointing at the Tasks pane, so a classified snippet is visible right
    // where it was dictated, not only inside Tasks.
    // One project tag, drawn the same wherever a row names its project:
    // History, Meetings and Overview all call this rather than each building
    // the same span with its own colour lookup.
    function entityTagHTML(name) {
      if (!name) return '';
      return '<span class="tag task-entity-tag" style="--dot:' + entityColor(name) + '">' +
        escapeHtml(name) + '</span>';
    }

    function taskHint(e) {
      if (!e.task_id) return { cls: '', html: '' };
      var tags = '<span class="tag task-detected">Task detected</span>';
      tags += entityTagHTML(e.task_entity);
      if (e.task_status) {
        tags += '<span class="tag ' + taskStatusClass(e.task_status) + '">' +
          escapeHtml(taskStatusLabel[e.task_status] || e.task_status) + '</span>';
      }
      return {
        cls: ' task-detected',
        html: '<div class="meta">' + tags + '</div>' +
          '<div class="hub-note">Added to Task Hub' + (e.task_reminder ? ' · reminder ' + e.task_reminder : '') + '</div>'
      };
    }

    function dictationRowHTML(e, gi, ei) {
      // Index rather than inlining the text: the entry goes back to Go
      // verbatim on click, and round-tripping it through an HTML attribute
      // would mean escaping it correctly twice.
      var body = e.text
        ? '<div class="text">' + escapeHtml(e.text) + '</div>'
        : '<div class="text untranscribed">' +
            (e.has_audio ? 'Not transcribed yet' : 'No transcript, and the audio is gone') +
          '</div>';
      var hint = taskHint(e);

      return '<div class="entry' + hint.cls + '" data-day="' + gi + '" data-entry="' + ei + '">' +
        '<span class="pill" title="Transcription time">' + e.duration_seconds.toFixed(1) + 's</span>' +
        '<div class="body">' +
          body +
          '<div class="meta"><span>' + e.time + '</span>' +
            // Always-on wrote this one; nobody pressed a key for it, and the
            // row should not pretend otherwise.
            (e.auto_started ? '<span class="tag">Heard automatically</span>' : '') +
            // A note exists as a row before its transcript does, so it has to
            // be able to say it is still being read.
            (e.text ? '' : noteStateTagHTML(e)) +
          '</div>' +
          hint.html +
        '</div>' +
        '<div class="acts">' +
          // Clicking the row body already copies (see wireEntries); the
          // button is the same action made visible, same as the meeting
          // row's Copy button.
          (e.text ? '<button type="button" class="act copy">Copy</button>' : '') +
          (e.audio ? '<button type="button" class="act play" data-audio="' + e.audio + '">Play</button>' : '') +
          (e.audio ? '<button type="button" class="act delete-audio" data-audio="' + e.audio + '">Delete audio</button>' : '') +
        '</div>' +
        '<button type="button" class="chev" title="Expand" aria-label="Expand">&#9654;</button>' +
      '</div>';
    }

    function renderDays(root, days, emptyText) {
      var html = '';
      days.forEach(function (group, gi) {
        var rows = '';
        group.entries.forEach(function (e, ei) { rows += dictationRowHTML(e, gi, ei); });
        if (rows) html += '<div class="group-title day">' + group.day + '</div><div class="card">' + rows + '</div>';
      });
      root.innerHTML = html || '<div class="empty">' + emptyText + '</div>';

      wireEntries(root, function (row) {
        var day = days[parseInt(row.dataset.day, 10)];
        return day && day.entries[parseInt(row.dataset.entry, 10)];
      });
    }

    // The meetings screen has three depths: the list, one meeting opened,
    // and the voices behind the speakers in it. They share one pane rather
    // than three sidebar entries, because they are one subject -- and the
    // sidebar is for panes, not for where you happen to be inside one.

    // meetingEntityFilter persists across re-renders (RefreshMainWindowIfOpen
    // re-invokes render() often), so a filter picked once stays picked until
    // the user changes it, not just until the next transcript lands.
    var meetingEntityFilter = '';
    // openMeetingID is which meeting is open, if any. Kept as an id rather
    // than as the row itself so a refresh can redraw it from fresh data.
    var openMeetingID = '';

    function meetingByID(id) {
      var all = (window.voxlog && window.voxlog.meetings) || [];
      for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
      return null;
    }

    // The project a meeting belongs to: the one filed by hand first, then the
    // one implied by a task Task Hub found in it. Before meetings could be
    // filed by hand, only the second existed, which left most of them
    // invisible to the filter.
    function meetingEntity(e) { return e.entity || e.task_entity || ''; }

    // A speaker's colour comes from their number in this meeting, and only
    // the first four get one of their own -- a fifth voice draws neutral
    // rather than borrowing a colour that already means someone else.
    function speakerColor(local) {
      if (local < 0) return 'var(--spk-1)';           // you
      return local < 4 ? 'var(--spk-' + (local + 1) + ')' : 'var(--spk-x)';
    }

    function speakerLabel(local, name) {
      if (name) return name;
      if (local === -1) return 'You';
      if (local === -2) return 'Speaker';             // the two sides were mixed
      return 'Speaker ' + (local + 1);
    }

    function speakerInitials(local, name) {
      if (!name) return local < 0 ? 'Y' : String(local + 1);
      var parts = name.split(/[\s·]+/).filter(Boolean);
      return (parts[0].charAt(0) + (parts[1] ? parts[1].charAt(0) : '')).toUpperCase();
    }

    // talkStripHTML is the whole call as one bar: each person's share, plus
    // whatever nobody was speaking for.
    function talkStripHTML(e) {
      var speakers = e.speakers || [];
      if (!speakers.length) return '';
      var spoken = 0;
      var parts = speakers.map(function (sp) {
        spoken += sp.talk_secs;
        return '<i style="flex:' + Math.max(sp.talk_secs, 0.01) + ';background:' + speakerColor(sp.speaker) + '"></i>';
      }).join('');
      var silence = Math.max((e.recording_seconds || 0) - spoken, 0);
      if (silence > 0) parts += '<i style="flex:' + silence + ';background:var(--silence)"></i>';
      return '<div class="talk-strip" aria-hidden="true">' + parts + '</div>';
    }

    // splitSummary separates a stored summary into its sentences and its
    // action items: the Go side stores them as one string, the items after
    // an "ACTION ITEMS:" line, one "- " line each (llm.ActionItemsLabel).
    function splitSummary(s) {
      var at = s.indexOf('\nACTION ITEMS:');
      if (at === -1) return { text: s, items: [] };
      var items = s.slice(at).split('\n').slice(2).map(function (l) {
        return l.replace(/^\s*-\s*/, '').replace(/^\d{1,2}[.)]\s+/, '').trim();
      }).filter(Boolean);
      return { text: s.slice(0, at).trim(), items: items };
    }

    // meetingSummaryHTML is the meeting's summary and, when it has any, its
    // action items as a list of their own.
    function meetingSummaryHTML(summary) {
      if (!summary) return '';
      var s = splitSummary(summary);
      return (s.text ? '<div class="panel spaced-below"><h3>Summary</h3><div class="summary-text">' + escapeHtml(s.text) + '</div></div>' : '') +
        (s.items.length ? '<div class="panel spaced-below"><h3>Action items &middot; ' + s.items.length + '</h3><ol class="action-items">' +
          s.items.map(function (i) { return '<li>' + escapeHtml(i) + '</li>'; }).join('') + '</ol></div>' : '');
    }

    function meetingCardHTML(e) {
      var summary = e.summary
        ? '<div class="m-sum">' + escapeHtml(splitSummary(e.summary).text) + '</div>'
        : '<div class="m-sum none">' + (e.text
            ? escapeHtml(e.text.slice(0, 220))
            : (e.has_audio ? 'Not transcribed yet' : 'No transcript, and the audio is gone')) + '</div>';

      var avatars = (e.speakers || []).map(function (sp) {
        return '<span class="avatar" style="background:' + speakerColor(sp.speaker) + '" title="' +
          escapeHtml(speakerLabel(sp.speaker, sp.name)) + '">' +
          escapeHtml(speakerInitials(sp.speaker, sp.name)) + '</span>';
      }).join('');

      var entity = meetingEntity(e);
      var tags = entity ? '<span class="tag">' + escapeHtml(entity) + '</span>' : '';
      if (e.task_id) tags += '<span class="tag">Task found</span>';
      tags += decodeTagHTML(e);

      // No buttons on a card. A row answers "what was this"; the actions
      // over a meeting live inside it, where you have already seen it. The
      // "Not transcribed" tag above already says there is something to do.

      return '<button type="button" class="meeting-card" data-id="' + escapeHtml(e.id) + '">' +
        // The title leads where there is one, with the clock beside it; a
        // meeting recorded before titles existed reads as it always did.
        '<div class="m-top"><span class="m-title">' + escapeHtml(e.title || e.time) + '</span>' +
          (e.title ? '<span class="m-when">' + escapeHtml(e.time) + '</span>' : '') +
          '<span class="m-when">' + duration(e.recording_seconds) + '</span>' + tags +
        '</div>' +
        summary +
        talkStripHTML(e) +
        '<div class="m-foot"><span class="avatars">' + avatars + '</span>' +
          '<span class="tag">' + ((e.speakers || []).length
            ? (e.speakers.length === 1 ? '1 speaker' : e.speakers.length + ' speakers')
            : 'no speaker data') + '</span>' +
        '</div>' +
      '</button>';
    }

    function renderMeetingFilter(root, meetings) {
      var names = [];
      meetings.forEach(function (m) {
        var name = meetingEntity(m);
        if (name && names.indexOf(name) === -1) names.push(name);
      });
      // Every project the user has configured, not only the ones already
      // used: filing a meeting under a project it has never been in is the
      // main thing the picker is for.
      ((window.voxlog && window.voxlog.settings && window.voxlog.settings.entity_dictionary) || [])
        .forEach(function (name) { if (name && names.indexOf(name) === -1) names.push(name); });
      names.sort();
      if (meetingEntityFilter && names.indexOf(meetingEntityFilter) === -1) meetingEntityFilter = '';

      root.innerHTML =
        '<select id="meeting-filter-entity">' + entityOptionsHTML(names, meetingEntityFilter, 'All projects') + '</select>' +
        '<input type="search" id="meeting-search" class="filter-search" placeholder="Search meetings" value="' + escapeHtml(meetingQuery) + '">' +
        '<button type="button" class="act" id="open-people">People</button>' +
        '<button type="button" class="act" id="open-voices">Voices</button>';

      root.querySelector('#meeting-filter-entity').addEventListener('change', function (ev) {
        meetingEntityFilter = ev.target.value;
        render();
      });
      var search = root.querySelector('#meeting-search');
      search.addEventListener('input', function (ev) {
        meetingQuery = ev.target.value;
        renderMeetingList(document.getElementById('meetings-list'),
          (window.voxlog && window.voxlog.meetings) || [], 'No meetings recorded yet.');
        // The list filter above only sees the summary and the flat
        // transcript; this searches the stored replies of every meeting, so
        // a half-remembered sentence finds the moment it was said.
        searchAllTranscripts(meetingQuery);
      });
      // Wrapped, not passed straight in: as a listener, openVoices would take
      // the click event as its row argument.
      root.querySelector('#open-voices').addEventListener('click', function () { openVoices(0); });
      root.querySelector('#open-people').addEventListener('click', openPeople);
    }

    var meetingQuery = '';

    function renderMeetingList(root, allMeetings, emptyText) {
      var query = meetingQuery.toLowerCase();
      var meetings = allMeetings.filter(function (m) {
        if (meetingEntityFilter && meetingEntity(m) !== meetingEntityFilter) return false;
        if (!query) return true;
        return (m.summary + ' ' + m.text + ' ' + meetingEntity(m)).toLowerCase().indexOf(query) !== -1;
      });

      var byDay = [], indexByDay = {};
      meetings.forEach(function (m) {
        if (!(m.day in indexByDay)) {
          indexByDay[m.day] = byDay.length;
          byDay.push({ day: m.day, entries: [] });
        }
        byDay[indexByDay[m.day]].entries.push(m);
      });

      var html = '';
      byDay.forEach(function (group) {
        html += '<div class="group-title day">' + group.day + '</div><div class="meeting-list">' +
          group.entries.map(meetingCardHTML).join('') + '</div>';
      });
      var empty = (meetingEntityFilter || meetingQuery) && allMeetings.length
        ? 'No meetings match that.' : emptyText;
      root.innerHTML = html || '<div class="empty">' + empty + '</div>';

      root.querySelectorAll('.meeting-card').forEach(function (card) {
        card.addEventListener('click', function () { openMeeting(card.dataset.id); });
      });
    }

    function renderMeetings(filtersRoot, root, allMeetings, emptyText) {
      renderMeetingFilter(filtersRoot, allMeetings);
      renderMeetingList(root, allMeetings, emptyText);
      // A refresh while a meeting is open redraws it from the new data
      // rather than throwing the user back to the list mid-read.
      if (openMeetingID) {
        if (meetingByID(openMeetingID)) openMeeting(openMeetingID);
        else showMeetingView('browse');
      }
    }

    function showMeetingView(which) {
      document.getElementById('meetings-browse').hidden = which !== 'browse';
      document.getElementById('meeting-detail').hidden = which !== 'detail';
      document.getElementById('voices-pane').hidden = which !== 'voices';
      document.getElementById('people-pane').hidden = which !== 'people';
      if (which !== 'detail') { stopTurnPlayer(); openMeetingID = ''; }
    }

    // ---- one meeting, opened -------------------------------------------

    // A silent placeholder and a hang look identical. Anything that waits on
    // a binding puts its "Loading…" up through this: after a second the text
    // starts counting, so a pane that is still working says so, and a pane
    // that died says that instead (see the .catch on every caller).
    var waitingTicker = null;

    function showWaiting(paneID, text) {
      stopWaiting();
      var started = Date.now();
      var pane = document.getElementById(paneID);
      if (!pane) return;
      pane.innerHTML = '<div class="empty" id="waiting-note">' + escapeHtml(text) + '</div>';
      waitingTicker = setInterval(function () {
        var note = document.getElementById('waiting-note');
        if (!note) { stopWaiting(); return; }
        var secs = Math.round((Date.now() - started) / 1000);
        if (secs >= 1) note.textContent = text + ' (' + secs + 's)';
      }, 1000);
    }

    function stopWaiting() {
      if (waitingTicker) { clearInterval(waitingTicker); waitingTicker = null; }
    }

    function showPaneError(paneID, err) {
      stopWaiting();
      var pane = document.getElementById(paneID);
      if (!pane) return;
      pane.innerHTML = '<div class="empty">' + escapeHtml(String(err && err.message ? err.message : err)) + '</div>';
    }

    var detailTurns = [], detailSpeakers = [], detailMeeting = null, turnQuery = '';
    // Who the unnamed speakers might be (Go's 0.55-0.72 band), which speaker
    // row is being named in place, and whether the list is capped at five.
    // Module-level, like taskFilter, so a refresh from Go does not close what
    // the user is in the middle of.
    var detailSuggestions = [], editingSpeaker = 0, speakersShowAll = false;
    // Which reply's "who said this?" picker is open, by seq. -1 is none.
    var editingTurn = -1;

    function openMeeting(id) {
      var meeting = meetingByID(id);
      if (!meeting) return;
      openMeetingID = id;
      detailMeeting = meeting;
      showMeetingView('detail');
      showWaiting('meeting-detail', 'Loading the transcript…');

      window.meetingDetail(id).then(function (detail) {
        // A second click landed elsewhere while this was in flight.
        if (openMeetingID !== id) return;
        stopWaiting();
        detailTurns = (detail && detail.turns) || [];
        detailSpeakers = (detail && detail.speakers) || [];
        detailSuggestions = (detail && detail.suggestions) || [];
        editingSpeaker = 0;
        editingTurn = -1;
        speakersShowAll = false;
        renderMeetingDetail();
        scrollToPendingTurn();
      }).catch(function (err) {
        if (openMeetingID !== id) return;
        showPaneError('meeting-detail', err);
      });
    }

    // openMeetingAtTurn opens a meeting and scrolls to one reply. The seq is
    // carried rather than the row index: the index is a position in whatever
    // detailTurns happens to hold, and a re-decode between the search and
    // the click would move it.
    var pendingTurnSeq = -1;

    function openMeetingAtTurn(id, seq) {
      pendingTurnSeq = typeof seq === 'number' ? seq : -1;
      openMeeting(id);
    }

    function scrollToPendingTurn() {
      if (pendingTurnSeq < 0) return;
      var seq = pendingTurnSeq;
      pendingTurnSeq = -1;
      var index = -1;
      for (var i = 0; i < detailTurns.length; i++) {
        if (detailTurns[i].seq === seq) { index = i; break; }
      }
      if (index < 0) return;
      var row = document.querySelector('#meeting-detail .turn-row[data-turn="' + index + '"]');
      if (!row) return;
      row.scrollIntoView({ block: 'center' });
      // Same highlight the player uses, so "the one you came here for" and
      // "the one that is playing" look the same -- they usually are.
      row.classList.add('playing');
    }

    function speakerByLocal(local) {
      for (var i = 0; i < detailSpeakers.length; i++) {
        if (detailSpeakers[i].speaker === local) return detailSpeakers[i];
      }
      return null;
    }

    function statsHTML(meeting) {
      if (!detailSpeakers.length) return '';
      var total = meeting.recording_seconds || 0;
      var spoken = detailSpeakers.reduce(function (a, sp) { return a + sp.talk_secs; }, 0);
      if (!total) total = spoken;

      var share = detailSpeakers.map(function (sp) {
        return '<i style="flex:' + Math.max(sp.talk_secs, 0.01) + ';background:' + speakerColor(sp.speaker) +
          '" title="' + escapeHtml(speakerLabel(sp.speaker, sp.name)) + '"></i>';
      }).join('');
      var silence = Math.max(total - spoken, 0);
      if (silence > 0) share += '<i style="flex:' + silence + ';background:var(--silence)"></i>';

      // Five speakers, then the rest on request. A meeting where the
      // diarizer heard eight people drew eight rows, and the panel became
      // the tallest thing on the screen for the sake of somebody who said
      // two words.
      var shownSpeakers = speakersShowAll ? detailSpeakers : detailSpeakers.slice(0, VOICE_PAGE);
      var rows = shownSpeakers.map(function (sp) {
        var pct = total ? Math.round(sp.talk_secs / total * 100) : 0;
        // Naming is only offered where it can mean something: a speaker with
        // no voice fingerprint cannot be recognised anywhere else, so a name
        // on them would be a label that never travels.
        // ...and where it cannot, the row says why. A missing button with no
        // explanation reads as a bug in the app rather than as a fact about
        // the recording.
        var nameBtn = sp.identified
          ? '<button type="button" class="name-btn" data-name-speaker="' + sp.row + '">' +
              (sp.name ? 'Rename' : 'Name this voice') + '</button>'
          : '<span class="tag" title="Too little speech to recognise this voice anywhere else">No voice print</span>';
        // The sample is this speaker's longest reply, played out of the
        // recording that is already open -- the same path the transcript's
        // own play buttons take, so there is one player and one highlight.
        var longestTurn = longestTurnOf(sp.speaker);
        var play = '<button type="button" class="play sm"' +
          (longestTurn < 0 ? ' disabled title="Nothing of theirs is on disk to play"' : ' data-play-turn="' + longestTurn + '"') +
          ' aria-label="Play a sample of ' + escapeHtml(speakerLabel(sp.speaker, sp.name)) + '">&#9654;</button>';

        var form = editingSpeaker === sp.row
          ? '<form class="spk-form" data-name-form="' + sp.row + '">' +
              '<input list="known-voices" value="' + escapeHtml(sp.name || '') + '" autocomplete="off"' +
                ' placeholder="Their name, or somebody already known" aria-label="Speaker name">' +
              '<button type="button" class="act primary" data-save-speaker="' + sp.row + '">Save</button>' +
              '<button type="button" class="act" data-cancel-speaker="1">Cancel</button>' +
            '</form>'
          : '';

        // The band Go is not allowed to decide in. It computes this on every
        // decode and used to throw it away, which left the user retyping a
        // name the app had already all but worked out.
        var guess = guessFor(sp.row);
        var guessHTML = (guess && !sp.name && editingSpeaker !== sp.row)
          ? '<span class="guess">Sounds like <b>' + escapeHtml(guess.name) + '</b> · ' + guess.score.toFixed(2) +
              '<button type="button" class="act" data-confirm-speaker="' + sp.row + ':' + guess.voice_id + '">Confirm</button>' +
              '<button type="button" class="act" data-reject-speaker="' + sp.row + '">Not them</button></span>'
          : '';

        return '<div class="spk-row" data-speaker-row="' + sp.row + '">' +
          '<span class="spk-name">' + play +
            '<span class="swatch" style="background:' + speakerColor(sp.speaker) + '"></span>' +
            '<b>' + escapeHtml(speakerLabel(sp.speaker, sp.name)) + '</b>' +
            '<span class="spk-acts">' + nameBtn + '</span></span>' +
          '<span class="spk-figs"><b>' + pct + '%</b> ' + clockTime(sp.talk_secs) + '</span>' +
          '<span class="spk-bar"><i style="width:' + pct + '%;background:' + speakerColor(sp.speaker) + '"></i></span>' +
          guessHTML + form +
        '</div>';
      }).join('');
      if (!speakersShowAll && detailSpeakers.length > VOICE_PAGE) {
        rows += '<button type="button" class="act quiet" id="show-all-speakers">Show all ' +
          detailSpeakers.length + '</button>';
      }

      var longest = detailTurns.reduce(function (best, t) {
        return (t.end - t.start) > (best ? best.end - best.start : 0) ? t : best;
      }, null);

      return '<div class="stats-row">' +
        '<div class="panel"><h3>Talk time</h3>' +
          '<div class="talk-strip tall">' + share + '</div>' +
          '<div class="spk-rows">' + rows + '</div></div>' +
        '<div class="panel"><h3>At a glance</h3><div class="facts">' +
          '<div class="fact"><b>' + detailSpeakers.length + '</b><span>speakers</span></div>' +
          '<div class="fact"><b>' + detailTurns.length + '</b><span>replies</span></div>' +
          '<div class="fact"><b>' + (longest ? clockTime(longest.end - longest.start) : '—') + '</b><span>longest stretch' +
            (longest ? ' · ' + escapeHtml(speakerLabel(longest.speaker, longest.name)) : '') + '</span></div>' +
          '<div class="fact"><b>' + (total ? Math.round(silence / total * 100) : 0) + '%</b><span>silence</span></div>' +
        '</div></div></div>';
    }

    // longestTurnOf is the index of the most audio one speaker produced in
    // one piece: the best few seconds to judge a voice by, and the same
    // choice Go makes when it cuts a stored sample (unnamedSpeakerSQL).
    function longestTurnOf(localID) {
      var best = -1, bestLen = 0;
      detailTurns.forEach(function (t, i) {
        var len = t.end - t.start;
        if (t.speaker === localID && len > bestLen) { best = i; bestLen = len; }
      });
      return best;
    }

    function guessFor(row) {
      var found = null;
      detailSuggestions.forEach(function (g) { if (g.row === row) found = g; });
      return found;
    }

    function highlightTurn(text) {
      if (!turnQuery) return escapeHtml(text);
      var lower = text.toLowerCase(), needle = turnQuery.toLowerCase();
      var out = '', at = 0, hit;
      while ((hit = lower.indexOf(needle, at)) !== -1) {
        out += escapeHtml(text.slice(at, hit)) + '<mark>' + escapeHtml(text.slice(hit, hit + needle.length)) + '</mark>';
        at = hit + needle.length;
      }
      return out + escapeHtml(text.slice(at));
    }

    function turnsHTML() {
      if (!detailTurns.length) {
        return '<p class="hint">No replies stored for this meeting yet. Older recordings are re-read in the background; ' +
          'until then the transcript above is all there is.</p>';
      }
      var rows = detailTurns.map(function (t, i) {
        var name = speakerLabel(t.speaker, t.name);
        var hidden = turnQuery && t.text.toLowerCase().indexOf(turnQuery.toLowerCase()) === -1;
        // The name is a button: diarization is wrong often enough that the
        // person listening has to be able to say so, and the reply they are
        // reading is where they know it.
        return '<div class="turn-row' + (t.corrected ? ' turn-corrected' : '') + '" data-turn="' + i + '"' + (hidden ? ' hidden' : '') + '>' +
          '<span class="turn-at">' + clockTime(t.start) + '</span>' +
          '<span><button type="button" class="turn-who" data-who-turn="' + t.seq + '" style="color:' + speakerColor(t.speaker) + '"' +
            ' title="' + (t.corrected ? 'You said this is ' + escapeHtml(name) + ' -- click to change' : 'Click if this was someone else') + '">' +
            escapeHtml(name) + (t.corrected ? '<i class="turn-fixed" aria-hidden="true"></i>' : '') + '</button>' +
            highlightTurn(t.text) + '</span>' +
          '<button type="button" class="turn-play" data-play-turn="' + i + '" aria-label="Play this reply">&#9654;</button>' +
          (editingTurn === t.seq ? whoPickerHTML(t) : '') +
        '</div>';
      }).join('');
      return '<div class="turns">' + rows + '</div>';
    }

    // Who said this. The other speakers of this meeting first, because the
    // common repair is "this is the same person as that one"; then a field for
    // anybody else.
    //
    // Moving a reply to an unnamed speaker asks for their name. It has to: a
    // correction outlives the decode that produced it, and the only thing in
    // this meeting that also outlives it is a voice. A speaker number does
    // not survive being decoded again.
    function whoPickerHTML(t) {
      var others = detailSpeakers.filter(function (sp) {
        return sp.speaker !== t.speaker && sp.speaker !== -1 && sp.speaker !== -2;
      });
      var buttons = others.map(function (sp) {
        var label = speakerLabel(sp.speaker, sp.name);
        return '<button type="button" class="act who-pick" data-who-pick="' + t.seq + ':' + sp.voice_id + '"' +
          ' data-who-name="' + escapeHtml(label) + '">' +
          '<span class="swatch" style="background:' + speakerColor(sp.speaker) + '"></span>' +
          escapeHtml(label) + (sp.voice_id ? '' : ' <i class="who-unnamed">needs a name</i>') + '</button>';
      }).join('');

      return '<form class="who-form" data-who-form="' + t.seq + '">' +
        '<div class="who-picks">' + (buttons || '<span class="hint">Nobody else spoke in this meeting.</span>') + '</div>' +
        '<input list="known-voices" autocomplete="off" placeholder="Or somebody else, by name" aria-label="Who said this">' +
        '<button type="button" class="act primary" data-who-save="' + t.seq + '">Save</button>' +
        (t.corrected ? '<button type="button" class="act" data-who-clear="' + t.seq + '">Undo</button>' : '') +
